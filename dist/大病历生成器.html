        '腹部触诊（浅触/深触/肝/脾）',
        '第 3 页·腹部',
        10, earned,
        tips.join(''),
        { note: note, isDefault: defaults.length > 0 && r.miss.length === 0 }
      ));
    }

    /* ---------- 神经系统及四肢（第 3 页，20 分） ---------- */

    // 腱反射、布氏征、克氏征、巴氏征（每项 2 分）8 分 ——第 3 页
    {
      const subs = [
        { g: 'nervousPE', k: 'tendonReflex', share: 2, label: '腱反射' },
        { g: 'nervousPE', k: 'brudzinski', share: 2, label: '布氏征（Brudzinski）' },
        { g: 'nervousPE', k: 'kernig', share: 2, label: '克氏征（Kernig）' },
        { g: 'nervousPE', k: 'babinski', share: 2, label: '巴氏征（Babinski）' }
      ];
      const r = specScoreWithParent(rec, subs,
        { g: 'nervousPE', k: 'nerve' },
        { share: 4, label: '神经反射（合并描述）' });
      const earned = r.earned;
      const tips = [];
      const defaults = r.defaults.slice();
      let note = '';
      if (r.earned && !subs.some(s => peFilled(rec, s.g, s.k))) {
        note = '当前用「生理反射存在，病理反射未引出」一句覆盖；评分表把腱反射/布氏征/克氏征/巴氏征分成四项各 2 分，逐项写更稳。';
      }
      if (r.miss.length) tips.push('还缺逐项记录：' + r.miss.join('、') + '（每项 2 分，共 8 分）。');
      if (defaults.length) tips.push(defaultHint(defaults));
      items.push(item(
        '神经系统（腱反射/布氏征/克氏征/巴氏征）',
        '第 3 页·神经系统及四肢',
        8, earned,
        tips.join(''),
        { note: note, isDefault: defaults.length > 0 && r.miss.length === 0 }
      ));
    }

    // 四肢肌力和双侧膝跳反射（每项 2 分）4 分 ——第 3 页
    {
      const subs = [
        { g: 'spine', k: 'limbMuscle', share: 2, label: '四肢肌力' },
        { g: 'spine', k: 'kneeJerk', share: 2, label: '双侧膝跳反射' }
      ];
      const r = specScoreWithParent(rec, subs,
        { g: 'spine', k: 'limbs' },
        { share: 2, label: '四肢（合并描述）' });
      const earned = r.earned;
      const tips = [];
      const defaults = r.defaults.slice();
      let note = '';
      if (r.earned && !subs.some(s => peFilled(rec, s.g, s.k))) {
        note = '当前四肢只有「无畸形、活动自如」一句；评分表另要四肢肌力和双侧膝跳反射各 2 分。';
      }
      if (r.miss.length) tips.push('还缺：' + r.miss.join('、') + '（每项 2 分）。');
      if (defaults.length) tips.push(defaultHint(defaults));
      items.push(item(
        '四肢肌力与双侧膝跳反射',
        '第 3 页·神经系统及四肢',
        4, earned,
        tips.join(''),
        { note: note, isDefault: defaults.length > 0 && r.miss.length === 0 }
      ));
    }

    // 下肢水肿的按压检查（检查双侧踝部和胫前，每项 2 分）4 分 ——第 3 页
    {
      const subs = [
        { g: 'spine', k: 'edemaAnkle', share: 2, label: '双侧踝部' },
        { g: 'spine', k: 'edemaPretibial', share: 2, label: '胫前' }
      ];
      const r = specScore(rec, subs);
      const tips = [];
      const defaults = r.defaults.slice();
      let note = '';
      // 父项兜底：spine.limbs 里写了「水肿」时给 2 分保底（取较大值，保证填更多不降分）
      let earned = r.earned;
      if (/水肿/.test(peUserText(rec, 'spine', 'limbs'))) {
        earned = Math.max(earned, 2);
        if (peIsDefault(rec, 'spine', 'limbs')) defaults.push('四肢水肿（合并描述）');
        if (!r.earned) {
          note = '当前只有一句概括的「双下肢水肿」；评分表要求分别按压双侧踝部和胫前，各 2 分。';
        }
      }
      if (r.miss.length) tips.push('还缺按压记录：' + r.miss.join('、') + '（每项 2 分）。');
      if (defaults.length) tips.push(defaultHint(defaults));
      items.push(item(
        '下肢水肿（踝部/胫前按压）',
        '第 3 页·神经系统及四肢',
        4, earned,
        tips.join(''),
        { note: note, isDefault: defaults.length > 0 && r.miss.length === 0 }
      ));
    }

    // 足背动脉、桡动脉搏动（双侧对比检查，每项 2 分）4 分 ——第 3 页
    {
      const subs = [
        { g: 'spine', k: 'dorsalisPedis', share: 2, label: '足背动脉搏动' },
        { g: 'spine', k: 'radialPulse', share: 2, label: '桡动脉搏动' }
      ];
      const r = specScore(rec, subs);
      const tips = [];
      if (r.miss.length) tips.push('还缺：' + r.miss.join('、') + '（每项 2 分，需双侧对比）。');
      if (r.defaults.length) tips.push(defaultHint(r.defaults));
      items.push(item(
        '足背动脉/桡动脉搏动（双侧对比）',
        '第 3 页·神经系统及四肢',
        4, r.earned,
        tips.join(''),
        { isDefault: r.defaults.length > 0 && r.miss.length === 0 }
      ));
    }

    /* ---------- 重点查体（第 4 页，15 分） ---------- */

    {
      // 只统计「真的能写出内容」的重点查体项：
      //  - key 能解析到 schema 里的查体项
      //  - 该项用户确实填过（默认值不算，否则等于把没查的列成重点）
      //  - 父项已被子项接管时不计（生成器也会跳过它）
      // 否则会出现「三个空子项 + 一个非法 key 也拿 15/15」，
      // 而 buildFocusPE 实际只输出一句 note（reviewer 实测 H3）。
      const focus = obj(rec.focusPE);
      const rawKeys = arr(focus.keys).map(txt).filter(Boolean);
      const noteText = txt(focus.note);
      const S = schemaOf();
      const usableKeys = [];
      rawKeys.forEach(ref => {
        const dot = ref.indexOf('.');
        if (dot <= 0) return;
        const g = ref.slice(0, dot);
        const k = ref.slice(dot + 1);
        let itemDef = null;
        if (typeof S.findPEItem === 'function') {
          itemDef = S.findPEItem(ref);
        }
        if (!itemDef) return;
        const store = obj(obj(rec.pe)[g]);
        const filled = typeof S.peItemFilled === 'function'
          ? S.peItemFilled(store, itemDef)
          : !!txt(store[k]);
        if (!filled) return;
        if (!g.startsWith('special_') && typeof S.parentSupersededByChild === 'function' &&
          S.parentSupersededByChild(store, g, k)) return;
        usableKeys.push(ref);
      });

      let earned = 0;
      const miss = [];
      if (usableKeys.length >= 3) earned += 8;
      else if (usableKeys.length > 0) earned += 4;
      else if (rawKeys.length) miss.push('已标记的项都还没有查体内容（先填写对应查体项，重点查体才有内容可写）');
      else miss.push('标记本例的重点查体部位');
      if (noteText) earned += 7;
      else miss.push('说明重点查体与诊断思路/鉴别关键点的关系');
      items.push(item(
        '重点查体（结合病史，主次分明）',
        '第 4 页·重点查体',
        15, earned,
        miss.length
          ? '还缺：' + miss.join('；') + '。这 15 分看的是「会不会挑重点」——' +
            '挑出与主诉/主要阳性体征直接相关的 3 项左右，再补一句为什么查这些。'
          : '',
        {
          note: (usableKeys.length && usableKeys.length < 3)
            ? '目前有内容可写的重点查体 ' + usableKeys.length + ' 项，建议 3 项左右。'
            : ''
        }
      ));
    }

    /* ---------- 专科查体（按科室，属于「系统查体完整」的一部分） ---------- */

    if (specialKeys.length) {
      let total = 0;
      const miss = [];
      const defaults = [];
      specialKeys.forEach(spKey => {
        const sp = S && S.PE_SPECIAL ? S.PE_SPECIAL[spKey] : null;
        if (!sp) return;
        arr(sp.items).forEach(it => {
          total += 1;
          const label = it.label || it.key;
          if (!peFilled(rec, 'special_' + spKey, it.key)) { miss.push(label); return; }
          if (peIsDefault(rec, 'special_' + spKey, it.key)) defaults.push(label);
        });
      });
      if (total > 0) {
        const tips = [];
        if (miss.length) tips.push('还缺专科查体记录：' + miss.join('、') + '。');
        if (defaults.length) tips.push(defaultHint(defaults));
        items.push(item(
          '专科查体（' + (dept ? dept.name : deptKey) + '）',
          '第 3 页·系统查体完整性／第 6 页·体格检查「专科体检记录完整」',
          0, 0,
          tips.join(''),
          {
            kind: KIND_ADVISORY, weight: 3,
            status: miss.length ? 'weak' : 'ok',
            isDefault: miss.length === 0 && defaults.length > 0
          }
        ));
      }
    }

    /* ---------- 有鉴别诊断意义的阴性体征（提醒项，计分在第 6 页书写表） ---------- */

    {
      let negCount = 0;
      let totalCount = 0;
      if (S) {
        arr(S.PE_COMMON).forEach(g => {
          arr(g.items).forEach(it => {
            if (!peFilled(rec, g.key, it.key)) return;
            totalCount += 1;
            const v = peUserVal(rec, g.key, it.key);
            // 默认描述里本来就写着「未见/无」——那是模板，不是用户写的阴性体征
            if (peIsDefault(rec, g.key, it.key)) return;
            if (NEG_WORDS.test(v)) negCount += 1;
          });
        });
      }
      let status;
      let sug;
      if (!totalCount) {
        status = 'missing';
        sug = '还缺有鉴别诊断意义的阴性体征：与主诉相关但本例没有的体征，要写明「阴性」（如「无双下肢水肿」「未闻及哮鸣音」）。';
      } else if (negCount >= 3) {
        status = 'ok';
        sug = '';
      } else {
        status = 'weak';
        sug = '目前你自己写的阴性体征只有 ' + negCount + ' 处，建议再为每个需要鉴别的方向补一句「阴性」' +
          '（第 6 页·体格检查「有鉴别诊断意义的阴性体征无遗漏」）。';
      }
      items.push(item(
        '有鉴别诊断意义的阴性体征',
        '第 6 页·入院记录·体格检查',
        0, 0, sug, { kind: KIND_ADVISORY, weight: 4, status: status }
      ));
    }

    /* ---------- 现场动作（B 类，第 3-4 页） ---------- */

    {
      const prep = obj(obj(rec.exam).pePrep);
      const got = (prep.warmHands ? 1 : 0) + (prep.tellIntent ? 1 : 0);
      items.push(item(
        '查体准备（暖手与听诊器/告知患者意图）',
        '第 3 页·一般情况及头颈部',
        0, 0,
        '还缺：查体前暖手、捂热听诊器并告知患者要做什么（各 1 分）。这是现场动作，不会写进病历。',
        { kind: KIND_PROCESS, weight: 2, status: got === 2 ? 'ok' : (got === 1 ? 'weak' : 'missing') }
      ));
    }
    {
      const overall = obj(obj(rec.exam).peOverall);
      const got = ['technique', 'fluent', 'humane', 'timely'].filter(k => overall[k]).length;
      items.push(item(
        '整体评价（手法规范/熟练有序/人文关怀/完成及时）',
        '第 4 页·整体评价',
        0, 0,
        '还缺：手法规范 1 分、查体熟练有序 1 分、人文关怀 2 分、完成及时 1 分。现场动作项，不进病历正文。',
        { kind: KIND_PROCESS, weight: 3, status: got >= 4 ? 'ok' : (got > 0 ? 'weak' : 'missing') }
      ));
    }

    return finalize({
      station: '体格检查',
      key: 'physical',
      page: '第 3-4 页',
      processMaxScore: 7,   // 查体准备 2 + 整体评价 5
      fullMaxScore: 100,
      notes: [
        '本工具可核对的病历文本分合计 93 分；查体准备 2 分、整体评价 5 分（合计 7 分）属于现场动作评分。',
        '生成器会自动补「正常」描述，所以区域类检查通常在默认状态下就已覆盖；' +
        '真正需要逐项补的是腹部四项触诊、神经四项、四肢六项这些按项给分的位置。'
      ]
    }, items);
  }

  /* =====================================================================
   * 六、考站三 · 首次病程录（第 5 页，100 分）
   *
   *   S 主观简要病史 15 = 概括简练重点突出 10 + 与病史采集一致 5
   *   O 客观记录     10 = 有意义的体格检查 5 + 相关辅助检查 5
   *   A 评估与鉴别   40 = 依据(5+5+5) + 主次排序 10 + 鉴别 10 + 不跑题 5
   *   P 诊疗计划     25 = 符合原则 10 + 与诊断对应 10 + 个体化 5
   *   总体           10 = 简洁扼要 5 + 字迹整洁 5（卷面分，本工具不计分）
   * =================================================================== */

  function soapOf(rec) {
    const s = obj(rec.soap);
    return { s: obj(s.s), o: obj(s.o), a: obj(s.a), p: obj(s.p) };
  }

  function diagnosisList(rec) {
    return arr(obj(rec.diagnosis).confirmed).map(txt).filter(Boolean);
  }

  function auxAvailable(rec) {
    return arr(obj(rec.auxiliary).items).some(it => isS(obj(it).name) || isS(obj(it).result));
  }

  /** 病历里是否已经有阳性体征（用于判断 O 段能否从查体里挑） */
  function positivePECount(rec) {
    const S = schemaOf();
    if (!S) return 0;
    let n = 0;
    arr(S.PE_COMMON).forEach(g => {
      arr(g.items).forEach(it => {
        if (!peFilled(rec, g.key, it.key)) return;
        // 默认描述写的都是「正常/未见」，不是阳性体征，不能拿来当「可摘的阳性发现」
        if (peIsDefault(rec, g.key, it.key)) return;
        const v = peUserVal(rec, g.key, it.key);
        if (NEG_WORDS.test(v)) return;
        n += 1;
      });
    });
    return n;
  }

  /** 在数组里按诊断名找一条记录（容错：包含即算命中） */
  function matchEntry(list, name) {
    const n = txt(name);
    if (!n) return null;
    return arr(list).find(e => {
      const d = txt(obj(e).diagnosis);
      return d && (d === n || n.indexOf(d) >= 0 || d.indexOf(n) >= 0);
    }) || null;
  }

  const CN_NUM = {
    '1': '一', '2': '二', '3': '三', '4': '四', '5': '五',
    '6': '六', '7': '七', '8': '八', '9': '九', '10': '十'
  };

  /**
   * 病史采集里的时长线索，用于核对 S 段与病史是否一致。
   * 返回「同义写法」数组：任一个出现在 S 段就算对上了，
   * 不能因为写了「3 天」而没写「三天」就误报不一致。
   */
  function durationVariants(rec) {
    const b = obj(rec.basic);
    const n = txt(b.chiefComplaintDuration);
    const u = txt(b.chiefComplaintDurationUnit);
    if (!n) return [];
    const units = [u];
    // 单位的中文同义写法（天/日）也一并认
    if (u === '天') units.push('日');
    if (u === '日') units.push('天');
    const out = [];
    units.filter(Boolean).forEach(x => {
      out.push(n + x);
      if (CN_NUM[n]) out.push(CN_NUM[n] + x);
    });
    return out.filter(Boolean);
  }

  /** 把文字按句子切开（用于判断堆砌/重复） */
  function clauses(text) {
    return String(text || '').split(/[，,。；;、]/).map(s => s.trim()).filter(Boolean);
  }

  function checkFirstCourse(r) {
    const rec = norm(r);
    const { s, o, a, p } = soapOf(rec);
    const dx = diagnosisList(rec);
    const hasAux = auxAvailable(rec);
    const posPE = positivePECount(rec);
    const items = [];

    /* ---------- S 主观简要病史（15 分） ---------- */

    // 对现病史概括简练、重点突出 10 分 ——第 5 页·S
    {
      const v = txt(s.summary);
      const hpiAny = hasAny(obj(rec.hpi), ['onset', 'cause', 'symptoms', 'evolution', 'accompanying', 'treatment']);
      let earned = 0;
      let status;
      const tips = [];
      if (!v) {
        if (hpiAny) {
          // 现病史有内容可压缩，但 S 段本身没写就不给分——
          // 给"鼓励分"会让空 SOAP 白拿 5 分，与「自查还缺什么」的目的相反。
          earned = 0;
          status = 'missing';
          tips.push('S 段还空着：现病史已经有内容，可以按「主诉 + 关键阳性 + 关键阴性」压成 3-5 句写进来（10 分）');
        } else {
          status = 'missing';
          tips.push('S 段还空着，现病史也还没有内容（10 分）');
        }
      } else if (v.length < 30) {
        earned = 6;
        status = 'weak';
        tips.push('S 段只有 ' + v.length + ' 字，病历特点「概括简练」不等于「只写一句」');
      } else if (v.length > 400) {
        earned = 7;
        status = 'weak';
        tips.push('S 段 ' + v.length + ' 字偏长，病历特点应当比现病史短，建议压缩');
      } else {
        earned = 10;
        status = 'ok';
      }
      items.push(item('S 段—对现病史概括简练、重点突出', '第 5 页·主观简要病史(S)',
        10, earned, tips.join('；') + (tips.length ? '。' : ''), { status: status }));
    }

    // 与病史采集病案的信息一致 5 分 ——第 5 页·S
    //
    // 只读 S 段本身。原先用 `txt(s.summary) || txt(hpi.symptoms)` 兜底，
    // 导致「S 段完全没写、只要现病史有字」就能拿 5/5（reviewer 实测 H2），
    // 而且补写一句短摘要后一致性分反而从 5 降到 3，破坏单调性。
    {
      const v = txt(s.summary);
      const variants = durationVariants(rec);
      const cc = txt(obj(rec.basic).chiefComplaint);
      const ccKeys = cc ? clauses(cc).filter(x => x.length >= 2 && !/[0-9０-９]/.test(x)) : [];
      // 时长：任意一种同义写法出现在 S 段就算一致
      const missingToken = variants.length && !variants.some(t => v.indexOf(t) >= 0) ? variants[0] : '';
      const missingKeys = ccKeys.filter(k => v.indexOf(k.slice(0, Math.min(4, k.length))) < 0);
      let earned = 0;
      const tips = [];
      if (!v) {
        earned = 0;   // S 段没写就没有「与病史一致」可言
      } else {
        earned = 5;
        if (missingToken) {
          earned -= 2;
          tips.push('S 段里没看到主诉的起病时间「' + missingToken + '」，与病史采集可能对不上');
        }
        if (ccKeys.length && missingKeys.length) {
          earned -= 1;
          tips.push('S 段没提到主诉里的「' + missingKeys[0] + '」');
        }
      }
      items.push(item('S 段—与病史采集的信息一致', '第 5 页·主观简要病史(S)',
        5, Math.max(0, earned),
        v ? tips.join('；') + (tips.length ? '。' : '')
          : 'S 段还空着，无法与病史采集比对（5 分）。'));
    }

    /* ---------- O 客观体检记录/检查结果（10 分） ---------- */

    // 对疾病诊断有意义的体格检查描述正确、到位 5 分 ——第 5 页·O
    {
      const v = txt(o.pe);
      let earned = 0;
      let status;
      const tips = [];
      if (v) {
        earned = v.length >= 15 ? 5 : 3;
        status = earned === 5 ? 'ok' : 'weak';
        if (earned < 5) tips.push('O 段体格检查只写了 ' + v.length + ' 字，建议直接摘本例的关键阳性体征与关键阴性体征');
      } else if (posPE > 0) {
        earned = 2.5;
        status = 'weak';
        tips.push('O 段还空着：查体里已有 ' + posPE + ' 处阳性/非默认体征，可以直接摘过来（5 分）');
      } else {
        status = 'missing';
        tips.push('O 段还空着，查体里也还没有可摘的阳性体征（5 分）');
      }
      items.push(item('O 段—对诊断有意义的体格检查', '第 5 页·客观体检记录(O)',
        5, earned, tips.join('；') + (tips.length ? '。' : ''), { status: status }));
    }

    // 与疾病相关的辅助检查结果描述正确、到位 5 分 ——第 5 页·O
    {
      const v = txt(o.aux);
      let earned = 0;
      let status;
      const tips = [];
      if (v) {
        earned = v.length >= 10 ? 5 : 3;
        status = earned === 5 ? 'ok' : 'weak';
        if (earned < 5) tips.push('O 段辅助检查写得偏简，建议写清项目＋结果');
      } else if (hasAux) {
        earned = 2.5;
        status = 'weak';
        tips.push('O 段还空着：辅助检查里已有结果，挑与诊断相关的写进来（5 分）');
      } else {
        status = 'missing';
        tips.push('O 段还空着，辅助检查也还没有结果（5 分）');
      }
      items.push(item('O 段—与疾病相关的辅助检查结果', '第 5 页·客观检查结果(O)',
        5, earned, tips.join('；') + (tips.length ? '。' : ''), { status: status }));
    }

    /* ---------- A 诊断评估与鉴别诊断（40 分） ---------- */

    // 诊断依据概括简洁、完整 5 分 ——第 5 页·A
    {
      const v = txt(a.basis);
      let earned = 0;
      let status;
      const tips = [];
      if (!v) {
        status = 'missing';
        tips.push('还缺诊断依据段（5 分）：把支持诊断的病史、体检、辅助检查概括成一段');
      } else if (v.length < 20) {
        earned = 2.5;
        status = 'weak';
        tips.push('诊断依据只有 ' + v.length + ' 字，偏简；评分表要「简洁、完整」，不是「越短越好」');
      } else {
        earned = 5;
        status = 'ok';
      }
      items.push(item('A 段—诊断依据概括简洁、完整', '第 5 页·诊断评估与鉴别诊断(A)',
        5, earned, tips.join('；') + (tips.length ? '。' : ''), { status: status }));
    }

    // 诊断依据不堆砌、内容不空洞 5 分 ——第 5 页·A
    {
      const v = txt(a.basis);
      const list = clauses(v);
      const seen = {};
      const dup = [];
      list.forEach(c => {
        if (c.length < 4) return;
        if (seen[c] && dup.indexOf(c) < 0) dup.push(c);
        seen[c] = true;
      });
      let earned = 0;
      let status;
      const tips = [];
      if (!v) {
        status = 'missing';
        tips.push('诊断依据段还没有内容，无法判断是否堆砌（5 分）');
      } else if (dup.length) {
        earned = 2.5;
        status = 'weak';
        tips.push('诊断依据里有重复的句子「' + dup[0] + '」，建议删掉重复项');
      } else if (v.length > 800) {
        earned = 2.5;
        status = 'weak';
        tips.push('诊断依据 ' + v.length + ' 字偏长，把同类信息合并成一条更像「不堆砌」');
      } else {
        earned = 5;
        status = 'ok';
      }
      items.push(item('A 段—诊断依据不堆砌、不空洞', '第 5 页·诊断评估与鉴别诊断(A)',
        5, earned, tips.join('；') + (tips.length ? '。' : ''), { status: status }));
    }

    // 各项诊断均有病史、体检、辅助检查的依据 5 分 ——第 5 页·A
    {
      const details = arr(a.basisDetail);
      const miss = [];
      let covered = 0;
      dx.forEach(name => {
        const e = matchEntry(details, name);
        if (!e) { miss.push(name); return; }
        const hasH = isS(e.history);
        const hasP = isS(e.pe);
        const hasA = isS(e.aux) || !hasAux;   // 完全没有辅助检查时，不强求 aux
        if (hasH && hasP && hasA) covered += 1;
        else {
          const lack = [];
          if (!hasH) lack.push('病史');
          if (!hasP) lack.push('体检');
          if (!hasA) lack.push('辅助检查');
          miss.push(name + '（缺' + lack.join('/') + '）');
        }
      });
      const earned = dx.length ? 5 * covered / dx.length : 0;
      items.push(item('A 段—各项诊断都有病史/体检/辅助检查依据', '第 5 页·诊断评估与鉴别诊断(A)',
        5, earned,
        !dx.length
          ? '还缺初步诊断：没有诊断就没法逐条写依据（先把「初步诊断」定下来）。'
          : (miss.length ? '还缺依据：' + miss.join('；') + '。每条诊断都要有病史、体检、辅助检查三方面支撑。' : '')
      ));
    }

    // 诊断准确，主次排序合理 10 分 ——第 5 页·A
    {
      const rank = txt(a.ranking);
      let earned = 0;
      let status;
      const tips = [];
      if (!dx.length) {
        status = 'missing';
        tips.push('还缺初步诊断，主次无从体现（10 分）');
      } else if (!rank) {
        earned = dx.length > 1 ? 5 : 6;
        status = 'weak';
        tips.push('还没有写「主次排序」的说明（10 分）：按主要诊断 → 次要诊断 → 并发症/合并症的顺序列出，并说明为什么这个排第一');
      } else {
        earned = 10;
        status = 'ok';
      }
      items.push(item('A 段—诊断主次排序合理', '第 5 页·诊断评估与鉴别诊断(A)',
        10, earned, tips.join('；') + (tips.length ? '。' : ''), { status: status }));
    }

    // 鉴别诊断结合患者主要诊断展开，分析有条理 10 分 ——第 5 页·A
    {
      const diffs = arr(a.diff);
      let earned = 0;
      let status;
      const tips = [];
      if (!diffs.length) {
        status = 'missing';
        tips.push('还缺鉴别诊断段（10 分）：围绕主要诊断写 2 条左右，每条说清「为什么考虑」和「哪一点不支持」');
      } else {
        const full = diffs.filter(d => {
          const e = obj(d);
          return isS(e.diagnosis) && isS(e.why) && (isS(e.against) || isS(e.points));
        }).length;
        earned = 10 * Math.min(1, full / 2);
        status = earned >= 10 ? 'ok' : 'weak';
        if (status === 'weak') {
          tips.push('鉴别诊断已写了 ' + diffs.length + ' 条，其中 ' + full +
            ' 条同时写了「为什么考虑」和「哪一点不支持」；建议至少 2 条写全');
        }
      }
      items.push(item('A 段—鉴别诊断结合主要诊断展开', '第 5 页·诊断评估与鉴别诊断(A)',
        10, earned, tips.join('；') + (tips.length ? '。' : ''), { status: status }));
    }

    // 未出现与诊断无关的鉴别诊断 5 分 ——第 5 页·A
    {
      const note = txt(a.diffNote);
      const diffs = arr(a.diff);
      let earned = 0;
      let status;
      const tips = [];
      if (note) {
        earned = 5;
        status = 'ok';
      } else if (diffs.length) {
        earned = 2.5;
        status = 'weak';
        tips.push('建议补一句「为什么只鉴别这几条」，说明每一条都紧扣本例的主要症状/主要阳性体征（5 分）');
      } else {
        status = 'missing';
        tips.push('还缺鉴别诊断，这一项（未出现与诊断无关的鉴别诊断 5 分）也就无从体现');
      }
      items.push(item('A 段—鉴别诊断不跑题', '第 5 页·诊断评估与鉴别诊断(A)',
        5, earned, tips.join('；') + (tips.length ? '。' : ''), { status: status }));
    }

    /* ---------- P 诊疗计划（25 分） ---------- */

    // 诊疗计划符合基本治疗原则，简明扼要 10 分 ——第 5 页·P
    {
      const v = txt(p.principle);
      let earned = 0;
      let status;
      const tips = [];
      if (!v) {
        status = 'missing';
        tips.push('还缺诊疗计划总述（10 分）：检查安排 + 治疗原则，简明扼要写清楚');
      } else if (v.length < 20) {
        earned = 5;
        status = 'weak';
        tips.push('诊疗计划只有 ' + v.length + ' 字，建议写清「查什么、怎么治、观察什么」');
      } else {
        earned = 10;
        status = 'ok';
      }
      items.push(item('P 段—诊疗计划符合治疗原则、简明扼要', '第 5 页·诊疗计划(P)',
        10, earned, tips.join('；') + (tips.length ? '。' : ''), { status: status }));
    }

    // 诊疗计划与相关诊断对应 10 分 ——第 5 页·P
    {
      const pds = arr(p.perDiagnosis);
      const miss = [];
      let covered = 0;
      dx.forEach(name => {
        const e = matchEntry(pds, name);
        if (!e) { miss.push(name); return; }
        if (isS(e.exam) || isS(e.treatment)) covered += 1;
        else miss.push(name + '（检查与治疗都还空着）');
      });
      const earned = dx.length ? 10 * covered / dx.length : 0;
      items.push(item('P 段—诊疗计划与相关诊断一一对应', '第 5 页·诊疗计划(P)',
        10, earned,
        !dx.length ? '还缺初步诊断，诊疗计划无法逐条对应（10 分）。'
          : (miss.length ? '还缺对应：' + miss.join('；') + '。每条诊断都要有对应的检查与治疗安排。' : '')
      ));
    }

    // 诊疗计划体现患者病情个体化原则 5 分 ——第 5 页·P
    {
      const v = txt(p.individual);
      let earned = 0;
      let status;
      const tips = [];
      if (!v) {
        status = 'missing';
        tips.push('还缺个体化说明（5 分）：本例的年龄、基础病、合并用药、依从性、经济情况怎么影响方案');
      } else if (v.length < 12) {
        earned = 2.5;
        status = 'weak';
        tips.push('个体化说明偏简，建议点明本例哪一点让方案与「常规」不同');
      } else {
        earned = 5;
        status = 'ok';
      }
      items.push(item('P 段—诊疗计划体现个体化原则', '第 5 页·诊疗计划(P)',
        5, earned, tips.join('；') + (tips.length ? '。' : ''), { status: status }));
    }

    /* ---------- 总体（10 分） ---------- */

    // 首次病程录整体书写简洁扼要、临床思路清晰 5 分 ——第 5 页·总体
    {
      const body = [txt(s.summary), txt(o.pe), txt(o.aux), txt(a.basis), txt(p.principle)].join('');
      const segFilled = [
        isS(s.summary),
        isS(a.basis),
        arr(a.diff).length > 0,
        arr(p.perDiagnosis).length > 0 || isS(p.principle)
      ].filter(Boolean).length;
      let earned = 0;
      let status;
      const tips = [];
      if (!body) {
        status = 'missing';
        tips.push('首次病程录还空着（5 分）。');
      } else if (segFilled < 3) {
        earned = 2;
        status = 'weak';
        tips.push('S/A/P 里还有段落没写，整体「思路清晰」体现不出来');
      } else if (body.length > 3000) {
        earned = 2.5;
        status = 'weak';
        tips.push('首次病程录 ' + body.length + ' 字偏长，建议压到 1500 字以内');
      } else {
        earned = 5;
        status = 'ok';
      }
      items.push(item('总体—书写简洁扼要、临床思路清晰', '第 5 页·总体',
        5, earned, tips.join('；') + (tips.length ? '。' : ''), { status: status }));
    }

    // 字迹整洁 5 分 ——第 5 页·总体（卷面分，本工具不能判断，故不计分）
    items.push(item(
      '字迹整洁（卷面分）',
      '第 5 页·总体',
      0, 0,
      '这 5 分是卷面分，本工具不能替你判断：如果最终要手抄到考核纸上，请注意字迹、行距、不要涂改。',
      { kind: KIND_PROCESS, weight: 1, status: 'ok' }
    ));

    return finalize({
      station: '首次病程录',
      key: 'firstCourse',
      page: '第 5 页',
      processMaxScore: 5,   // 字迹整洁 5 分（卷面分）
      fullMaxScore: 100,
      notes: [
        '本工具可核对 95 分；「字迹整洁」5 分属卷面分，不计入得分。',
        '同一份 SOAP 结构同时服务第 5 页（100 分）与第 6 页「首次病程记录」（20 分），写一次两处都用得上。'
      ]
    }, items);
  }

  /* =====================================================================
   * 七、考站四 · 病历书写（第 6-7 页，100 分）
   *
   *   入院记录 25 = 一般项目 2 + 主诉 2 + 现病史 8 + 既往史等 3 + 体格检查 4 + 辅助检查 2 + 诊断 4
   *   首次病程记录 20（复用 SOAP）
   *   病程记录 35 + 上级医师查房 5 —— 本工具没有载体，只出提醒，不计分
   *   出院记录 15 = 一般情况 2 + 入院情况 2 + 诊疗经过 5 + 出院情况 2 + 出院诊断 2 + 出院医嘱 2
   * =================================================================== */

  /** 计算住院天数（yyyy-mm-dd），算不出返回 0 */
  function daysBetween(from, to) {
    const a = Date.parse(String(from || '').replace(/[./]/g, '-'));
    const b = Date.parse(String(to || '').replace(/[./]/g, '-'));
    if (!Number.isFinite(a) || !Number.isFinite(b) || b < a) return 0;
    return Math.round((b - a) / 86400000);
  }

  function checkWriting(r) {
    const rec = norm(r);
    const b = obj(rec.basic);
    const h = obj(rec.hpi);
    const pmh = obj(rec.pmh);
    const per = obj(rec.personal);
    const fam = obj(rec.family);
    const aux = arr(obj(rec.auxiliary).items).filter(it => isS(obj(it).name) || isS(obj(it).result));
    const dx = diagnosisList(rec);
    const { s, a, p } = soapOf(rec);
    const dis = obj(rec.discharge);
    const items = [];

    /* ---------- 入院记录（第 6 页，25 分） ---------- */

    // 一般项目：姓名、性别、年龄、职业等 2 分 ——第 6 页·入院记录
    {
      const cells = [isS(b.name), isS(b.gender), isS(b.age), isS(b.occupation)];
      const miss = [];
      if (!cells[0]) miss.push('姓名');
      if (!cells[1]) miss.push('性别');
      if (!cells[2]) miss.push('年龄');
      if (!cells[3]) miss.push('职业');
      items.push(item('入院记录—一般项目', '第 6 页·入院记录',
        2, 2 * cells.filter(Boolean).length / 4,
        miss.length ? '还缺一般项目：' + miss.join('、') + '。' : ''));
    }

    // 主诉：简明、扼要、完整，原则上不用诊断名称 2 分 ——第 6 页·入院记录
    {
      const cc = txt(b.chiefComplaint);
      const bad = diagWordsIn(cc);
      const tips = [];
      let earned = cc ? 2 : 0;
      if (cc && cc.length > 20) { earned = 1; tips.push('主诉 ' + cc.length + ' 字，超过 20 字'); }
      if (cc && bad.length) {
        earned = Math.min(earned, 1);
        tips.push('主诉里出现了诊断性词语「' + bad.join('、') + '」，应改成症状描述');
      }
      items.push(item('入院记录—主诉', '第 6 页·入院记录',
        2, earned,
        !cc ? '还缺主诉。' : (tips.length ? tips.join('；') + '。' : '')));
    }

    // 现病史 8 分：起病时间、诱因、症状、缓解因素、治疗经过、鉴别阴性、发病后一般情况、其他需治疗疾病
    // ——第 6 页·入院记录
    {
      const cells = [
        ['起病时间', isS(b.chiefComplaintDuration) || isS(h.onset)],
        ['诱因', isS(h.cause)],
        ['症状', isS(h.symptoms)],
        ['缓解因素', isS(h.relief)],
        ['治疗经过', isS(h.treatment)],
        ['有鉴别诊断意义的阴性病史', isS(h.negativeDiscriminating)],
        ['发病后一般情况', isS(h.generalCondition)],
        ['与本病无关但仍需治疗的其他疾病', isS(pmh.otherTreatDiseases)]
      ];
      const miss = cells.filter(c => !c[1]).map(c => c[0]);
      items.push(item('入院记录—现病史', '第 6 页·入院记录',
        8, cells.length - miss.length,
        miss.length ? '现病史里还缺：' + miss.join('、') + '（每项 1 分）。' : ''));
    }

    // 既往史等：既往史、个人史、过敏史、婚育史、月经史、家族史 3 分 ——第 6 页·入院记录
    {
      const isFemale = txt(b.gender) === '女';
      // 注意（t9）：pmh.health 默认就是 '良好'、marriage.status 默认就是 '未婚'，
      // personal.smoking/drinking 默认 '无'。这些默认值不算「用户写过」，必须排除。
      const cells = [
        ['既往史', anyChecked(pmh.diseaseChecks) || isS(pmh.diseaseDetail) || isS(pmh.diseaseOther) ||
          isS(pmh.infection) || isS(pmh.surgery) || isS(pmh.trauma) || isS(pmh.transfusion) ||
          isS(pmh.longTermMeds) || isS(pmh.vaccine)],
        ['个人史', hasAny(per, ['birth', 'residence', 'travel', 'smokingAmount', 'drinkingAmount',
          'drugs', 'environment', 'habits'])],
        ['过敏史', isS(pmh.allergy) || anyChecked(pmh.allergenChecks)],
        ['婚育史', isS(b.marital) || (txt(obj(rec.marriage).status) && txt(obj(rec.marriage).status) !== '未婚')],
        ['家族史', anyChecked(fam.diseaseChecks) || hasAny(fam, ['other', 'threeGeneration',
          'similarDisease', 'deceased'])]
      ];
      if (isFemale) {
        const men = obj(rec.menstruation);
        cells.splice(4, 0, ['月经史',
          hasAny(men, ['age', 'cycle', 'duration', 'quantity', 'lmp', 'menopauseAge', 'extra']) ||
          isS(men.applicable)]);
      }
      const miss = cells.filter(c => !c[1]).map(c => c[0]);
      items.push(item('入院记录—既往史/个人史/过敏史/婚育史/家族史', '第 6 页·入院记录',
        3, 3 * (cells.length - miss.length) / cells.length,
        miss.length ? '还缺：' + miss.join('、') + '。' : ''));
    }

    // 体格检查：各大系统完整、准确、规范，专科体检完整，有鉴别意义的阴性体征无遗漏 4 分 ——第 6 页
    {
      const S = schemaOf();
      const deptKey = txt(b.department) || 'general';
      const dept = S ? arr(S.DEPARTMENTS).find(d => d && d.key === deptKey) : null;
      const specials = dept ? arr(dept.special) : [];
      let groupFilled = 0;
      let groupTotal = 0;
      let groupDefaultOnly = 0;   // 整组都是默认描述（有记录但没核对过）
      let negCount = 0;
      if (S) {
        arr(S.PE_COMMON).forEach(g => {
          groupTotal += 1;
          // 「有记录」就算记过（默认描述也算，因为病历里确实有字）
          const filled = arr(g.items).filter(it => peFilled(rec, g.key, it.key));
          if (filled.length) {
            groupFilled += 1;
            if (filled.every(it => peIsDefault(rec, g.key, it.key))) groupDefaultOnly += 1;
          }
          arr(g.items).forEach(it => {
            if (!peFilled(rec, g.key, it.key)) return;
            if (peIsDefault(rec, g.key, it.key)) return;   // 默认文案里的「未见/无」不算
            if (NEG_WORDS.test(peUserVal(rec, g.key, it.key))) negCount += 1;
          });
        });
      }
      let specialOk = true;
      let specialDefaultOnly = false;
      specials.forEach(spKey => {
        const sp = S && S.PE_SPECIAL ? S.PE_SPECIAL[spKey] : null;
        if (!sp) return;
        const filled = arr(sp.items).filter(it => peFilled(rec, 'special_' + spKey, it.key));
        if (!filled.length) specialOk = false;
        else if (filled.every(it => peIsDefault(rec, 'special_' + spKey, it.key))) specialDefaultOnly = true;
      });
      // 只有该科室真的有专科查体时，才把「专科体检记录」算进分母；
      // 否则通用科室会因为「没有专科查体」白拿三分之一的分数（t9 修的泄漏点）。
      const parts = [
        { ok: groupTotal > 0 && groupFilled >= Math.ceil(groupTotal * 0.8), miss: '各大系统的查体记录' },
        { ok: negCount >= 3, miss: '有鉴别诊断意义的阴性体征' }
      ];
      if (specials.length) parts.splice(1, 0, { ok: specialOk, miss: '专科体检记录' });
      const miss = parts.filter(x => !x.ok).map(x => x.miss);
      const tips = [];
      if (miss.length) tips.push('体格检查里还缺：' + miss.join('、') + '。');
      if (groupDefaultOnly > 0 || specialDefaultOnly) {
        tips.push('其中 ' + groupDefaultOnly + ' 个系统的查体用的是默认描述，建议逐项核对后按本例实际修改。');
      }
      items.push(item('入院记录—体格检查', '第 6 页·入院记录',
        4, 4 * (parts.length - miss.length) / parts.length,
        tips.join(''),
        {
          // 整段查体全是默认描述时，标记出来供界面提示「未核对」
          isDefault: !miss.length && groupDefaultOnly > 0 && groupDefaultOnly === groupFilled && !specialDefaultOnly
        }));
    }

    // 辅助检查：与本次疾病相关的主要辅助检查及其结果 2 分 ——第 6 页·入院记录
    items.push(item('入院记录—辅助检查', '第 6 页·入院记录',
      2, aux.length ? 2 : 0,
      aux.length ? '' : '还缺与本次疾病相关的主要辅助检查及结果（2 分）；确实还没做，写「暂缺」也比空着好核对。'));

    // 诊断：书写准确，初步诊断合理规范，修正/补充记录在病程录中 4 分 ——第 6 页·入院记录
    items.push(item('入院记录—诊断', '第 6 页·入院记录',
      4, dx.length ? 4 : 0,
      dx.length ? '' : '还缺初步诊断（4 分）：按主次列出，主要诊断放第一条。',
      { note: '诊断准确与否需要带教老师判断；本工具只核对「写了没有、排了主次没有」。' }));

    /* ---------- 首次病程记录（第 6 页，20 分） ---------- */

    // 病历特点 4 分 ——第 6 页·首次病程记录
    {
      const v = txt(s.summary);
      items.push(item('首次病程记录—病历特点', '第 6 页·首次病程记录',
        4, v ? (v.length >= 30 ? 4 : 2) : 0,
        v ? (v.length >= 30 ? '' : '病历特点只有 ' + v.length + ' 字，归纳得再完整些（主诉＋关键阳性＋关键阴性）。')
          : '还缺病历特点（4 分）：把现病史归纳成几句。'));
    }

    // 诊断依据 6 分 ——第 6 页·首次病程记录
    {
      const details = arr(a.basisDetail);
      const miss = [];
      let covered = 0;
      dx.forEach(name => {
        const e = matchEntry(details, name);
        if (e && isS(e.history) && isS(e.pe)) covered += 1;
        else miss.push(name);
      });
      const earned = dx.length ? 6 * covered / dx.length : (isS(a.basis) ? 3 : 0);
      items.push(item('首次病程记录—诊断依据', '第 6 页·首次病程记录',
        6, earned,
        !dx.length ? '还缺初步诊断，诊断依据没法逐条写（6 分）。'
          : (miss.length ? '这些诊断还缺病史＋体检的依据：' + miss.join('；') + '（共 6 分）。' : '')));
    }

    // 鉴别诊断 4 分 ——第 6 页·首次病程记录
    {
      const diffs = arr(a.diff);
      let earned = 0;
      if (diffs.length) {
        const full = diffs.filter(d => isS(obj(d).diagnosis) && isS(obj(d).why)).length;
        earned = 4 * Math.min(1, full / 2);
      }
      items.push(item('首次病程记录—鉴别诊断', '第 6 页·首次病程记录',
        4, earned,
        diffs.length
          ? (earned < 4 ? '鉴别诊断还缺「为什么考虑 / 哪一点不支持」的展开（4 分）。' : '')
          : '还缺鉴别诊断段（4 分）：围绕主要诊断写 2 条，分析要有条理。'));
    }

    // 诊疗计划 6 分 ——第 6 页·首次病程记录
    {
      const pds = arr(p.perDiagnosis);
      const hasPrinciple = isS(p.principle);
      let earned = 0;
      if (hasPrinciple) earned += 2;
      if (pds.length) {
        const useful = pds.filter(d => isS(obj(d).exam) || isS(obj(d).treatment)).length;
        earned += 4 * Math.min(1, useful / Math.max(1, dx.length || 1));
      }
      items.push(item('首次病程记录—诊疗计划', '第 6 页·首次病程记录',
        6, earned,
        earned >= 6 ? ''
          : '还缺具体的检查与治疗安排' + (hasPrinciple ? '' : '（总述也还没有）') +
            '：每条诊断对应写「查什么、怎么治」，共 6 分。'));
    }

    /* ---------- 病程记录与上级查房（第 6 页，40 分，本工具无载体） ---------- */

    items.push(item(
      '病程记录—记录时间与频次',
      '第 6 页·病程记录',
      0, 0,
      '本工具不生成病程记录（5 分）：病危每日 1 次以上、病重每 2 日 1 次以上、病情稳定每 3 日 1 次，' +
      '需在医院的电子病历系统里按频次完成。',
      { kind: KIND_PROCESS, weight: 5, status: 'missing' }
    ));
    items.push(item(
      '病程记录—记录内容（6 项，每项 5 分）',
      '第 6 页·病程记录',
      0, 0,
      '本工具不生成病程记录（30 分）。自查时逐条对：①病情变化与诊治过程有分析 ②辅助检查结果有记录及分析 ' +
      '③重要医嘱更改（抗生素及专科用药）及时、理由充分 ④交接班/转科/阶段小结按时完成 ' +
      '⑤重要操作、抢救记录及时完整 ⑥病例讨论记录翔实、层次清楚。',
      { kind: KIND_PROCESS, weight: 8, status: 'missing' }
    ));
    items.push(item(
      '上级医师查房记录',
      '第 6 页·上级医师查房记录',
      0, 0,
      '本工具不生成查房记录（5 分）：规定时间内完成（主治每周 2 次、副高以上每周 1 次），记录要真实、层次清楚、重点突出。',
      { kind: KIND_PROCESS, weight: 4, status: 'missing' }
    ));

    /* ---------- 出院记录（第 6-7 页，15 分） ---------- */

    // 一般情况：姓名、性别、年龄、入院日期、出院日期、住院天数 2 分 ——第 6 页·出院记录
    {
      const days = daysBetween(b.admitDate, dis.dischargeDate);
      const cells = [
        ['姓名', isS(b.name)],
        ['性别', isS(b.gender)],
        ['年龄', isS(b.age)],
        ['入院日期', isS(b.admitDate)],
        ['出院日期', isS(dis.dischargeDate)],
        ['住院天数', days > 0]
      ];
      const miss = cells.filter(c => !c[1]).map(c => c[0]);
      items.push(item('出院记录—一般情况', '第 6 页·出院记录',
        2, 2 * (cells.length - miss.length) / cells.length,
        miss.length
          ? '还缺：' + miss.join('、') + '。' +
            (!isS(dis.dischargeDate) ? '填了出院日期，住院天数就能自动算出来。' : '')
          : ''));
    }

    // 入院情况：简洁明了、重点突出，入院诊断合理 2 分 ——第 6 页·出院记录
    items.push(item('出院记录—入院情况', '第 6 页·出院记录',
      2, isS(dis.admitCondition) ? 2 : 0,
      isS(dis.admitCondition) ? '' : '还缺入院情况（2 分）：入院时的主要症状、体征与入院诊断，简洁明了。'));

    // 诊疗经过：住院期间的病情变化、检查结果、治疗经过及效果 5 分 ——第 6 页·出院记录
    {
      const v = txt(dis.course);
      const groups = [
        { name: '病情变化', re: /(病情|症状|体温|好转|加重|稳定)/ },
        { name: '检查结果', re: /(检查|复查|化验|CT|B超|超声|胸片|心电图|血|培养|结果)/ },
        { name: '治疗经过及效果', re: /(治疗|用药|予|给予|抗感染|手术|效果|好转|治愈|出院)/ }
      ];
      const miss = v ? groups.filter(g => !g.re.test(v)).map(g => g.name) : groups.map(g => g.name);
      items.push(item('出院记录—诊疗经过', '第 6 页·出院记录',
        5, v ? 5 * (groups.length - miss.length) / groups.length : 0,
        !v ? '还缺诊疗经过（5 分）：住院期间的病情变化、检查结果、治疗经过及效果。'
          : (miss.length ? '诊疗经过里还看不到：' + miss.join('、') + '。' : '')));
    }

    // 出院情况：主要症状、体征、辅助检查结果 2 分 ——第 6 页·出院记录
    items.push(item('出院记录—出院情况', '第 6 页·出院记录',
      2, isS(dis.dischargeStatus) ? 2 : 0,
      isS(dis.dischargeStatus) ? '' : '还缺出院情况（2 分）：出院时的主要症状、体征、复查的辅助检查结果。'));

    // 出院诊断：完整、规范 2 分 ——第 7 页·出院记录
    {
      const list = arr(dis.diagnoses).map(txt).filter(Boolean);
      const finalList = list.length ? list : dx;
      items.push(item('出院记录—出院诊断', '第 7 页·出院记录',
        2, finalList.length ? 2 : 0,
        finalList.length
          ? (list.length ? '' : '出院诊断目前沿用「初步诊断」，如住院期间有修正，请写明最终的诊断。')
          : '还缺出院诊断（2 分）。',
        { note: finalList.length ? '出院诊断：' + finalList.join('；') : '' }));
    }

    // 出院医嘱：全面、具体（药物及非药物治疗、生活指导、复诊时间）2 分 ——第 7 页·出院记录
    {
      const adv = obj(dis.advice);
      const cells = [
        ['药物', isS(adv.drug)],
        ['非药物治疗', isS(adv.nonDrug)],
        ['生活指导', isS(adv.lifestyle)],
        ['复诊时间', isS(adv.followUp)]
      ];
      const miss = cells.filter(c => !c[1]).map(c => c[0]);
      items.push(item('出院记录—出院医嘱', '第 7 页·出院记录',
        2, 2 * (cells.length - miss.length) / cells.length,
        miss.length ? '出院医嘱还缺：' + miss.join('、') + '（每项 0.5 分）。' : ''));
    }

    return finalize({
      station: '病历书写',
      key: 'writing',
      page: '第 6-7 页',
      processMaxScore: 40,   // 病程记录 35 + 上级医师查房 5
      fullMaxScore: 100,
      notes: [
        '本工具可核对 60 分（入院记录 25 + 首次病程记录 20 + 出院记录 15）；' +
        '病程记录 35 分、上级医师查房 5 分（合计 40 分）本工具不生成，需要你在电子病历系统里完成。'
      ]
    }, items);
  }

  /* =====================================================================
   * 八、汇总：各考站得分 + 加权总分 + 最该补的 3 项
   *
   * 权重是本工具自定义的（用来把四个考站压成一个参考分），不是官方分值权重。
   * 排序看的是「补上这一项能拿回多少分」，与考站权重无关。
   * =================================================================== */

  const WEIGHTS = { history: 0.2, physical: 0.2, firstCourse: 0.3, writing: 0.3 };
  const WEIGHT_NOTE = '加权总分用的权重（病史 0.2 / 查体 0.2 / 首次病程 0.3 / 病历书写 0.3）' +
    '是本工具自定义的参考权重，不是官方分值权重，只用于把四个考站合成一个总览。';

  function summary(r) {
    const results = [checkHistory(r), checkPhysical(r), checkFirstCourse(r), checkWriting(r)];

    const stations = results.map(res => ({
      key: res.key,
      station: res.station,
      page: res.page,
      score: res.score,
      maxScore: res.maxScore,
      percent: res.percent,
      lost: res.lost,
      processMaxScore: res.processMaxScore,
      advisoryFailed: res.advisoryFailed,
      fullMaxScore: res.fullMaxScore
    }));

    const pending = [];
    results.forEach(res => {
      res.items.forEach(it => {
        if (it.status === 'ok') return;
        pending.push({
          stationKey: res.key,
          station: res.station,
          page: it.page,
          item: it.item,
          kind: it.kind,
          status: it.status,
          maxScore: it.maxScore,
          earned: it.earned,
          missing: round1(it.maxScore - it.earned),
          priority: it.priority,
          suggestion: it.suggestion
        });
      });
    });
    // 优先级：先看能补回多少分，再看是不是硬性项（腹部次序等 priority 已含权重）
    pending.sort((x, y) => (y.priority - x.priority) || String(x.page).localeCompare(String(y.page)));

    const weightedPercent = round1(results.reduce(
      (sum, res) => sum + toNum(WEIGHTS[res.key]) * res.percent, 0));

    // 「最该补的 3 项」只从病历文本里挑：现场动作分不在病历里，不该挤掉真正能补的内容
    const top3 = pending
      .filter(x => x.kind !== KIND_PROCESS)
      .slice(0, 3)
      .map((x, i) => {
        const y = Object.assign({}, x);
        y.rank = i + 1;
        return y;
      });

    /* ---- 默认描述统计（t10）----
     * defaultCount：所有标了 isDefault 的检查项数（供界面显示「其中 N 项未核对」）
     * defaultScore：这些项拿到的分（同样是「已填写」的分，不是虚的）
     * unverified  ：已经得分、但内容全是默认描述的项，单独列出来方便界面做「待核对」清单
     */
    const defaultItems = [];
    const unverified = [];
    results.forEach(res => {
      res.items.forEach(it => {
        if (!it.isDefault) return;
        const entry = {
          stationKey: res.key,
          station: res.station,
          page: it.page,
          item: it.item,
          kind: it.kind,
          earned: it.earned,
          maxScore: it.maxScore,
          suggestion: it.suggestion
        };
        defaultItems.push(entry);
        if (it.earned > 0) unverified.push(entry);
      });
    });
    const defaultCount = defaultItems.length;
    const defaultScore = round1(defaultItems.reduce((s, x) => s + toNum(x.earned), 0));

    return {
      stations: stations,
      weighted: {
        score: weightedPercent,
        maxScore: 100,
        percent: weightedPercent,
        weights: Object.assign({}, WEIGHTS)
      },
      top3: top3,
      pending: pending,
      pendingCount: pending.length,
      processTodo: pending.filter(x => x.kind === KIND_PROCESS),
      // ---- 默认描述统计（t10）：界面可显示「其中 N 项为未核对的默认描述」 ----
      defaultCount: defaultCount,
      defaultScore: defaultScore,
      defaultItems: defaultItems,
      // 已经拿了分、但整项内容都是默认描述的项（提示「核对后保留或修改」）
      unverifiedCount: unverified.length,
      unverified: unverified,
      disclaimer: DISCLAIMER,
      notes: [
        WEIGHT_NOTE,
        '各考站只统计「能写进病历的文字」；现场动作分与病程记录分单独列出（见各站的 processMaxScore），不计入得分。',
        '「最该补的 3 项」按「补上能拿回多少分」排序，硬性项（如腹部查体次序）会被提前；' +
        '现场动作类的提醒列在 processTodo 里，不占前三。',
        defaultCount > 0
          ? '本次得分中有 ' + defaultCount + ' 项（合计 ' + defaultScore +
            ' 分）用的是系统默认描述，尚未按本例核对；这些分算作「已填写」，但建议逐项确认。'
          : ''
      ].filter(Boolean)
    };
  }

  /* ---------------------------------------------------------------------
   * 九、导出
   * ------------------------------------------------------------------- */

  return {
    STATIONS,
    DISCLAIMER,
    WEIGHTS,
    checkHistory,
    checkPhysical,
    checkFirstCourse,
    checkWriting,
    summary,
    // 供测试/调试的小工具（不参与业务）
    _internals: {
      diagWordsIn, abdomenOrder, daysBetween, clauses,
      peFilled, peUserVal, peUserText, peIsDefault, specScore, defaultHint, schemaOf
    }
  };
})();


</script>
<script>
﻿/* ===========================================================================
 * 大病历生成器 —— 核心生成逻辑（纯函数，可在 Node 中单测）
 * 输入：record（见 schema.emptyRecord）
 * 输出：{ text, sections, warnings, summaryDraft }
 * =========================================================================== */

const GENERATOR = (() => {
  'use strict';

  /* ---------------------------- 文本工具 ---------------------------- */

  const stripTail = s => String(s || '').trim().replace(/[，,；;。\s]+$/g, '');

  /** 把若干短句拼成一段，自动补句号 */
  function joinSentences(parts, sep = '') {
    return parts
      .map(p => stripTail(p))
      .filter(Boolean)
      .map(p => p + '。')
      .join(sep);
  }

  /** 拼短语，用顿号连接 */
  const joinList = arr => arr.filter(Boolean).join('、');

  /** 中医/中文数字：中文病历里年龄用阿拉伯数字即可 */
  const num = v => (v === 0 || v ? String(v) : '');

  /** 文本归一化：去掉标点与空白，只用来判断「是不是写重了」 */
  const squash = s => String(s || '').replace(/[\s，,。；;、：:]+/g, '');

  /**
   * 现病史内部去重。
   *
   * 「缓解因素」「具有鉴别诊断意义的阴性病史」是评分表明确单列的两个要素
   * （第6页现病史、第2页「伴随症状和阴性鉴别症状」），但它们很容易和
   * 「伴随症状」写重——写重了既啰嗦，又显得问诊思路不清。
   * 这里按「整句已覆盖 → 列表逐项去重」两级处理：
   *   1) 整句已被前面的句子包含 → 整句省略；
   *   2) 列表里某一项已写过 → 只保留没写过的项。
   *
   * 「无咯血、盗汗、消瘦」这种中文省略式否定要特别处理：后项本身不带否定词，
   * 但语义上继承前项的「无」。去重后如果只剩「消瘦」，必须补回「无」，
   * 否则「消瘦。」单独成句会被读成阳性表现，与事实相反。
   *
   * @param {string[]} seg 已经写进现病史的句子
   * @param {string} text 准备写入的句子（用户填的原文）
   * @returns {string} 去重后的句子；完全重复时返回 ''
   */
  function mergeIntoHistory(seg, text) {
    const t = stripTail(text);
    if (!t) return '';
    const existing = squash(seg.join(''));
    if (!existing) return t;
    if (existing.includes(squash(t))) return '';
    // 含分号的复合句不拆：拆开会丢掉分句之间的语义关系
    if (/[；;]/.test(t)) return t;
    const clauses = t.split(/[、，,]/).map(s => s.trim()).filter(Boolean);
    if (clauses.length < 2) return t;

    const NEG_HEAD = /^(无|未|否认|没有|未见)/;
    const NEG_ANY = /(无|未|否认|没有|未见)/;
    const effective = [];      // [{ core, neg, text, standAlone }]
    let prevNeg = '';
    clauses.forEach(c => {
      const head = (c.match(NEG_HEAD) || [''])[0];
      const core = c.replace(NEG_HEAD, '').trim();
      // 句中出现否定词（"体重无明显下降"）按独立分句看待，不继承前项否定
      const standAlone = !head && NEG_ANY.test(c);
      // 「无咯血、盗汗、消瘦」：后面不带否定词的分句继承前一项的「无」
      const neg = head || (standAlone ? '' : prevNeg);
      if (head) prevNeg = head;
      effective.push({ core, neg, text: standAlone ? c : core, standAlone });
    });

    const kept = effective.filter(e => !(e.core.length >= 2 && existing.includes(squash(e.core))));
    if (kept.length === effective.length) return t;
    if (!kept.length) return '';

    // 同一否定词开头的连续项合并，保持「无A、B」的写法
    const groups = [];
    kept.forEach(e => {
      const last = groups[groups.length - 1];
      if (last && last.neg === e.neg && !e.standAlone) last.items.push(e.text);
      else groups.push({ neg: e.neg, items: [e.text] });
    });
    return groups.map(g => g.neg + g.items.join('、')).join('，');
  }

  /* ---------------------------- 一般项目 ---------------------------- */

  /**
   * 诱因写成完整句子。
   *
   * 用户在「发病诱因」里通常只写「受凉后」「进食油腻食物后」这样的短语，
   * 直接拼进现病史会得到一个孤零零的短句（"受凉后。"），读起来像病句。
   * 这里补足谓词让它成为完整分句；已经写成完整句的保持原样。
   *
   * 「无明显诱因」不是诱因，是「没有诱因」的表述，属于起病情况那一句的内容，
   * 所以这里直接返回空串，交由 onset 去说，避免出现两句「无明显诱因」。
   */
  function normalizeCause(v) {
    const t = stripTail(v);
    if (!t) return '';
    if (/^(无明显诱因|无诱因|无明显原因|诱因不明)/.test(t)) return '';
    // 已经是完整分句（含谓词或连接词）就不再加工
    if (/[。；;]/.test(t) || /(出现|发生|诱发|起病|引起)/.test(t)) return t;
    if (/后$/.test(t)) return `${t}起病`;
    return `${t}为本次发病诱因`;
  }

  /**
   * 起病与诱因不能自相矛盾。
   *
   * 「起病情况」常被草稿成「无明显诱因出现腹痛」；如果用户随后又填了「受凉后」，
   * 两句话并列就成了「无明显诱因…受凉后…」的矛盾表述。有明确诱因时，
   * 把起病描述里的「无明显诱因」去掉，诱因由 cause 单独交代。
   */
  function reconcileOnsetWithCause(onset, cause) {
    const o = stripTail(onset);
    if (!o || !stripTail(cause)) return o;
    return stripTail(
      o.replace(/，?(无明显诱因|无诱因|无明显原因)/g, '')
       .replace(/^(无明显诱因|无诱因|无明显原因)/, '')
    );
  }

  /**
   * 年龄文本：已经带单位就原样返回，否则补「岁」。
   *
   * 儿科病历写「7月」「3天」，成人写「58」。以前统一拼「岁」，
   * 儿科会输出「7月岁」这种不存在的写法。
   */
  function ageWithUnit(basic) {
    const raw = stripTail((basic || {}).age);
    if (!raw) return '';
    return /[岁月天周时]/.test(raw) ? raw : raw + '岁';
  }

  /**
   * 一般项目。
   *
   * 按病历书写规范一行一项（见用户提供的模板），不再挤成一句。
   */
  function buildBasicInfo(r) {
    const b = r.basic || {};
    const lines = [];
    const age = ageWithUnit(b);

    if (b.name) lines.push(`姓名：${b.name}`);
    if (stripTail(b.recordNo)) lines.push(`住院号：${stripTail(b.recordNo)}`);
    if (b.gender) lines.push(`性别：${b.gender}`);
    if (age) lines.push(`年龄：${age}`);
    lines.push(`民族：${stripTail(b.nationality) || SCHEMA.NATIONALITY}`);
    if (b.nativePlace) lines.push(`籍贯：${b.nativePlace}`);
    if (b.birthPlace) lines.push(`出生地：${b.birthPlace}`);
    const marital = (r.marriage || {}).status || b.marital;
    if (marital) lines.push(`婚姻：${marital}`);
    if (b.occupation) lines.push(`职业：${b.occupation}`);
    if (b.workUnit) lines.push(`工作单位：${b.workUnit}`);
    if (b.address) lines.push(`通讯地址：${b.address}`);
    if (b.phone) lines.push(`电话号码：${b.phone}`);
    if (b.admitDate) lines.push(`入院日期：${b.admitDate}`);
    if (b.recordDate) lines.push(`记录日期：${b.recordDate}`);
    const who = b.informant || (b.name ? `患者本人（${b.name}）` : '');
    if (who) lines.push(`病史陈述者：${who}`);
    if (b.reliability) lines.push(`病史可靠程度：${b.reliability}`);
    return lines.join('\n');
  }

  /* ---------------------------- 主诉 ---------------------------- */

  function buildChiefComplaint(r) {
    const b = r.basic || {};
    const cc = stripTail(b.chiefComplaint);
    if (!cc) return '';
    let dur = stripTail(b.chiefComplaintDuration);
    if (!dur) return `${cc}。`;

    const unit = b.chiefComplaintDurationUnit || '';
    // 用户已经写了单位就不再加
    if (!/[天日周月年小时分]/.test(dur)) dur += unit;
    // 主诉正文里已包含该时长（"停经34周" + 34周）时不再重复
    if (cc.includes(dur)) return `${cc}。`;
    // 主诉以某个时间结束（"发现血压升高1周"），又单独填了时长时，直接以主诉为准
    if (/[0-9一二三四五六七八九十]+(天|日|周|月|年|小时|分钟)$/.test(cc)) return `${cc}。`;
    return `${cc}${dur}。`;
  }

  /* ---------------------------- 现病史 ---------------------------- */

  const HPI_DEFAULTS = {
    generalCondition: '发病以来，精神、食欲、睡眠可，大小便正常，体重无明显变化'
  };

  /**
   * 根据结构化字段组装现病史。
   *
   * 字段顺序对照评分表第6页「现病史」逐字排列：
   *   起病时间 → 诱因 → 症状特点 → 缓解因素 → 病情进展 → 伴随症状
   *   → 有鉴别诊断意义的阴性病史 → 治疗经过 → 发病后一般情况 →（补充）
   * 其中「诱因」「缓解因素」「鉴别阴性」是本次新接上的评分要素，
   * 前两者与伴随症状写重时会自动去重，避免同一句在病历里出现两遍。
   */
  function buildHPI(r) {
    const h = r.hpi || {};
    if (h.mode === 'manual') {
      return h.manual ? joinSentences([h.manual]) : '';
    }
    const seg = [];
    const causeText = normalizeCause(h.cause);
    const onset = reconcileOnsetWithCause(h.onset, causeText);
    if (onset) seg.push(onset);

    // 诱因：起病描述里已经写了「受凉后/进食后」等就不再重复
    const cause = mergeIntoHistory(seg, causeText);
    if (cause) seg.push(cause);

    if (stripTail(h.symptoms)) seg.push(stripTail(h.symptoms));

    // 缓解因素（评分表第6页现病史明确列出；第2页未列，属加分项）
    const relief = mergeIntoHistory(seg, h.relief);
    if (relief) seg.push(relief);

    if (stripTail(h.evolution)) seg.push(stripTail(h.evolution));
    if (stripTail(h.accompanying)) seg.push(stripTail(h.accompanying));

    // 具有鉴别诊断意义的阴性病史（第2页 5 分、第6页现病史）
    const neg = mergeIntoHistory(seg, h.negativeDiscriminating);
    if (neg) seg.push(neg);

    if (stripTail(h.treatment)) seg.push(stripTail(h.treatment));
    const gc = stripTail(h.generalCondition) || HPI_DEFAULTS.generalCondition;
    if (gc) seg.push(gc);
    // 与本病无关但仍需治疗的其他疾病（第6页现病史末项）
    const other = stripTail((r.pmh || {}).otherTreatDiseases);
    if (other) seg.push(`另有${other}，需继续治疗`);
    if (stripTail(h.extra)) seg.push(stripTail(h.extra));
    if (!seg.length) return '';
    let text = joinSentences(seg);
    // 开头不写主语时补上；已含"患者/孕妇/患儿"等主语则不再重复
    if (!/^(患者|患儿|产妇|孕妇|本人|家属|该)/.test(text)) {
      const child = r.basic && r.basic.department === 'pediatrics';
      text = (child ? '患儿' : '患者') + text;
    }
    return text;
  }

  /** 一键生成现病史初稿（只补齐空字段，不覆盖已写内容） */
  function draftHPI(r) {
    const h = r.hpi || {};
    const b = r.basic || {};
    const cc = stripTail(b.chiefComplaint) || '上述症状';
    const out = { ...h };
    const durText = stripTail(b.chiefComplaintDuration)
      ? stripTail(b.chiefComplaintDuration) + (b.chiefComplaintDurationUnit || '')
      : '';
    if (!stripTail(out.onset)) {
      out.onset = `${durText ? durText + '前' : ''}无明显诱因出现${cc}`;
    }
    if (!stripTail(out.generalCondition)) {
      out.generalCondition = HPI_DEFAULTS.generalCondition;
    }
    return out;
  }

  /* ---------------------------- 系统回顾 ---------------------------- */

  function collectROS(r) {
    const res = []; // [{ name, positives:[], negatives:[] }]
    SCHEMA.ROS.forEach(sys => {
      const store = (r.ros || {})[sys.key] || {};
      const positives = [];
      const negatives = [];
      sys.symptoms.forEach(sym => {
        const v = store[sym.key] || {};
        if (v.checked) {
          let s = sym.label;
          if (v.time) s += v.time;
          if (v.detail) s += '，' + v.detail;
          positives.push(s);
        } else {
          negatives.push(sym.label);
        }
      });
      res.push({ key: sys.key, name: sys.name, positives, negatives });
    });
    return res;
  }

  function buildROS(r, mode) {
    const data = collectROS(r);
    const allPositives = data.some(d => d.positives.length > 0);
    if (!allPositives && mode === 'brief') return '各系统回顾未见阳性症状。';
    const lines = [];
    data.forEach(d => {
      if (d.positives.length) {
        // 去掉与阳性项重复的阴性项（如阳性"头痛，偶有头晕"时不再写"无头晕"）
        const posText = d.positives.join('');
        const negs = d.negatives.filter(n => !posText.includes(n));
        const line = `${d.name}：${d.positives.join('；')}` +
          (negs.length ? `；无${joinList(negs)}` : '') + '。';
        lines.push(line);
      } else if (mode !== 'brief') {
        lines.push(`${d.name}：无${joinList(d.negatives)}。`);
      }
    });
    return lines.join('\n');
  }

  /* ---------------------------- 既往史 ---------------------------- */

  /**
   * 既往史。
   *
   * 按模板逐项成行：既往健康状况、疾病史、传染病史、预防接种史、过敏史、
   * 手术史、外伤史、输血史、中毒史、长期用药、与本病相关病史、其它。
   * 分项书写便于带教老师逐条核对，也符合病历书写规范。
   */
  function buildPMH(r) {
    const p = r.pmh || {};
    const lines = [];

    // 1) 既往健康状况
    lines.push(`既往健康状况：${stripTail(p.health) ? '平素' + stripTail(p.health) : '平素体健'}`);

    // 2) 疾病史：手写详情优先，其次勾选，最后默认否认
    const checked = Object.keys(p.diseaseChecks || {}).filter(k => p.diseaseChecks[k] && k !== '其他');
    const other = stripTail(p.diseaseOther);
    const detail = stripTail(p.diseaseDetail);
    let disease;
    if (detail) disease = detail;
    else if (checked.length || other) disease = `既往患${joinList(checked.concat(other ? [other] : []))}`;
    else disease = '否认高血压、糖尿病、冠心病等慢性病史';
    lines.push(`疾病史：${disease}`);

    // 3) 传染病史
    lines.push(`传染病史：${stripTail(p.infection) || '否认肝炎、结核、伤寒等传染病史'}`);

    // 4) 预防接种史
    lines.push(`预防接种史：${stripTail(p.vaccine) || '按计划预防接种'}`);

    // 5) 过敏史
    if (p.allergy === '有') {
      const allergens = Object.keys(p.allergenChecks || {}).filter(k => p.allergenChecks[k] && k !== '其他');
      if (p.allergenOther) allergens.push(p.allergenOther);
      let s = allergens.length ? `${joinList(allergens)}过敏` : '有药物或食物过敏史';
      const reactions = Object.keys(p.allergenReactionChecks || {})
        .filter(k => p.allergenReactionChecks[k] && k !== '其他');
      const reactionText = stripTail(p.allergyReaction);
      if (reactionText) s += `，表现为${reactionText}`;
      else if (reactions.length) s += `，表现为${joinList(reactions)}`;
      lines.push(`过敏史：${s}`);
    } else {
      lines.push('过敏史：否认食物、药物过敏史');
    }

    // 6) 手术史  7) 外伤史  8) 输血史  9) 中毒史
    lines.push(`手术史：${stripTail(p.surgery) || '否认手术史'}`);
    lines.push(`外伤史：${stripTail(p.trauma) || '否认外伤史'}`);
    lines.push(`输血史：${stripTail(p.transfusion) || '否认输血史'}`);
    lines.push(`中毒史：${stripTail(p.poisoning) || '否认中毒史'}`);

    // 10) 长期用药
    lines.push(`长期用药：${stripTail(p.longTermMeds) || '否认长期用药史'}`);

    // 11) 与本病相关病史
    if (stripTail(p.relatedHistory)) lines.push(`与本病相关病史：${stripTail(p.relatedHistory)}`);

    // 12) 其它（其他需治疗的疾病 + 补充说明）
    const extras = [stripTail(p.otherTreatDiseases), stripTail(p.special)].filter(Boolean);
    if (extras.length) lines.push(`其它：${extras.join('；')}`);

    return lines.join('\n');
  }

  /* ---------------------------- 个人史 ---------------------------- */

  function buildPersonal(r) {
    const p = r.personal || {};
    const seg = [];
    // 母孕史 / 出生史 / 喂养史 / 生长发育史：儿科病历必写，成人可留空
    if (stripTail(p.maternal)) seg.push(`母孕史：${stripTail(p.maternal)}`);
    if (stripTail(p.birth)) seg.push(`出生史：${stripTail(p.birth)}`);
    if (stripTail(p.feeding)) seg.push(`喂养史：${stripTail(p.feeding)}`);
    if (stripTail(p.growth)) seg.push(`生长发育史：${stripTail(p.growth)}`);
    // 籍贯已在一般项目，个人史这里只写居住情况
    if (stripTail(p.residence) && !/^久居/.test(stripTail(p.residence))) {
      seg.push(`居住史：久居${stripTail(p.residence)}`);
    } else if (stripTail(p.residence)) {
      seg.push(`居住史：${stripTail(p.residence)}`);
    }
    if (stripTail(p.travel)) seg.push(`疫区接触史：近期${stripTail(p.travel)}`);
    // 吸烟
    if (p.smoking === '有') {
      seg.push(`吸烟史：有${p.smokingAmount ? '，' + stripTail(p.smokingAmount) : ''}`);
    } else if (p.smoking === '已戒') {
      seg.push(`吸烟史：已戒烟${p.smokingAmount ? '，' + stripTail(p.smokingAmount) : ''}`);
    } else if (p.smoking === '无' || p.smoking) {
      seg.push('吸烟史：无');
    }
    if (p.drinking === '有') {
      seg.push(`饮酒史：有${p.drinkingAmount ? '，' + stripTail(p.drinkingAmount) : ''}`);
    } else if (p.drinking === '已戒') {
      seg.push(`饮酒史：已戒酒${p.drinkingAmount ? '，' + stripTail(p.drinkingAmount) : ''}`);
    } else if (p.drinking === '无' || p.drinking) {
      seg.push('饮酒史：无');
    }
    if (stripTail(p.drugs)) seg.push(`毒物接触史：${stripTail(p.drugs)}`);
    else seg.push('毒物接触史：否认毒物、粉尘及放射性物质接触史');
    if (stripTail(p.environment)) seg.push(stripTail(p.environment));
    if (stripTail(p.habits)) seg.push(stripTail(p.habits));
    return seg.join('\n');
  }

  /* ---------------------------- 婚育史（婚、月经、生育合并） ---------------------------- */

  function buildMarriage(r) {
    const m = r.marriage || {};
    const b = r.basic || {};
    if (m.status === '未婚') return '未婚。';
    let s = m.status || b.marital || '';
    if (!s) return '';
    if (m.age) s += `，${m.age}岁结婚`;
    if (m.spouseHealth) s += `，${stripTail(m.spouseHealth)}`;
    return s + '。';
  }

  /**
   * 婚姻史（模板里与月经生育史分开成两节）。
   * 儿科/未婚者写「无」即可。
   */
  function buildMarriageHistory(r) {
    const m = r.marriage || {};
    const b = r.basic || {};
    // 婚姻状况只有一个真相：婚姻史页填了就以它为准（会写详细情况），
    // 没填则回退到一般项目。两处默认值不同时打架，避免同一份病历自相矛盾。
    const status = m.status || b.marital || '';
    if (!status) return '';
    if (status === '未婚') return '未婚。';
    let s = status;
    if (m.age) s += `，${m.age}岁结婚`;
    if (m.spouseHealth) s += `，配偶${stripTail(m.spouseHealth)}`;
    return s + '。';
  }

  /** 月经与生育史（模板里的独立一节） */
  function buildMenstruationChildbirth(r) {
    const b = r.basic || {};
    const parts = [];
    const men = buildMenstruation(r);
    if (men) parts.push(men.replace(/^月经史：/, '').replace(/。$/, ''));
    const cb = buildChildbirth(r);
    if (cb) parts.push(cb.replace(/^生育史：/, '').replace(/。$/, ''));
    if (!parts.length) {
      // 男性或无月经史者：明确写「无」，避免整节消失后被误认为漏采
      return b.gender === '女' ? '' : '无。';
    }
    return parts.join('，') + '。';
  }

  /** 兼容旧调用：婚姻 + 月经 + 生育合成一句 */
  function buildMarriageChildbirth(r) {
    const parts = [];
    const mar = buildMarriageHistory(r);
    if (mar) parts.push(mar.replace(/。$/, ''));
    const mc = buildMenstruationChildbirth(r);
    if (mc && mc !== '无。') parts.push(mc.replace(/。$/, ''));
    if (!parts.length) return '';
    return parts.join('，') + '。';
  }

  function buildMenstruation(r) {
    const m = r.menstruation || {};
    const b = r.basic || {};
    if (b.gender !== '女') return '';
    if (m.applicable === '无') {
      return /绝经|停经/.test(m.extra || '') ? `${stripTail(m.extra)}。` : '已绝经。';
    }
    const parts = [];
    if (m.age) parts.push(`初潮${m.age}岁`);
    if (m.cycle) parts.push(`周期${m.cycle}天`);
    if (m.duration) parts.push(`经期${m.duration}天`);
    if (m.quantity) parts.push(`经量${m.quantity}`);
    if (m.dysmenorrhea && m.dysmenorrhea !== '无') parts.push('有痛经');
    else if (m.dysmenorrhea === '无') parts.push('无痛经');
    if (m.menopauseAge) parts.push(`${m.menopauseAge}岁绝经`);
    if (m.lmp) parts.push(`末次月经${m.lmp}`);
    if (m.extra) parts.push(stripTail(m.extra));
    if (!parts.length) return '';
    return '月经史：' + parts.join('，') + '。';
  }

  function buildChildbirth(r) {
    const c = r.childbirth || {};
    const b = r.basic || {};
    const parts = [];
    if (c.gravida) parts.push(`孕${c.gravida}产${c.para || '0'}`);
    if (c.abortion) parts.push(`流产${c.abortion}次`);
    if (c.details) parts.push(stripTail(c.details));
    if (c.lastBirth) parts.push(`末次分娩${stripTail(c.lastBirth)}`);
    if (c.contraception) parts.push(`避孕方式：${stripTail(c.contraception)}`);
    if (!parts.length) {
      if (b.gender === '男') return '';
      if (c.applicable === '无') return '无生育史。';
      return '';
    }
    return '生育史：' + parts.join('，') + '。';
  }

  /* ---------------------------- 家族史 ---------------------------- */

  /**
   * 家族史。
   *
   * 评分表第2页家族史 5 分 = 「与本病相似的病情」2.5 + 「两系三代遗传性疾病史」2.5。
   * 这两项都单列，所以默认句必须是两句，不能再用一句「家族中无类似疾病患者」糊过去。
   */
  function buildFamily(r) {
    const f = r.family || {};
    const checked = Object.keys(f.diseaseChecks || {}).filter(k => f.diseaseChecks[k]);
    const seg = [];
    if (f.deceased) seg.push(stripTail(f.deceased));

    // ① 与本病相似的病情（手写优先，勾选兜底）
    const similar = stripTail(f.similarDisease);
    if (similar) seg.push(similar);
    else if (checked.length) seg.push(`家族中${joinList(checked)}病史`);
    else seg.push('家族中无类似疾病患者');

    // ② 两系三代遗传性疾病史（手写优先，未填给标准阴性表述）
    const three = stripTail(f.threeGeneration);
    seg.push(three || '两系三代否认遗传性疾病史');

    if (stripTail(f.other)) seg.push(stripTail(f.other));
    return joinSentences(seg);
  }

  /* ---------------------------- 体格检查 ---------------------------- */

  function vitalValue(v) {
    return v === undefined || v === null || v === '' ? '' : String(v).trim();
  }

  function buildVitals(r) {
    const v = (r.pe || {}).vitals || {};
    const parts = [];
    if (vitalValue(v.temperature)) parts.push(`T ${vitalValue(v.temperature)}℃`);
    if (vitalValue(v.pulse)) parts.push(`P ${vitalValue(v.pulse)}次/分`);
    if (vitalValue(v.respiration)) parts.push(`R ${vitalValue(v.respiration)}次/分`);
    if (vitalValue(v.sbp) || vitalValue(v.dbp)) {
      parts.push(`BP ${vitalValue(v.sbp) || '—'}/${vitalValue(v.dbp) || '—'}mmHg`);
    }
    if (vitalValue(v.height)) parts.push(`身高 ${vitalValue(v.height)}cm`);
    if (vitalValue(v.weight)) parts.push(`体重 ${vitalValue(v.weight)}kg`);
    if (vitalValue(v.headCirc)) parts.push(`头围 ${vitalValue(v.headCirc)}cm`);
    if (vitalValue(v.chestCirc)) parts.push(`胸围 ${vitalValue(v.chestCirc)}cm`);
    return parts.length ? parts.join('，') + '。' : '';
  }

  /** 某个查体条目的当前值：用户填的优先，否则用默认 */
  function peValue(r, groupKey, item) {
    const g = ((r.pe || {})[groupKey]) || {};
    const raw = g[item.key];
    if (raw === undefined || raw === null || String(raw).trim() === '') {
      const d = (r.peDefaults || {})[groupKey] || {};
      return d[item.key] || item.default || '';
    }
    return String(raw).trim();
  }

  /**
   * 一组查体里，哪些条目应该参与输出。
   *
   *  abdomen.abdPalpation 这类「父项 + 子项」结构：子项一旦被填写，父项必须让位，
   * 否则病历里会同时出现「全腹无压痛」和「右下腹浅触诊压痛」两种互相打架的描述。
   * 这里统一用 schema 导出的 parentSupersededByChild 判断，不在 generator 里
   * 再散落一套自己的规则。
   *
   * @returns {Array<{item:object, value:string}>} 只保留有值（要输出）的条目
   */
  function peEntries(r, groupKey, items) {
    const store = (r.pe || {})[groupKey] || {};
    return items
      // 父项被已填写的子项接管时，整项跳过
      .filter(it => !(SCHEMA.childPEItems(groupKey, it.key).length &&
        SCHEMA.parentSupersededByChild(store, groupKey, it.key)))
      .map(it => ({ item: it, value: stripTail(peValue(r, groupKey, it)) }))
      .filter(e => e.value);
  }

  /**
   * 把一组的查体条目渲染成「大节 + 小节」的格式，贴近纸质病历的写法：
   *
   *   胸部：胸廓对称，无畸形。乳房两侧对称。
   *   肺：
   *   　视诊：…
   *   　听诊：…
   *   心脏：
   *   　视诊：…
   *
   * 分块依据完全来自 schema 里的 item.label（形如「肺—视诊」），
   * 以及「视诊/触诊/叩诊/听诊」这类模态词。生成器不额外维护一套映射表。
   */
  function renderPEGroup(group, entries) {
    const DASH = /^(.+?)—(.+)$/;
    const MODALITY = /^(视诊|触诊|叩诊|听诊|嗅诊)$/;
    const blocked = [];
    const plain = [];
    entries.forEach(e => {
      const label = e.item.label || '';
      const m = DASH.exec(label);
      if (m) blocked.push({ block: m[1], label: m[2], value: e.value });
      else if (MODALITY.test(label)) blocked.push({ block: label, label: '', value: e.value });
      else plain.push(e.value);
    });

    if (!blocked.length) {
      const texts = dedupeTexts(plain);
      return [`${group.name}：${texts.join('。')}。`];
    }

    const lines = [];
    if (plain.length) lines.push(`${group.name}：${dedupeTexts(plain).join('。')}。`);
    else lines.push(`${group.name}：`);

    let last = null;
    blocked.forEach(b => {
      const isNew = b.block !== last;
      if (isNew) {
        last = b.block;
        if (b.label) {
          // 新块且带子标签：「　肺：」单独一行，再写第一个子项的值
          lines.push(`　${b.block}：`);
          lines.push(`　　${b.label}：${b.value}`);
        } else {
          // 模态词本身就是子标签：「　视诊：腹部平坦…」
          lines.push(`　${b.block}：${b.value}`);
        }
      } else if (b.label) {
        lines.push(`\u3000\u3000${b.label}：${b.value}`);
      } else {
        lines.push(`　${b.value}`);
      }
    });
    return lines;
  }

  /**
   * 生成体格检查。
   *
   * 输出顺序 = SCHEMA.PE_COMMON 里 items 的数组顺序，
   * 因此腹部天然就是「视诊 → 听诊 → 叩诊 → 触诊」（评分表第3页要求）。
   * 生成逻辑不要在这里重排，次序的唯一真相在 schema。
   */
  function buildPE(r) {
    const deptKey = (r.basic || {}).department || 'general';
    const dept = SCHEMA.DEPARTMENTS.find(d => d.key === deptKey) || SCHEMA.DEPARTMENTS[0];
    const out = [];
    const vit = buildVitals(r);
    if (vit) out.push(vit);

    SCHEMA.PE_COMMON.forEach(group => {
      const items = group.items.filter(it => !it.depts || it.depts.includes(deptKey));
      if (!items.length) return;
      const entries = peEntries(r, group.key, items);
      if (!entries.length) return;
      renderPEGroup(group, entries).forEach(line => out.push(line));
    });

    (dept.special || []).forEach(spKey => {
      const sp = SCHEMA.PE_SPECIAL[spKey];
      if (!sp) return;
      let texts = dedupeTexts(sp.items.map(it => stripTail(peValue(r, 'special_' + spKey, it))));
      if (!texts.length) return;
      out.push(`${sp.name}：${texts.join('。')}。`);
    });

    const focus = buildFocusPE(r);
    if (focus) out.push(focus);
    return out.join('\n');
  }

  /** 去掉完全重复的条目（如「外生殖器」与「肛门」都写「未见异常」） */
  function dedupeTexts(texts) {
    return texts.filter((t, i) => t && texts.indexOf(t) === i);
  }

  /**
   * 重点查体（评分表第4页 15 分）。
   * focusPE.keys 存 '组.key' 引用；普通查体形如 'chest.lungAuscultation'，
   * 专科查体形如 'special_respiratory.respExtra'。note 是补充说明。
   * 留空时整段不输出，不会在病历里留一个空标题。
   */
  function buildFocusPE(r) {
    const f = r.focusPE || {};
    const parts = [];
    (f.keys || []).forEach(ref => {
      const text = String(ref || '');
      const dot = text.indexOf('.');
      if (dot <= 0) return;
      const groupKey = text.slice(0, dot);
      const itemKey = text.slice(dot + 1);
      let item = null;
      let groupName = '';
      if (groupKey.startsWith('special_')) {
        const sp = SCHEMA.PE_SPECIAL[groupKey.slice('special_'.length)];
        if (!sp) return;
        item = (sp.items || []).find(it => it.key === itemKey) || null;
        groupName = sp.name;
      } else {
        const group = SCHEMA.PE_COMMON.find(g => g.key === groupKey);
        if (!group) return;
        item = group.items.find(it => it.key === itemKey) || null;
        groupName = group.name;
      }
      if (!item) return;

      // 父项已被子项接管时跳过：否则重点查体会输出父项的默认"全腹无压痛、反跳痛"，
      // 而同一次查体里又写着"右下腹浅触诊压痛"，同一份病历自相矛盾。
      const store = (r.pe || {})[groupKey] || {};
      if (!groupKey.startsWith('special_') &&
        typeof SCHEMA.parentSupersededByChild === 'function' &&
        SCHEMA.parentSupersededByChild(store, groupKey, itemKey)) {
        return;
      }

      // 只写用户真正填过的项，默认值不写进"重点查体"（否则等于把没查的也列成重点）
      const filled = typeof SCHEMA.peItemFilled === 'function'
        ? SCHEMA.peItemFilled(store, item)
        : !!String(store[itemKey] || '').trim();
      const val = stripTail(peValue(r, groupKey, item));
      if (!filled || !val) return;
      parts.push(`${groupName}：${item.label}${val}`);
    });
    const note = stripTail(f.note);
    if (!parts.length && !note) return '';
    const body = parts.length ? parts.join('；') + '。' : '';
    return `重点查体：${body}${note ? ensureSentence(note) : ''}`;
  }

  /**
   * 返回与默认值不同的异常体征列表（用于摘要与 SOAP 的 O 段）。
   *
   * 三条判定规则：
   *   1) 用户没改过的（等于 default 或旧的 legacyDefault）不算阳性——t2 重写了
   *      腹部四项默认文案，旧存档里存的是旧文案，只认 default 会把它误判成阳性；
   *   2) 被填写的子项接管的父项不再参与，避免同一条体征重复出现；
   *   3) 只挑真正阳性的短句：逐句拆分后剔除「无…/未见…」等否定句。
   */
  function abnormalPE(r) {
    const deptKey = (r.basic || {}).department || 'general';
    const dept = SCHEMA.DEPARTMENTS.find(d => d.key === deptKey) || SCHEMA.DEPARTMENTS[0];
    const res = [];

    // 摘要只取真正的阳性描述。
    //
    // 判定策略：**默认认为是阳性**，只排除能明确认出是阴性的短句。
    //
    // 为什么不用「白名单异常词」：schema 里内置了上百个异常描述（急性病容、
    // 颈静脉怒张、桶状胸、杵状指、肠鸣音活跃……），白名单永远列不全，
    // 漏一个就是摘要丢一个阳性体征，比误报更危险。默认阳性 + 精确排除更稳。
    //
    // 几个必须小心的地方（都是实测踩过的坑）：
    //   1) 顿号必须切开：「右下腹压痛、无反跳痛」里前半是阳性，
    //      不切就会被后半的「无」整句吞掉。
    //   2) 「未闻及」不能一律当否定：未闻及胎心/呼吸音/心音/肠鸣音是阳性体征。
    //   3) 「无痛性包块」的「无」是否定「痛」，不是否定「包块」。
    //   4) 否定词可能在名词之后：肝脾未及、Murphy征阴性。
    const POSITIVE_OVERRIDE = /未(?:闻及|探及|引出)(?:胎心|胎动|呼吸音|心音|肠鸣音)/;
    const NEG_PREFIX = /^(?:无(?!痛性)|未见(?!异常)|未发现|未查(?!见)|否认|没有|正常|阴性)/;
    const NEG_FINDING = /(?:无(?!痛性)|未见(?!异常)|未发现|未闻及|未触及|未引出|未扪及|不能触及|没有|否认)[^，。；、]{0,6}(?:压痛|反跳痛|包块|肿块|肿大|杂音|啰音|哮鸣音|摩擦音|震颤|结节|水肿|黄染|发绀|皮疹|出血点|畸形|抵抗|分泌物|充盈|渗出|溃疡|萎缩|异常|浊音|实音|充血|叩击痛|触痛|膨隆|隆起|肝|脾)/;
    // 否定词在体征名词之后的：肝脾未及、Murphy征阴性、双下肢不肿
    const NEG_SUFFIX = /(?:肝|脾|包块|肿块|淋巴结|结节|异常|压痛|反跳痛|杂音|啰音|肿大|水肿|黄染|征|试验|反射)[^，。；、]{0,4}(?:未触及|未闻及|未引出|未及|阴性)|不肿$|不粗$|不高$/;
    // 出现这些词说明「换了个部位/对象」，前面的否定不再覆盖它
    // （「双下肢无水肿、右上肢轻度水肿」里右边是另一个部位）
    const NEW_SUBJECT = /^(?:左|右|双|两侧|患侧|对侧|头部|颈|胸|腹|背|腰|上肢|下肢|四肢|全身|局部|前|后)/;
    // 检查受限 ≠ 阳性体征（描述"没查清楚"，不是"查出异常"）
    const NOT_A_FINDING = /(触诊不满意|无法检查|拒查|未查)/;
    // 整句就是一个正常状态（必须整句匹配，避免「包块不大」被「不大」吞掉）
    const NORMAL_EXACT = [
      /^腹部平坦$/, /^腹软$/, /^腹平软$/, /^腹部柔软$/,
      /^肠鸣音正常$/, /^肠鸣音正常[，,]?约?\d+次\/分$/,
      /^心界不大$/, /^心律齐$/, /^律齐$/
    ];
    // 公认的「正常」表述
    const NORMAL_PHRASE = /(营养良好|营养中等|营养一般|发育正常|发育良好|神志清楚|精神一般|精神可|自动体位|面容自然|查体合作|皮肤弹性良好|毛发分布均匀|气管居中|颈软|腹平软|脊柱生理弯曲存在|生理反射存在|肌力正常|肌力5级|肌力Ⅴ级|双肺呼吸音清|呼吸音清|前囟平软|愈合良好)/;

    /** 单个片段是否明确是阴性/正常 */
    const isNegativeClause = c =>
      NEG_PREFIX.test(c) || NEG_FINDING.test(c) || NEG_SUFFIX.test(c) ||
      NOT_A_FINDING.test(c) ||
      NORMAL_EXACT.some(rx => rx.test(c)) || NORMAL_PHRASE.test(c);

    const isPositiveFinding = (item, val) => {
      if (!val) return false;
      if (SCHEMA.peValueIsDefault(item, val)) return false;
      const norm = s => String(s).trim().replace(/[，,；;。.、\s]+$/g, '');
      if (item.normal && norm(val) === norm(item.normal)) return false;

      const positiveClauses = [];
      // 顿号也要切开：「压痛、无反跳痛」是两件事
      val.split(/[。；;]/).forEach(sentence => {
        // negScope：前一个片段是否把否定作用到了后面的列举项上。
        // 「全腹无压痛、反跳痛」两个都阴性；「右下腹压痛、无反跳痛」前阳后阴。
        let negScope = false;
        sentence.split(/[，,、]/).forEach(clause => {
          const c = clause.trim();
          if (!c) return;
          if (POSITIVE_OVERRIDE.test(c)) {          // 未闻及胎心等属阳性
            positiveClauses.push(c);
            negScope = false;
            return;
          }
          if (isNegativeClause(c)) {
            // 这一片段本身是阴性；若它含否定词，否定可能延续到后面的列举项
            if (/(无|未见|未闻及|未触及|未引出|否认|没有)/.test(c)) negScope = true;
            return;
          }
          if (negScope && !NEW_SUBJECT.test(c)) {
            // 继承上一片段的否定：「无压痛、反跳痛」里的「反跳痛」
            return;
          }
          negScope = false;
          positiveClauses.push(c);                  // 其余一律按阳性处理
        });
      });
      if (!positiveClauses.length) return false;
      item.__positive = positiveClauses.join('，');
      return true;
    };

    SCHEMA.PE_COMMON.forEach(group => {
      const items = group.items.filter(it => !it.depts || it.depts.includes(deptKey));
      peEntries(r, group.key, items).forEach(({ item: it, value }) => {
        if (!isPositiveFinding(it, value)) return;
        res.push({ group: group.name, label: it.label, text: it.__positive, key: it.key });
      });
    });
    (dept.special || []).forEach(spKey => {
      const sp = SCHEMA.PE_SPECIAL[spKey];
      if (!sp) return;
      sp.items.forEach(it => {
        const val = stripTail(peValue(r, 'special_' + spKey, it));
        if (!isPositiveFinding(it, val)) return;
        res.push({ group: sp.name, label: it.label, text: it.__positive, key: it.key });
      });
    });
    return res;
  }

  /* ---------------------------- 辅助检查 ---------------------------- */

  /** 规整后的辅助检查列表（名称与结果都已 trim，丢掉全空行） */
  function auxItems(r) {
    return (((r.auxiliary || {}).items) || [])
      .map(it => ({ name: stripTail((it || {}).name), result: stripTail((it || {}).result) }))
      .filter(it => it.name || it.result);
  }

  function buildAuxiliary(r) {
    const items = auxItems(r);
    if (!items.length) return '暂缺。';
    return items.map(it => {
      if (it.name && it.result) return `${it.name}：${it.result}。`;
      return (it.name || it.result) + '。';
    }).join('\n');
  }

  /* ---------------------------- 病历摘要 ---------------------------- */

  function buildSummary(r, opts) {
    const manual = stripTail((r.summary || '').trim());
    if (manual) return manual + '。';
    return draftSummary(r);
  }

  /** 自动生成病历摘要初稿 */
  function draftSummary(r) {
    const b = r.basic || {};
    const seg = [];

    // 1) 患者身份 + 主诉（直接复用主诉生成逻辑，避免时长重复追加）
    const who = [b.gender, ageWithUnit(b)].filter(Boolean).join('，');
    const ccFull = stripTail(buildChiefComplaint(r));  // 已含时长和句号
    const isChild = b.department === 'pediatrics';
    const subj = isChild ? '患儿' : '患者';
    let head = who ? `${subj}，${who}` : subj;
    if (ccFull) head += `，因“${ccFull}”来院`;
    seg.push(head);

    // 2) 现病史要点（取前两句，避免摘要过长）
    const hpi = buildHPI(r);
    if (hpi) {
      const sentences = hpi.split(/。/).map(s => s.trim()).filter(Boolean);
      seg.push(sentences.slice(0, 2).join('。'));
    }

    // 3) 主要阳性体征（生命体征异常 + 查体异常）
    const abn = abnormalPE(r);
    const v = (r.pe || {}).vitals || {};
    const abnormalVitals = [];
    const t = parseFloat(v.temperature);
    if (!isNaN(t) && t >= 37.3) abnormalVitals.push(`T ${v.temperature}℃`);
    const p = parseFloat(v.pulse);
    if (!isNaN(p) && (p > 100 || p < 60)) abnormalVitals.push(`P ${v.pulse}次/分`);
    const rr = parseFloat(v.respiration);
    if (!isNaN(rr) && (rr > 20 || rr < 12)) abnormalVitals.push(`R ${v.respiration}次/分`);
    const sbp = parseFloat(v.sbp), dbp = parseFloat(v.dbp);
    if (!isNaN(sbp) && (sbp >= 140 || sbp < 90)) abnormalVitals.push(`BP ${v.sbp || '—'}/${v.dbp || '—'}mmHg`);
    const peAll = abnormalVitals.concat(abn.map(a => a.text).filter(Boolean));
    // 心率去重：查体描述里已经写了「心率108次/分」时，不要再pushed一个「P 108次/分」
    const dedup = peAll.filter((txt, i) => {
      if (!/^P \d+次\/分$/.test(txt)) return true;
      const num = txt.match(/\d+/)[0];
      return !peAll.some((other, j) => j !== i && /心率/.test(other) && other.includes(num));
    });
    seg.push(dedup.length ? `查体：${dedup.join('，')}` : '查体未见明显阳性体征');

    // 4) 辅助检查
    const aux = ((r.auxiliary || {}).items || []).filter(it => stripTail(it.name) || stripTail(it.result));
    if (aux.length) {
      seg.push('辅助检查：' + aux.map(it => {
        const n = stripTail(it.name);
        const vv = stripTail(it.result);
        return n && vv ? `${n}（${vv}）` : (n || vv);
      }).join('；'));
    }
    return joinSentences(seg);
  }

  /* ---------------------------- 初步诊断 ---------------------------- */

  function buildDiagnosis(r) {
    const list = ((r.diagnosis || {}).confirmed || []).map(s => stripTail(s)).filter(Boolean);
    if (!list.length) return '待补充。';
    return list.map((s, i) => `${i + 1}. ${s}`).join('\n');
  }

  /* ===================================================================
   * 首次病程录（评分表第5页 100 分；同时服务第6页「首次病程记录」20 分）
   *
   * 四段结构固定，段内顺序也按评分表逐条排列：
   *   一、病历特点（S）  概括简练重点突出 10 + 与病史采集一致 5
   *   二、客观记录（O）  有意义的查体 5 + 相关辅助检查 5
   *   三、诊断依据（A）  依据概括 5 + 不堆砌 5 + 三依据齐全 5 + 主次 10
   *   四、鉴别诊断（A）  结合主要诊断有条理 10 + 无无关鉴别 5
   *   五、诊疗计划（P）  符合原则 10 + 与诊断对应 10 + 个体化 5
   *
   * 设计约束：
   *   - 纯函数：不读 DOM、不读时钟、不写存储，同样入参永远同样出参；
   *   - 用户填的字段优先，留空的部分由已有结构化数据自动补，不编造事实；
   *   - 四段标题必须始终出现（哪怕某段内容自动生成得很少），
   *     因为评分表是按「段」给分的，缺段直接零分。
   * =================================================================== */

  /**
   * 去掉句首重复的标签。
   *
   * 自动草稿的文本自带「查体：」「辅助检查：」前缀，而 SOAP 段落本身又有一个
   * 「1. 体格检查：」「2. 辅助检查：」的编号标签，直接拼会变成
   * 「1. 体格检查：查体：右下肺…」。用户手写的字段也可能自带同样的前缀。
   */
  function deLabel(text, labels) {
    let t = stripTail(text);
    labels.forEach(l => {
      const re = new RegExp('^' + l + '[：:]\\s*');
      t = t.replace(re, '');
    });
    return stripTail(t);
  }

  /** 把一段自由文本收尾成完整句子（缺句末标点就补一个） */
  function ensureSentence(text) {
    const raw = String(text || '').trim();
    const t = stripTail(raw);
    if (!t) return '';
    return /[。！？!?；;…]$/.test(raw) ? raw : t + '。';
  }

  /** 取诊断列表（用户没填就是空数组） */
  function diagnosisList(r) {
    return ((r.diagnosis || {}).confirmed || []).map(s => stripTail(s)).filter(Boolean);
  }

  /**
   * 病历特点（S 段）：把现病史压缩成「主诉 + 关键阳性 + 关键阴性」。
   * 用户填了 soap.s.summary 就直接用——手写的永远比压缩的好。
   *
   * 压缩原则（对应评分表「概括简练、重点突出」）：
   *   - 只保留起病、主要症状、有鉴别意义的阴性、阳性体征、关键辅助检查；
   *   - 一般情况、系统回顾之类不进 S 段（它们不体现「特点」）；
   *   - 同一句不重复：主诉已经在标题句里出现，正文不再抄一遍起病原文。
   */
  function draftCaseSummary(r) {
    const b = r.basic || {};
    const h = r.hpi || {};
    const seg = [];
    const who = [b.gender, ageWithUnit(b)].filter(Boolean).join('，');
    const subj = b.department === 'pediatrics' ? '患儿' : '患者';
    let head = who ? `${subj}，${who}` : subj;
    const cc = stripTail(buildChiefComplaint(r));
    if (cc) head += `，因“${cc}”入院`;
    seg.push(head);

    // 关键阳性：症状特点 + 进展（起病时间已在主诉里，不重复）
    const keyPoints = [h.symptoms, h.evolution].map(s => stripTail(s)).filter(Boolean);
    if (keyPoints.length) seg.push(keyPoints.join('，'));

    // 关键阴性：有鉴别意义的阴性病史最能体现思路，必须保留
    if (stripTail(h.negativeDiscriminating)) seg.push(stripTail(h.negativeDiscriminating));

    // 阳性体征与辅助检查各留一句，细节放到 O 段，避免 S/O 两段重复
    const abn = abnormalPE(r);
    if (abn.length) seg.push(`查体：${abn.slice(0, 3).map(a => a.text).join('，')}`);
    const aux = auxItems(r);
    if (aux.length) {
      seg.push(`辅助检查：${aux.slice(0, 2).map(it =>
        it.name && it.result ? `${it.name}（${it.result}）` : (it.name || it.result)).join('；')}`);
    }
    return joinSentences(seg);
  }

  /** O 段：对诊断有意义的体格检查（只取阳性，阴性不进 O 段） */
  function draftObjectivePE(r) {
    const abn = abnormalPE(r);
    const v = (r.pe || {}).vitals || {};
    const parts = [];
    const t = parseFloat(v.temperature);
    if (!isNaN(t) && t >= 37.3) parts.push(`T ${v.temperature}℃`);
    const p = parseFloat(v.pulse);
    if (!isNaN(p) && (p > 100 || p < 60)) parts.push(`P ${v.pulse}次/分`);
    const rr = parseFloat(v.respiration);
    if (!isNaN(rr) && (rr > 20 || rr < 12)) parts.push(`R ${v.respiration}次/分`);
    const sbp = parseFloat(v.sbp);
    if (!isNaN(sbp) && (sbp >= 140 || sbp < 90)) {
      parts.push(`BP ${v.sbp || '—'}/${v.dbp || '—'}mmHg`);
    }
    const texts = parts.concat(abn.map(a => a.text).filter(Boolean));
    if (!texts.length) return '未见与诊断相关的阳性体征';
    return texts.join('，');
  }

  /** O 段：与疾病相关的辅助检查结果 */
  function draftObjectiveAux(r) {
    const aux = auxItems(r);
    if (!aux.length) return '相关辅助检查结果暂缺';
    return aux.map(it => {
      if (it.name && it.result) return `${it.name}${it.result}`;
      return it.name || it.result;
    }).join('；');
  }

  /**
   * 三依据（病史/体检/辅助检查）齐全的逐诊断依据。
   *
   * 自动草稿只在第一条（主诊断）上给依据——多条诊断共用同一段「体检/辅助检查」
   * 正是评分表「诊断依据堆砌、内容空洞」要扣分的写法。其余诊断明确留空，
   * 提示用户各自补，宁可空着也不复制粘贴。
   */
  function draftBasisDetail(r) {
    const items = ((r.soap || {}).a || {}).basisDetail;
    if (Array.isArray(items) && items.length) {
      return items.filter(x => x && stripTail(x.diagnosis));
    }
    const dx = diagnosisList(r);
    if (!dx.length) return [];
    const hpiText = [
      stripTail((r.hpi || {}).onset), stripTail((r.hpi || {}).symptoms),
      stripTail((r.hpi || {}).accompanying), stripTail((r.hpi || {}).negativeDiscriminating)
    ].filter(Boolean).join('，');
    const abn = abnormalPE(r);
    const aux = auxItems(r);
    return dx.map((d, i) => i === 0
      ? {
        diagnosis: d,
        history: hpiText,
        pe: abn.length ? abn.slice(0, 2).map(a => a.text).join('，') : '',
        aux: aux.length ? `${aux[0].name}${aux[0].result}` : ''
      }
      : { diagnosis: d, history: '', pe: '', aux: '' });
  }

  /**
   * 判断鉴别诊断是否与现有诊断相关。
   *
   * 这是给「自查」用的**保守**启发式，只在明显跑题时返回结果——它宁可漏报，
   * 也不能把临床合理的鉴别误判成无关（假阳性会让用户不敢用这个提示）。
   * 判为相关的三条途径：
   *   ① 鉴别病名与任一诊断名有 ≥2 字的公共片段（急性胆囊炎 / 急性阑尾炎）；
   *   ② 鉴别病名本身就是诊断参考提示里的候选疾病（47 条规则覆盖了内科常见鉴别）；
   *   ③ 鉴别病名直接出现在主诉或现病史里（如以「咯血」为主诉时的肺结核）。
   * 三条都不满足才算「关联不明确」，且只用于质控提醒，绝不写进病历正文。
   */
  function diffRelatedToDiagnosis(r) {
    const dx = diagnosisList(r);
    const diffs = (((r.soap || {}).a || {}).diff) || [];
    if (!Array.isArray(diffs) || !diffs.length) return { total: 0, unrelated: [] };

    const joined = dx.join('|');
    const narrative = [
      stripTail((r.basic || {}).chiefComplaint),
      stripTail((r.hpi || {}).symptoms),
