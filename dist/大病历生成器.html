      stripTail((r.hpi || {}).accompanying),
      stripTail((r.hpi || {}).evolution)
    ].join('|');
    // 诊断提示规则里的候选病名（hints.js 在浏览器里晚于 generator 加载，
    // 所以这里用运行时的 typeof 判断，拿不到就退化为前两条途径）
    const ruleNames = (typeof globalThis !== 'undefined' &&
      globalThis.HINTS && Array.isArray(globalThis.HINTS.RULES))
      ? globalThis.HINTS.RULES.map(x => String(x.name || ''))
      : [];

    const sharesFragment = (name, pool) => {
      if (!pool) return false;
      for (let i = 0; i + 2 <= name.length; i++) {
        if (pool.includes(name.slice(i, i + 2))) return true;
      }
      return false;
    };

    const unrelated = diffs
      .filter(d => d && stripTail(d.diagnosis))
      .filter(d => {
        const name = stripTail(d.diagnosis);
        if (sharesFragment(name, joined)) return false;           // ①
        if (ruleNames.some(rn => rn && rn.includes(name))) return false; // ②
        if (narrative && narrative.includes(name)) return false;  // ③
        return true;
      })
      .map(d => stripTail(d.diagnosis));
    return { total: diffs.length, unrelated };
  }

  /**
   * 首次病程录的「自查提醒」——只给界面提示，**不进入病历正文**。
   *
   * 之所以单独成函数：buildFirstCourseRecord 的返回值会被用户整段复制进
   * 病历系统，任何「请确认是否保留」之类的话混进去都会变成病历的一部分。
   *
   * @returns {string[]} 需要提醒用户的事项，没有则返回空数组
   */
  function firstCourseSelfCheck(r) {
    const out = [];
    const a = (((r.soap || {}).a) || {});
    if (!stripTail(a.diffNote)) {
      const check = diffRelatedToDiagnosis(r);
      if (check.unrelated.length) {
        out.push(`${check.unrelated.join('、')} 与现有诊断的关联不明确，`
          + '请确认是否保留（评分表对「与诊断无关的鉴别诊断」扣 5 分）。');
      }
    }
    return out;
  }

  /**
   * 生成首次病程录。
   *
   * @param {object} r record
   * @param {object} [opts] { date: 'YYYY-MM-DD HH:mm' } 只用于标题时间，不填则不写时间
   * @returns {string} 含「病历特点」「诊断依据」「鉴别诊断」「诊疗计划」四个小标题的纯文本
   */
  function buildFirstCourseRecord(r, opts = {}) {
    const rec = r || {};
    const soap = rec.soap || {};
    const s = soap.s || {};
    const o = soap.o || {};
    const a = soap.a || {};
    const p = soap.p || {};

    const lines = [];
    const stamp = stripTail(opts.date);
    lines.push(stamp ? `【首次病程录】${stamp}` : '【首次病程录】');

    /* ---------- 一、病历特点（S） ---------- */
    lines.push('一、病历特点（S）');
    const summary = stripTail(s.summary) || draftCaseSummary(rec);
    lines.push(ensureSentence(summary) || '（待补充：请概括现病史要点）');
    // 「与病史采集一致」这一项不写额外事实，只做一句自检说明
    const consistency = stripTail(s.consistency);
    if (consistency) lines.push(ensureSentence(consistency));

    /* ---------- 二、客观体检记录/检查结果（O） ---------- */
    lines.push('二、客观记录（O）');
    const peText = deLabel(o.pe || draftObjectivePE(rec), ['查体', '体格检查']);
    const auxText = deLabel(o.aux || draftObjectiveAux(rec), ['辅助检查', '检查']);
    lines.push(`1. 体格检查：${ensureSentence(peText)}`);
    lines.push(`2. 辅助检查：${ensureSentence(auxText)}`);

    /* ---------- 三、诊断依据（A） ---------- */
    lines.push('三、诊断依据（A）');
    const basis = stripTail(a.basis);
    if (basis) lines.push(ensureSentence(basis));
    const details = draftBasisDetail(rec);
    if (details.length) {
      details.forEach(d => {
        const bits = [];
        if (stripTail(d.history)) bits.push(`①病史：${stripTail(d.history)}`);
        if (stripTail(d.pe)) bits.push(`②体检：${stripTail(d.pe)}`);
        if (stripTail(d.aux)) bits.push(`③辅助检查：${stripTail(d.aux)}`);
        const body = bits.length ? bits.join('；') : '（待补充病史、体检、辅助检查三方面依据）';
        lines.push(`· ${stripTail(d.diagnosis)}：${ensureSentence(body)}`);
      });
    } else {
      lines.push('· （待补充初步诊断，再逐条列出诊断依据）');
    }
    const ranking = stripTail(a.ranking);
    if (ranking) lines.push(`主次：${ensureSentence(ranking)}`);

    /* ---------- 四、鉴别诊断（A） ---------- */
    lines.push('四、鉴别诊断（A）');
    const diffs = Array.isArray(a.diff) ? a.diff.filter(d => d && stripTail(d.diagnosis)) : [];
    if (diffs.length) {
      diffs.forEach(d => {
        const bits = [];
        if (stripTail(d.why)) bits.push(`支持点：${stripTail(d.why)}`);
        if (stripTail(d.against)) bits.push(`不支持点：${stripTail(d.against)}`);
        if (stripTail(d.points)) bits.push(`鉴别要点：${stripTail(d.points)}`);
        const tail = bits.length ? '：' + bits.join('；') : '';
        lines.push(`· 需与${stripTail(d.diagnosis)}鉴别${ensureSentence(tail)}`);
      });
    } else {
      // 没填鉴别诊断时用 HINTS 的「该鉴别什么」作提示，绝不自动写进病历正文
      lines.push('· （待补充：结合主要诊断展开鉴别，可参考诊断参考提示中的候选疾病）');
    }
    const diffNote = stripTail(a.diffNote);
    if (diffNote) {
      lines.push(ensureSentence(diffNote));
    }
    // 注意：与诊断无关的鉴别诊断属于「自查提醒」，是给考生看的话，不是病历内容。
    // 它绝不能写进本函数的返回值——用户会整段复制进病历系统。
    // 需要的界面请调用 firstCourseSelfCheck(rec) 单独取用。

    /* ---------- 五、诊疗计划（P） ---------- */
    lines.push('五、诊疗计划（P）');
    const principle = stripTail(p.principle);
    if (principle) lines.push(ensureSentence(principle));
    const plans = Array.isArray(p.perDiagnosis) ? p.perDiagnosis.filter(x => x && stripTail(x.diagnosis)) : [];
    if (plans.length) {
      plans.forEach(x => {
        const bits = [];
        if (stripTail(x.exam)) bits.push(`检查：${stripTail(x.exam)}`);
        if (stripTail(x.treatment)) bits.push(`治疗：${stripTail(x.treatment)}`);
        const body = bits.length ? bits.join('；') : '（待补充具体检查与治疗措施）';
        lines.push(`· ${stripTail(x.diagnosis)}：${ensureSentence(body)}`);
      });
    } else {
      lines.push('· （待补充：按诊断逐条列出拟完善检查与治疗措施）');
    }
    const individual = stripTail(p.individual);
    if (individual) lines.push(`个体化：${ensureSentence(individual)}`);

    return lines.join('\n') + '\n';
  }

  /* ===================================================================
   * 出院记录（评分表第6–7页 15 分）
   *
   * 六项小标题固定：一般情况 / 入院情况 / 诊疗经过 / 出院情况 / 出院诊断 / 出院医嘱。
   * 出院医嘱拆成药物、非药物、生活指导、复诊时间四句，对应评分表括号里的四项。
   * =================================================================== */

  /** 住院天数：两个 'YYYY-MM-DD' 之差；算不出来返回 0 */
  function hospitalDays(admitDate, dischargeDate) {
    const parse = s => {
      const m = String(s || '').match(/(\d{4})\D?(\d{1,2})\D?(\d{1,2})/);
      if (!m) return null;
      const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      return isNaN(d.getTime()) ? null : d;
    };
    const a = parse(admitDate);
    const b = parse(dischargeDate);
    if (!a || !b) return 0;
    const diff = Math.round((b - a) / 86400000);
    return diff > 0 ? diff : 0;
  }

  /**
   * 生成出院记录。
   * @param {object} r record
   * @returns {string} 含六项小标题的纯文本
   */
  function buildDischargeRecord(r) {
    const rec = r || {};
    const b = rec.basic || {};
    const d = rec.discharge || {};
    const advice = d.advice || {};
    const lines = [];
    lines.push('【出院记录】');

    /* ---------- 一般情况 ---------- */
    const general = [];
    if (stripTail(b.name)) general.push(`姓名：${stripTail(b.name)}`);
    if (stripTail(b.gender)) general.push(`性别：${stripTail(b.gender)}`);
    if (ageWithUnit(b)) general.push(`年龄：${ageWithUnit(b)}`);
    if (stripTail(b.recordNo)) general.push(`病历号：${stripTail(b.recordNo)}`);
    if (stripTail(b.admitDate)) general.push(`入院日期：${stripTail(b.admitDate)}`);
    const disDate = stripTail(d.dischargeDate);
    if (disDate) general.push(`出院日期：${disDate}`);
    const days = hospitalDays(b.admitDate, d.dischargeDate);
    if (days) general.push(`住院天数：${days}天`);
    lines.push('一、一般情况');
    lines.push(general.length ? joinSentences([general.join('，')]) : '（待补充姓名、性别、年龄、入院及出院日期）');

    /* ---------- 入院情况 ---------- */
    lines.push('二、入院情况');
    const admit = stripTail(d.admitCondition) || (() => {
      // 自动草稿：主诉 + 主要阳性体征 + 入院诊断（只写入院当时的状态）
      const seg = [];
      const cc = stripTail(buildChiefComplaint(rec));
      if (cc) seg.push(`因“${cc}”入院`);
      const abn = abnormalPE(rec);
      if (abn.length) seg.push(`入院查体${abn.slice(0, 3).map(a => a.text).join('，')}`);
      const dx = diagnosisList(rec);
      if (dx.length) seg.push(`入院诊断：${dx.join('、')}`);
      return seg.length ? joinSentences(seg) : '';
    })();
    lines.push(admit ? ensureSentence(admit) : '（待补充：入院时主要症状、体征与入院诊断）');

    /* ---------- 诊疗经过 ---------- */
    lines.push('三、诊疗经过');
    lines.push(d.course ? ensureSentence(d.course) : '（待补充：住院期间病情变化、检查结果、治疗经过及效果）');

    /* ---------- 出院情况 ---------- */
    lines.push('四、出院情况');
    lines.push(d.dischargeStatus ? ensureSentence(d.dischargeStatus) : '（待补充：出院时主要症状、体征、辅助检查结果）');

    /* ---------- 出院诊断 ---------- */
    lines.push('五、出院诊断');
    const outDx = (Array.isArray(d.diagnoses) ? d.diagnoses : [])
      .map(s => stripTail(s)).filter(Boolean);
    const dxList = outDx.length ? outDx : diagnosisList(rec);
    lines.push(dxList.length
      ? dxList.map((s, i) => `${i + 1}. ${s}`).join('\n')
      : '（待补充出院诊断）');

    /* ---------- 出院医嘱 ---------- */
    lines.push('六、出院医嘱');
    const orders = [];
    if (stripTail(advice.drug)) orders.push(`药物治疗：${stripTail(advice.drug)}`);
    if (stripTail(advice.nonDrug)) orders.push(`非药物治疗：${stripTail(advice.nonDrug)}`);
    if (stripTail(advice.lifestyle)) orders.push(`生活指导：${stripTail(advice.lifestyle)}`);
    if (stripTail(advice.followUp)) orders.push(`复诊时间：${stripTail(advice.followUp)}`);
    lines.push(orders.length ? joinSentences(orders) : '（待补充：药物、非药物治疗、生活指导、复诊时间）');

    return lines.join('\n') + '\n';
  }

  /* ---------------------------- 组装全文 ---------------------------- */

  const SECTION_ORDER = [
    '一般项目', '主诉', '现病史', '既往史', '系统回顾', '个人史',
    '婚姻史', '月经与生育史', '家庭史', '体格检查', '实验室检查',
    '摘要', '诊断依据', '初步诊断'
  ];

  /**
   * 诊断依据：把每条诊断的病史/体检/辅助检查三方面依据逐条列出。
   * 这是模板里的独立一节（位于摘要之后、初步诊断之前）。
   */
  function buildBasisSection(r) {
    const items = draftBasisDetail(r);
    if (!items.length) return '待补充：先填写初步诊断，再逐条列出诊断依据。';
    const lines = [];
    items.forEach((it, i) => {
      const parts = [];
      if (stripTail(it.history)) parts.push(`病史：${stripTail(it.history)}`);
      if (stripTail(it.pe)) parts.push(`体格检查：${stripTail(it.pe)}`);
      if (stripTail(it.aux)) parts.push(`辅助检查：${stripTail(it.aux)}`);
      const body = parts.length ? parts.join('；') : '（待补充病史、体检、辅助检查三方面依据）';
      lines.push(`${i + 1}. ${stripTail(it.diagnosis)}：${body}`);
    });
    return lines.join('\n');
  }

  /**
   * 生成大病历全文
   * @param {object} r record
   * @param {object} opts { rosMode: 'detail'|'brief' }
   */
  function generate(r, opts = {}) {
    const rosMode = opts.rosMode || 'detail';
    const sections = {};
    sections['一般项目'] = buildBasicInfo(r);
    sections['主诉'] = buildChiefComplaint(r);
    sections['现病史'] = buildHPI(r);
    sections['既往史'] = buildPMH(r);
    sections['系统回顾'] = buildROS(r, rosMode);
    sections['个人史'] = buildPersonal(r);
    sections['婚姻史'] = buildMarriageHistory(r);
    sections['月经与生育史'] = buildMenstruationChildbirth(r);
    sections['家庭史'] = buildFamily(r);
    sections['体格检查'] = buildPE(r);
    sections['实验室检查'] = buildAuxiliary(r);
    sections['摘要'] = buildSummary(r);
    sections['诊断依据'] = buildBasisSection(r);
    sections['初步诊断'] = buildDiagnosis(r);

    const lines = [];
    SECTION_ORDER.forEach(name => {
      const body = sections[name];
      if (!body) return;
      lines.push(`【${name}】`);
      lines.push(body);
      lines.push('');
    });
    return { text: lines.join('\n').trim() + '\n', sections, warnings: validate(r) };
  }

  /**
   * 纯文本导出：不用【】标题，接近纸质病历的书写格式。
   * 单句章节（主诉、现病史）写成「名称：正文」；
   * 分项章节（一般项目、既往史、个人史…）写成「名称：」换行再列各项。
   */
  function generatePlain(r, opts = {}) {
    const { sections } = generate(r, opts);
    const out = [];
    SECTION_ORDER.forEach(n => {
      const body = sections[n];
      if (!body) return;
      if (body.includes('\n')) out.push(`${n}：\n${body}`);
      else out.push(`${n}：${body}`);
    });
    return out.join('\n') + '\n';
  }


  /* ---------------------------- 质控提醒 ---------------------------- */

  const DIAG_WORDS = [
    // 心血管
    '高血压', '糖尿病', '冠心病', '心梗', '心肌梗死', '心绞痛', '心衰', '心力衰竭',
    '房颤', '心房颤动', '心律失常', '瓣膜病',
    // 呼吸
    '肺炎', '肺结核', '哮喘', '慢阻肺', 'COPD', '支气管炎', '气胸', '肺栓塞',
    // 消化
    '胃炎', '胃溃疡', '十二指肠溃疡', '胆囊炎', '胆结石', '胰腺炎', '阑尾炎',
    '肠梗阻', '肠炎', '肝炎', '肝硬化', '消化道出血',
    // 泌尿
    '肾炎', '肾病', '肾衰', '肾功能不全', '泌尿系感染', '尿路感染', '肾结石',
    // 血液
    '贫血', '白血病', '淋巴瘤', '血小板减少',
    // 神经
    '脑梗', '脑梗死', '脑出血', '脑卒中', '偏头痛', '癫痫', '帕金森',
    // 内分泌/风湿
    '甲亢', '甲减', '甲状腺功能', '风湿', '类风湿', '痛风', '红斑狼疮',
    // 外科/骨科
    '骨折', '脱位', '疝', '痔疮',
    // 肿瘤
    '肿瘤', '癌', '肉瘤', '白血病',
    // 妇产
    '妊娠期高血压', '子痫', '宫外孕', '异位妊娠', '盆腔炎'
  ];

  function validate(r) {
    const w = [];
    const b = r.basic || {};
    if (!b.name) w.push('【一般项目】缺少姓名。');
    if (!b.gender) w.push('【一般项目】缺少性别。');
    if (!b.age) w.push('【一般项目】缺少年龄。');
    const cc = stripTail(b.chiefComplaint);
    if (!cc) {
      w.push('【主诉】未填写。');
    } else {
      if (cc.length > 20) w.push(`【主诉】文字偏长（${cc.length}字），一般要求不超过20字，只写症状+时间、不写诊断。`);
      const hit = DIAG_WORDS.filter(dw => cc.includes(dw));
      if (hit.length) w.push(`【主诉】疑似包含诊断性词语（${hit.join('、')}），主诉应写症状，建议改为症状描述。`);
      if (!stripTail(b.chiefComplaintDuration)) w.push('【主诉】缺少持续时间。');
    }
    if (!(buildHPI(r) || '').trim()) w.push('【现病史】未填写。');
    // 系统回顾：只有完全没动过才提醒
    const rosTouched = Object.keys(r.ros || {}).some(sysKey =>
      Object.values(r.ros[sysKey] || {}).some(v => v && (v.checked || v.detail || v.time))
    );
    if (!rosTouched) {
      w.push('【系统回顾】尚未勾选，建议逐系统过一遍（默认为阴性，勾选阳性症状即可）。');
    }
    const abn = abnormalPE(r);
    if (!abn.length && !Object.keys((r.pe || {}).vitals || {}).length) {
      w.push('【体格检查】未录入异常或生命体征。');
    }
    if (!((r.diagnosis || {}).confirmed || []).length) w.push('【初步诊断】未填写，可参考"诊断提示"。');
    if (!stripTail(r.summary || '')) {
      w.push('【摘要】目前为自动生成的初稿，请核对并润色后再定稿。');
    }

    // 首次病程录（第5页/第6页）：只提醒「有缺项」，不把提示写进病历正文
    const soap = r.soap || {};
    const a = soap.a || {};
    const p = soap.p || {};
    if (!(Array.isArray(a.diff) && a.diff.some(d => d && stripTail(d.diagnosis)))) {
      w.push('【首次病程录】鉴别诊断未填写，建议围绕主要诊断写 2 条左右，说明为什么考虑、哪一点不支持。');
    }
    if (!(Array.isArray(p.perDiagnosis) && p.perDiagnosis.some(x => x && stripTail(x.diagnosis)))) {
      w.push('【首次病程录】诊疗计划尚未按诊断逐条列出检查与治疗措施。');
    }
    if (Array.isArray(a.diff) && a.diff.length) {
      const chk = diffRelatedToDiagnosis(r);
      if (chk.unrelated.length) {
        w.push(`【首次病程录】${chk.unrelated.join('、')} 与现有诊断关联不明确，请确认是否保留。`);
      }
    }

    // 出院记录：六项缺任一项都会让记录不完整
    const d = r.discharge || {};
    const adv = d.advice || {};
    if (!stripTail(d.dischargeStatus)) w.push('【出院记录】出院情况未填写。');
    if (!stripTail(d.dischargeDate)) w.push('【出院记录】出院日期未填写，住院天数无法计算。');
    const advMissing = ['drug', 'nonDrug', 'lifestyle', 'followUp'].filter(k => !stripTail(adv[k]));
    if (advMissing.length === 4) {
      w.push('【出院记录】出院医嘱未填写（药物、非药物、生活指导、复诊时间四项）。');
    } else if (advMissing.length) {
      w.push(`【出院记录】出院医嘱缺：${advMissing.map(k => ({
        drug: '药物治疗', nonDrug: '非药物治疗', lifestyle: '生活指导', followUp: '复诊时间'
      })[k]).join('、')}。`);
    }
    return w;
  }

  return {
    generate, generatePlain, validate,
    buildBasicInfo, buildChiefComplaint, buildHPI, buildROS, buildPMH,
    buildPersonal, buildMarriage, buildMenstruation, buildChildbirth,
    buildMarriageChildbirth,
    buildFamily, buildPE, buildVitals, buildAuxiliary, buildSummary,
    buildDiagnosis, draftSummary, draftHPI, abnormalPE, peValue, collectROS, firstCourseSelfCheck, diffRelatedToDiagnosis, buildMarriageHistory, buildMenstruationChildbirth, buildBasisSection, renderPEGroup,
    // 查体项聚合（父项 / 子项去重）
    peEntries, buildFocusPE,
    // 首次病程录（SOAP）与出院记录
    buildFirstCourseRecord, buildDischargeRecord,
    draftCaseSummary, draftObjectivePE, draftObjectiveAux, draftBasisDetail,
    diffRelatedToDiagnosis, diagnosisList, auxItems, hospitalDays,
    mergeIntoHistory,
    joinSentences, stripTail, SECTION_ORDER
  };
})();


</script>
<script>
/* ===========================================================================
 * 诊断参考提示（不自动写入病历，仅作为清单提醒，由使用者自行判断）
 *
 * 匹配键说明：
 *   cc:症状          主诉/现病史中出现该关键词
 *   ros:系统.症状    系统回顾中该症状勾选为阳性
 *   pmh:疾病         既往史中勾选该疾病
 *   pe:组.条目       该查体条目为「异常」（非默认值）
 *   pev:组.条目=值   该查体条目命中具体异常描述（推荐用法）
 *   vital:xxx        生命体征异常（tempUp/tachy/tachypnea/bpUp/bpDown/bmiHigh）
 *   aux:xxx          辅助检查名称含关键词
 *   smoke:有 / risk:xxx / gender:女 / age:elderly|fertile|child
 *
 * need：命中最少条数才提示（避免过度敏感）
 * =========================================================================== */

const HINTS = (() => {
  'use strict';

  const RULES = [
    /* ------------------------------ 呼吸 ------------------------------ */

      match: ['cc:发热', 'cc:咳嗽', 'ros:resp.cough', 'ros:resp.sputum', 'vital:tempUp',

        'pev:chest.lungAuscultation=右下肺可闻及湿性啰音',

    },
    {
      id: 'copd', name: '慢性阻塞性肺疾病（急性加重）',
      depts: ['respiratory', 'general', 'emergency'],
      must: ['smoke:有','ros:resp.dyspnea','ros:resp.wheeze','pe:chest.chestShape','pe:chest.lungPercussion'],
      need: 2,
      match: ['smoke:有', 'ros:resp.dyspnea', 'ros:resp.wheeze', 'cc:气促', 'cc:喘息',
        'pev:chest.chestShape=桶状胸', 'pev:chest.lungPercussion=双肺叩诊过清音',
        'pev:chest.lungAuscultation=呼吸音减弱'],
      hint: '长期吸烟、慢性咳嗽咳痰伴活动后气短，桶状胸/过清音/呼吸音减弱，需考虑 COPD。',
      note: '可补充：肺功能（吸入支气管扩张剂后 FEV1/FVC<70%）、血气分析、胸部CT。'
    },
    {
      id: 'asthma', name: '支气管哮喘',
      depts: ['respiratory', 'pediatrics', 'general'],
      must: ['ros:resp.wheeze','ros:resp.dyspnea','pe:chest.lungAuscultation'],
      need: 2,
      match: ['ros:resp.wheeze', 'ros:resp.dyspnea', 'cc:喘息', 'cc:胸闷',
        'pev:chest.lungAuscultation=双肺可闻及哮鸣音'],
      hint: '反复发作性喘息、胸闷，双肺可闻及哮鸣音，需考虑支气管哮喘。',
      note: '可补充：肺功能+支气管舒张/激发试验、呼出气NO、过敏原、嗜酸性粒细胞计数。'
    },
    {

  /* ---------------------- 查体项别名映射（P1-14） ---------------------- */

  /**
   * 查体项被拆分后，旧的聚合 key 仍然被规则引用，必须保持可用。
   *
   * 背景：为了让评分表里「按项给分」的查体能被逐项核对，abdomen / nervousPE /
   * spine 三组做了「保留父项 + 新增子项」的拆分。子项的默认值是空字符串，
   * 用户填了子项之后父项就一直是默认值，于是 `pe:abdomen.abdPalpation` 这类
   * 键永远不会产生——而「急性阑尾炎」「中枢神经系统感染」等规则的 must 正是它，
   * 结果会是**静默失效**：不报错，只是该提示的再也不提示。
   *
   * 两级映射：
   *   PE_ALIAS       key 级：子项阳性 → 激活父项的 pe: 键（满足 must）
   *   PE_VALUE_ALIAS 值级：把子项的具体阳性描述折算成父项规则认识的 pev: 值
   *                  （满足 match 计数），折算只做临床上一一对应的情形
   */
  const PE_ALIAS = {
    // 腹部触诊 4 子项 → 聚合父项 abdPalpation
    'abdomen.abdPalpSuperficial': ['abdomen.abdPalpation'],
    'abdomen.abdPalpDeep': ['abdomen.abdPalpation'],
    'abdomen.liverPalpation': ['abdomen.abdPalpation'],
    'abdomen.spleenPalpation': ['abdomen.abdPalpation'],
    // 神经反射 4 子项 → 聚合父项 nerve
    'nervousPE.tendonReflex': ['nervousPE.nerve'],
    'nervousPE.brudzinski': ['nervousPE.nerve'],
    'nervousPE.kernig': ['nervousPE.nerve'],
    'nervousPE.babinski': ['nervousPE.nerve'],
    // 四肢 3 子项 → 聚合父项 limbs（膝跳反射/足背动脉/桡动脉无父项，不映射）
    'spine.limbMuscle': ['spine.limbs'],
    'spine.edemaAnkle': ['spine.limbs'],
    'spine.edemaPretibial': ['spine.limbs']
  };

  /**
   * 值级映射：把子项的具体阳性描述折算成父项规则认识的 pev: 值。
   *
   * 只收录「临床上一一对应、折算不会凭空增加事实」的情形：
   *   布氏征/克氏征阳性 ⇔ 脑膜刺激征阳性（这是定义）
   *   巴氏征阳性     ⇔ 病理反射阳性（这是定义）
   *   踝部/胫前凹陷性水肿 ⇔ 双下肢凹陷性水肿（部位包含关系）
   *   肌力 3/4 级     ⇔ 四肢肌力减退（这是定义）
   *
   * ★★ 腹部触诊刻意**不**折算——这是有意为之，不是遗漏，不要「修好」它 ★★
   *
   * 腹部子项（abdPalpSuperficial / abdPalpDeep / liverPalpation / spleenPalpation）
   * 只做了 key 级映射（PE_ALIAS，让规则 must 仍能命中），值级折算一律不做。
   *
   * 原因：父项的候选值写的是「右下腹压痛、反跳痛」，而子项往往只写了「压痛」。
   * 一旦按值折算，就等于替医生补上「反跳痛」这个**更严重的、实际没有检查**的体征。
   * 病历是医疗记录，工具可以少提示（漏报只是少一个提醒，医生自己会判断），
   * 但绝不能凭空生成没做过的查体发现（误报会直接写进病历、误导诊疗）。
   *
   * 代价很小且已验证：只填「右下腹浅触诊压痛」时，「急性阑尾炎」规则靠
   * must=['pe:abdomen.abdPalpation'] 仍能命中，match 计数靠
   * 「转移性右下腹痛」「发热」等其他条目已满足 need=2。
   *
   * 如果将来有人觉得「少折算一条是 bug」又想加回去，请先读上面这段：
   * 折算方向必须是「文字完全对应」，不允许从「压痛」推出「反跳痛」。
   * 目前只保留了 liverPalpation / spleenPalpation 两个文字完全对应的折算。
   */
  const PE_VALUE_ALIAS = {
    // 神经：布氏征/克氏征阳性 = 脑膜刺激征阳性；巴氏征阳性 = 病理反射阳性
    'nervousPE.brudzinski=布氏征阳性': ['pev:nervousPE.nerve=脑膜刺激征阳性'],
    'nervousPE.kernig=克氏征阳性': ['pev:nervousPE.nerve=脑膜刺激征阳性'],
    'nervousPE.babinski=巴氏征阳性': ['pev:nervousPE.nerve=病理反射阳性'],
    'nervousPE.babinski=双侧巴氏征阳性': ['pev:nervousPE.nerve=病理反射阳性'],
    // 四肢水肿：踝部/胫前凹陷性水肿即「双下肢凹陷性水肿」
    'spine.edemaAnkle=双侧踝部凹陷性水肿': ['pev:spine.limbs=双下肢凹陷性水肿'],
    'spine.edemaPretibial=双侧胫前凹陷性水肿': ['pev:spine.limbs=双下肢凹陷性水肿'],
    // 四肢肌力减退
    'spine.limbMuscle=四肢肌力4级': ['pev:spine.limbs=四肢肌力减退'],
    'spine.limbMuscle=四肢肌力3级': ['pev:spine.limbs=四肢肌力减退'],
    'spine.limbMuscle=双上肢肌力正常、双下肢肌力减退': ['pev:spine.limbs=四肢肌力减退'],
    // 腹部：只折算文字完全对应的情形（不补「反跳痛」）
    'abdomen.liverPalpation=肝肋下可触及': ['pev:abdomen.abdPalpation=肝肋下可触及'],
    'abdomen.spleenPalpation=脾肋下可触及': ['pev:abdomen.abdPalpation=脾肋下可触及']
  };

  /* ---------------------- 从病历中抽取"发现" ---------------------- */

  function extractFindings(r) {
    const F = new Set();
    const b = r.basic || {};

    // 主诉 + 现病史关键词
    // 注意：先剔除否定从句（"无咯血、盗汗""否认胸痛"），否则阴性描述会被误判为阳性
    // 刻意不纳入 hpi.negativeDiscriminating：它是整段阴性病史，"无咯血、盗汗、消瘦"
    // 按顿号切开后「盗汗」「消瘦」会丢掉否定前缀，反而被误判成阳性。
    const rawText = [
      b.chiefComplaint || '',
      (r.hpi || {}).onset || '', (r.hpi || {}).cause || '',
      (r.hpi || {}).symptoms || '', (r.hpi || {}).relief || '',
      (r.hpi || {}).evolution || '', (r.hpi || {}).accompanying || ''
    ].join('，');
    const NEG_RE = /^(无|未|不|否认|没有|未见|未出现|无明显|无明|否认有)/;
    const textAll = rawText
      .split(/[，,。；;、\n]/)
      .filter(clause => clause.trim() && !NEG_RE.test(clause.trim()))
      .join('，');

    const ccKeys = ['发热', '咳嗽', '咳痰', '咯血', '呼吸困难', '气促', '喘息', '胸闷', '胸痛',
      '心悸', '上腹痛', '腹痛', '转移性右下腹痛', '右上腹痛', '腹泻', '呕吐', '腹胀', '黑便',
      '呕血', '黄疸', '水肿', '血尿', '头痛', '头晕', '乏力', '消瘦'];
    ccKeys.forEach(k => { if (textAll.includes(k)) F.add('cc:' + k); });

    // 系统回顾阳性
    (SCHEMA.ROS || []).forEach(sys => {
      const store = (r.ros || {})[sys.key] || {};
      sys.symptoms.forEach(sym => {
        if ((store[sym.key] || {}).checked) F.add(`ros:${sys.key}.${sym.key}`);
      });
    });

    // 既往史
    Object.keys(((r.pmh || {}).diseaseChecks) || {}).forEach(k => {
      if (r.pmh.diseaseChecks[k]) F.add('pmh:' + k);
    });
    // 慢性病史手写文本也识别
    const pmhText = `${(r.pmh || {}).diseaseDetail || ''} ${(r.pmh || {}).special || ''}`;
    ['高血压', '糖尿病', '冠心病', '慢性肾脏病', '肝硬化', '病毒性肝炎', '脑卒中',
      '痛风', '甲状腺功能亢进', '甲状腺功能减退', '类风湿关节炎', '肺结核']
      .forEach(dz => { if (pmhText.includes(dz)) F.add('pmh:' + dz); });

    // 个人史
    const per = r.personal || {};
    if (per.smoking === '有' || per.smoking === '已戒') F.add('smoke:有');
    if (per.smoking === '有' || per.smoking === '已戒') F.add('risk:smoke');
    if (per.drinking === '有' || per.drinking === '已戒') F.add('risk:alcohol');
    if (String((r.pmh || {}).trauma || '').trim()) F.add('trauma:有');

    // 生命体征
    const v = (r.pe || {}).vitals || {};
    const t = parseFloat(v.temperature);
    if (!isNaN(t)) {
      if (t >= 37.3) F.add('vital:tempUp');
      if (t <= 36) F.add('vital:tempDown');
    }
    const p = parseFloat(v.pulse);
    if (!isNaN(p)) {
      if (p > 100) F.add('vital:tachy');
      if (p < 60) F.add('vital:brady');
    }
    const rr = parseFloat(v.respiration);
    if (!isNaN(rr) && rr > 20) F.add('vital:tachypnea');
    const sbp = parseFloat(v.sbp), dbp = parseFloat(v.dbp);
    if (!isNaN(sbp)) {
      if (sbp >= 140) { F.add('vital:bpUp'); F.add('risk:htn'); }
      if (sbp < 90) F.add('vital:bpDown');
    }
    if (!isNaN(dbp) && dbp >= 90) F.add('vital:bpUp');
    const hgt = parseFloat(v.height), wgt = parseFloat(v.weight);
    if (!isNaN(hgt) && !isNaN(wgt) && hgt > 0) {
      const bmi = wgt / Math.pow(hgt / 100, 2);
      if (bmi >= 28) F.add('vital:bmiHigh');
      if (bmi < 18.5) F.add('vital:bmiLow');
    }

    // 体格检查：异常项用 pe: 与 pev: 两种键
    //
    // 两个必须在这里处理的兼容问题：
    //   ① 默认值比对不能用 `val === it.default`：t2 按评分表重写了腹部四项的默认
    //      文案，旧存档里存的是旧文案（legacyDefault），只比 default 会把一个完全
    //      正常的腹部读成 4 条阳性发现。统一交给 SCHEMA.peValueIsDefault。
    //   ② 查体项拆分后（父项保留 + 新增子项），用户改用子项时父项会保持默认值，
    //      于是 pe:组.父项 永远不产生，而 47 条规则里的 must 恰恰指着父项
    //      → 规则会静默失效（不报错、只是不再提示）。所以子项一旦是异常值，
    //      必须把对应的旧聚合 key 一并激活。映射表见 PE_ALIAS。
    // 统一去掉尾部标点后再生成 pev: 键。
    // 用户在文本框里补一个句号（"右下腹压痛、反跳痛。"）时，
    // 若用原始串拼 key，值别名映射会精确匹配失败，规则静默丢掉一条 match（评审 medium-3）。
    const normVal = s => String(s).trim().replace(/[，,；;。.、\s]+$/g, '');

    (SCHEMA.PE_COMMON || []).forEach(g => {
      g.items.forEach(it => {
        const val = (GENERATOR.peValue ? GENERATOR.peValue(r, g.key, it) : '') || '';
        if (!val) return;
        if (SCHEMA.peValueIsDefault ? SCHEMA.peValueIsDefault(it, val) : (it.default && val === it.default)) return;
        // 子项默认值是空字符串，用户很可能直接选「正常」那条（item.normal）。
        // 选正常 = 没异常，不能产生 pe: / pev:，否则会凭空触发诊断提示。
        if (it.normal && normVal(val) === normVal(it.normal)) return;
        const v = normVal(val);
        if (!v) return;   // 只有一个标点的输入不算阳性
        F.add(`pe:${g.key}.${it.key}`);
        F.add(`pev:${g.key}.${it.key}=${v}`);
        // 子项阳性 → 同步激活旧聚合 key，并折算成父项规则认识的值
        const fullKey = `${g.key}.${it.key}`;
        (PE_ALIAS[fullKey] || []).forEach(parentRef => { F.add(`pe:${parentRef}`); });
        (PE_VALUE_ALIAS[`${fullKey}=${v}`] || []).forEach(k => F.add(k));
      });
    });
    const deptKey = b.department || 'general';
    const dept = (SCHEMA.DEPARTMENTS || []).find(d => d.key === deptKey);
    ((dept && dept.special) || []).forEach(sp => {
      (((SCHEMA.PE_SPECIAL[sp] || {}).items) || []).forEach(it => {
        const val = (GENERATOR.peValue ? GENERATOR.peValue(r, 'special_' + sp, it) : '') || '';
        if (!val) return;
        if (SCHEMA.peValueIsDefault ? SCHEMA.peValueIsDefault(it, val) : (it.default && val === it.default)) return;
        const v = normVal(val);
        if (!v) return;
        F.add(`pe:special_${sp}.${it.key}`);
        F.add(`pev:special_${sp}.${it.key}=${v}`);
      });
    });

    // 辅助检查关键词
    const auxText = (((r.auxiliary || {}).items) || [])
      .map(i => (i.name || '') + (i.result || '')).join(' ').toLowerCase();
    ['胸片', '超声', '心电图', '血常规', '尿常规', '淀粉酶', '脂肪酶', '血红蛋白', '尿蛋白', '大便']
      .forEach(k => { if (auxText.includes(k)) F.add('aux:' + k); });
    if (auxText.includes('ct')) F.add('aux:CT');

    // 人口学
    if (b.gender === '女') F.add('gender:女');
    const age = parseInt(b.age, 10);
    if (!isNaN(age)) {
      if (age >= 65) F.add('age:elderly');
      if (age >= 14 && age <= 49) F.add('age:fertile');
      if (age < 14) F.add('age:child');
    }
    const lmp = (r.menstruation || {}).lmp || '';
    if (/停经|推迟|未至|闭经|未来/.test(lmp)) F.add('menstruation:delay');

    return F;
  }

  /**
   * 计算提示
   * @returns [{ id, name, hint, note, matched:[...], score, deptMatch }]
   */
  function analyze(r) {
    const F = extractFindings(r);
    const deptKey = (r.basic || {}).department || 'general';
    const out = [];
    RULES.forEach(rule => {
      // 专科规则：本科室或通用科才提示（儿科/妇产等规则不会出现在内科病历里）
      const depts = rule.depts || [];
      const inDept = deptKey === 'general' || depts.includes(deptKey) || depts.includes('general');
      if (!inDept) return;

      const matched = rule.match.filter(m => F.has(m));
      if (matched.length < (rule.need || 2)) return;

      // 必要条件：必须命中其中至少一条，否则不提示（防止仅凭发热/心率就误报）
      if (rule.must && rule.must.length) {
        const mustHit = rule.must.some(m => F.has(m));
        if (!mustHit) return;
      }

      out.push({
        id: rule.id,
        name: rule.name,
        hint: rule.hint,
        note: rule.note,
        matched,
        score: matched.length / (rule.need || 2),
        deptMatch: deptKey === 'general' || depts.includes(deptKey)
      });
    });
    out.sort((a, b2) => (b2.deptMatch - a.deptMatch) || (b2.score - a.score));
    return out;
  }

  return { RULES, analyze, extractFindings, PE_ALIAS, PE_VALUE_ALIAS };
})();


</script>
<script>
﻿/* ===========================================================================
 * UI 层：分步骤表单、本地保存、预览导出、评分自查
 * 依赖 RECORD_CORE / SCHEMA / CHECKER / GENERATOR / HINTS（构建时内联到同一文件）
 *
 * 存储与数据校验一律走 RECORD_CORE（可在 node:test 中单测），
 * 评分一律走 CHECKER，这里只负责 DOM 与用户交互。
 *
 * 界面职责边界：
 *   · 病历正文 = 大病历（12 个章节）
 *   · 首次病程录 = 同一份病历的 SOAP 归纳，不重复抄病历
 *   · 出院记录 = 住院经过的收尾文书
 *   · 评分自查 = 对照评分表逐条核对「还缺什么」，不落盘、不进病历
 * =========================================================================== */

const APP = (() => {
  'use strict';

  const CORE = RECORD_CORE;
  const K = CORE.STORAGE_KEYS;

  /** 当前正在编辑的病历 */
  let R = null;
  /** 已保存病历列表 */
  let LIST = [];
  /** 当前步骤索引 */
  let step = 0;
  let settings = { ...CORE.SETTINGS_DEFAULTS };
  /** 存储异常提示（损坏 / 写满），显示在界面顶部 */
  let storageAlert = '';

  /** 当前所有合法科室键，供 core 校验 */
  const deptKeys = () => SCHEMA.DEPARTMENTS.map(d => d.key);

  /**
   * 步骤清单。
   *
   * 「评分自查」放在「摘要与诊断」之后、「生成病历」之前：
   * 自查看的正是病历里已经写下的文字，只有写到摘要与诊断这一步才具备条件；
   * 而生成/导出是最后一环，自查必须在交卷前完成，不能排在导出之后。
   */
  const STEPS = [
    { key: 'basic', name: '基本情况', icon: '①' },
    { key: 'hpi', name: '现病史', icon: '②' },
    { key: 'ros', name: '系统回顾', icon: '③' },
    { key: 'pmh', name: '既往史', icon: '④' },
    { key: 'personal', name: '个人史', icon: '⑤' },
    { key: 'marriage', name: '婚姻与生育史', icon: '⑥' },
    { key: 'family', name: '家庭史', icon: '⑦' },
    { key: 'pe', name: '体格检查', icon: '⑧' },
    { key: 'aux', name: '实验室检查', icon: '⑨' },
    { key: 'summary', name: '摘要与诊断', icon: '⑩' },
    { key: 'check', name: '评分自查', icon: '⑪' },
    { key: 'output', name: '生成病历', icon: '✓' }
  ];

  /* ========================= 存储（委托给 core） ========================= */

  function loadList() {
    const res = CORE.loadList(localStorage);
    LIST = res.list;
    if (!res.ok && res.corrupt) {
      // 关键：损坏时不覆盖原存档，提示用户先导出/备份
      storageAlert = '本地病历列表读取失败，已保留原始数据未做修改。请勿在此状态下继续保存，建议联系技术支持或导出手工备份。';
    }
    return res;
  }

  function saveList() {
    const ok = CORE.safeSet(localStorage, K.list, JSON.stringify(LIST));
    if (!ok) {
      // 保存失败必须让用户看见，不能假装已保存
      storageAlert = '保存失败：浏览器存储空间可能已满。请先导出病历，再删除不需要的记录。';
      return false;
    }
    return true;
  }

  function saveCurrent() {
    if (!R) return false;
    const ok = CORE.safeSet(localStorage, K.current, JSON.stringify(R));
    if (!ok) storageAlert = '当前病历自动保存失败，存储空间可能已满。';
    return ok;
  }

  function loadCurrent() {
    const res = CORE.loadCurrent(localStorage, SCHEMA.emptyRecord, deptKeys());
    if (res.ok && res.record) { R = res.record; return true; }
    if (!res.ok) {
      storageAlert = '正在编辑的病历无法读取（' + (res.reason || '存档损坏') + '），已为你新建空白病历，原数据保留未动。';
    }
    return false;
  }

  function loadSettings() {
    const raw = CORE.safeGetJSON(localStorage, K.settings);
    settings = CORE.normalizeSettings(raw);
    applyFontScale();
  }

  function saveSettings() {
    CORE.safeSet(localStorage, K.settings, JSON.stringify(settings));
    applyFontScale();
  }

  function applyFontScale() {
    document.documentElement.style.setProperty('--fs-scale', String(settings.fontScale || 1));
  }

  /** 把 defaults 中缺失的键补进 obj（保留 obj 已有值）—— 由 core 提供 */
  const deepMerge = CORE.deepMerge;

  /* ========================= 工具 ========================= */

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  const uid = CORE.uid;

  /** 给对象设置嵌套路径的值，如 setPath(R,'pe.vitals.temperature','37') */
  function setPath(obj, path, value) {
    const parts = path.split('.');
    let cur = obj;
    for (let i = 0; i < parts.length - 1; i++) {
      if (cur[parts[i]] === undefined || cur[parts[i]] === null) cur[parts[i]] = {};
      cur = cur[parts[i]];
    }
    cur[parts[parts.length - 1]] = value;
  }

  function getPath(obj, path) {
    return path.split('.').reduce((o, k) => (o === undefined || o === null ? undefined : o[k]), obj);
  }

  /* ========================= 通用控件 ========================= */

  /** 文本输入 */
  function input(label, path, opts = {}) {
    const val = getPath(R, path) || '';
    const type = opts.type || 'text';
    const ph = opts.placeholder ? ` placeholder="${esc(opts.placeholder)}"` : '';
    const hint = opts.hint ? `<div class="hint">${esc(opts.hint)}</div>` : '';
    return `<label class="field">
      <span class="field-label">${esc(label)}</span>
      <input type="${type}" data-path="${path}" value="${esc(val)}"${ph}
        ${opts.inputmode ? `inputmode="${opts.inputmode}"` : ''}>
      ${hint}
    </label>`;
  }

  /** 多行文本 */
  function textarea(label, path, opts = {}) {
    const val = getPath(R, path) || '';
    const rows = opts.rows || 3;
    const ph = opts.placeholder ? ` placeholder="${esc(opts.placeholder)}"` : '';
    const hint = opts.hint ? `<div class="hint">${esc(opts.hint)}</div>` : '';
    return `<label class="field">
      <span class="field-label">${esc(label)}</span>
      <textarea rows="${rows}" data-path="${path}"${ph}>${esc(val)}</textarea>
      ${hint}
    </label>`;
  }

  /** 单选 segmented */
  function seg(label, path, options, opts = {}) {
    const cur = getPath(R, path);
    const btns = options.map(o => {
      const v = typeof o === 'string' ? o : o.value;
      const t = typeof o === 'string' ? o : o.text;
      const on = String(cur) === String(v) ? ' on' : '';
      return `<button type="button" class="seg-btn${on}" data-seg="${path}" data-val="${esc(v)}">${esc(t)}</button>`;
    }).join('');
    return `<div class="field">
      <span class="field-label">${esc(label)}</span>
      <div class="seg">${btns}</div>
      ${opts.hint ? `<div class="hint">${esc(opts.hint)}</div>` : ''}
    </div>`;
  }

  /** 单选下拉，支持 optgroup 分组 */
  function select(label, path, options, opts = {}) {
    const cur = getPath(R, path) || '';
    const isGrouped = options.length && options[0] && options[0].items;

    let optsHtml;
    if (isGrouped) {
      optsHtml = options.map(g => `<optgroup label="${esc(g.label)}">` +
        g.items.map(o => `<option value="${esc(o.value)}"${String(cur) === String(o.value) ? ' selected' : ''}>${esc(o.text)}</option>`).join('') +
        '</optgroup>').join('');
    } else {
      optsHtml = options.map(o => {
        const v = typeof o === 'string' ? o : o.value;
        const t = typeof o === 'string' ? o : o.text;
        return `<option value="${esc(v)}"${String(cur) === String(v) ? ' selected' : ''}>${esc(t)}</option>`;
      }).join('');
    }

    return `<label class="field">
      <span class="field-label">${esc(label)}</span>
      <select data-path="${path}">
        ${opts.empty ? `<option value="">${esc(opts.empty)}</option>` : ''}
        ${optsHtml}
      </select>
      ${opts.hint ? `<div class="hint">${esc(opts.hint)}</div>` : ''}
    </label>`;
  }

  /** 科室分组选项 */
  function deptGroups() {
    const groups = [];
    SCHEMA.DEPARTMENTS.forEach(d => {
      let g = groups.find(x => x.label === d.group);
      if (!g) { g = { label: d.group, items: [] }; groups.push(g); }
      g.items.push({ value: d.key, text: d.name });
    });
    return groups;
  }

  /** 复选框组（多选），path 指向对象，如 pmh.diseaseChecks */
  function checks(label, path, options, opts = {}) {
    const obj = getPath(R, path) || {};
    const btns = options.map(o => {
      const v = typeof o === 'string' ? o : o.value;
      const t = typeof o === 'string' ? o : o.text;
      const on = obj[v] ? ' on' : '';
      return `<button type="button" class="chip${on}" data-check="${path}" data-val="${esc(v)}">${esc(t)}</button>`;
    }).join('');
    return `<div class="field">
      <span class="field-label">${esc(label)}</span>
      <div class="chips">${btns}</div>
    </div>`;
  }

  /* ========================= 各步骤渲染 ========================= */

  function renderBasic() {
    const b = R.basic;
    return `
      <div class="card">
        <div class="card-title">科室</div>
        ${select('本次见习科室', 'basic.department', deptGroups(), {
          hint: '选择科室后，体格检查会自动追加该科室的专科查体项目。'
        })}
      </div>

      <div class="card">
        <div class="card-title">一般项目</div>
        ${input('姓名', 'basic.name', { placeholder: '如：张三' })}
        ${seg('性别', 'basic.gender', SCHEMA.GENDERS)}
        ${input('年龄', 'basic.age', {
          placeholder: '58 或 7月 / 3天',
          hint: '成人直接写数字（自动补「岁」）；婴儿写「7月」「3天」这类，不要再加「岁」。'
        })}
        ${input('民族', 'basic.nationality', { placeholder: '汉族' })}
        ${seg('婚姻', 'basic.marital', SCHEMA.MARITAL)}
        ${input('职业', 'basic.occupation', { placeholder: '退休 / 农民 / 工人…' })}
        ${input('工作单位', 'basic.workUnit', { placeholder: '无 / ××公司' })}
        ${input('籍贯', 'basic.nativePlace', { placeholder: '浙江温州' })}
        ${input('出生地', 'basic.birthPlace', { placeholder: '浙江温州' })}
        ${input('通讯地址', 'basic.address', {
          placeholder: '如：浙江省温州市鹿城区××路××号',
          hint: '一般项目里的通讯地址；留空则病历里不出现这一项。'
        })}
        ${input('电话号码', 'basic.phone', { placeholder: '138××××××××' })}
        ${input('病历号 / 住院号', 'basic.recordNo', {
          placeholder: '如：01234567',
          hint: '出院记录的一般情况也会用到。'
        })}
        ${input('入院日期', 'basic.admitDate', { type: 'date' })}
        ${input('记录日期', 'basic.recordDate', { type: 'date' })}
        ${input('病史陈述者', 'basic.informant', { placeholder: '留空则默认患者本人；儿科写「母亲」' })}
        ${select('病史可靠程度', 'basic.reliability', SCHEMA.RELIABILITY)}
      </div>

      <div class="card">
        <div class="card-title">主诉 <span class="tag-req">必填</span></div>
        ${textarea('主诉症状', 'basic.chiefComplaint', {
          rows: 2,
          placeholder: '如：发热、咳嗽、咳痰',
          hint: '只写症状和体征，不写诊断；一般不超过20字。'
        })}
        <div class="row2">
          ${input('持续时间', 'basic.chiefComplaintDuration', { placeholder: '3' })}
          ${select('单位', 'basic.chiefComplaintDurationUnit', SCHEMA.DURATION_UNITS)}
        </div>
        <div class="live-preview" id="ccPreview"></div>
      </div>
    `;
  }

  function renderHpi() {
    const h = R.hpi;
    return `
      <div class="card">
        <div class="card-title">现病史
          <button class="btn-mini" data-act="draftHpi">一键生成初稿</button>
        </div>
        <div class="hint">按提示分句填写，生成的现病史会自动加句号并补主语"患者"。</div>

        ${textarea('起病情况（何时、何种方式起病、有无诱因）', 'hpi.onset', {
          rows: 3,
          placeholder: '如：3天前受凉后出现发热，体温最高39.2℃，伴畏寒'
        })}
        ${input('发病诱因', 'hpi.cause', {
          placeholder: '如：受凉后 / 进食油腻食物后 / 无明显诱因',
          hint: '评分表第2页「诱因」2 分。只写短语即可，生成时会补成完整分句；与起病描述写重时自动去重。'
        })}
        ${textarea('主要症状特点（部位、性质、程度、持续时间、加重缓解因素）', 'hpi.symptoms', {
          rows: 3,
          placeholder: '如：咳嗽呈阵发性连声咳，咳黄色黏痰，量中等，不易咳出'
        })}
        ${textarea('缓解因素（什么情况下症状减轻）', 'hpi.relief', {
          rows: 2,
          placeholder: '如：休息后腹痛可稍缓解 / 服布洛芬后体温下降',
          hint: '评分表第6页入院记录「现病史」把缓解因素单列为 1 分；与伴随症状写重时会自动去重。'
        })}
        ${textarea('病情进展（症状如何变化）', 'hpi.evolution', {
          rows: 2,
          placeholder: '如：症状逐渐加重，夜间咳嗽明显，影响睡眠'
        })}
        ${textarea('伴随症状（有则写，无则写"无…"）', 'hpi.accompanying', {
          rows: 2,
          placeholder: '如：伴右侧胸痛，咳嗽及深呼吸时加重；无咯血、盗汗'
        })}
        ${textarea('有鉴别诊断意义的阴性病史', 'hpi.negativeDiscriminating', {
          rows: 2,
          placeholder: '如：无咯血、盗汗、消瘦，无夜间阵发性呼吸困难',
          hint: '评分表第2页「伴随症状和阴性鉴别症状」5 分、第6页现病史单列 1 分。写「无…」形式，越具体越能体现问诊思路。'
        })}
        ${textarea('诊治经过（在何处就诊、检查、用药及效果）', 'hpi.treatment', {
          rows: 3,
          placeholder: '如：自服布洛芬后体温可暂时下降，未到医院就诊'
        })}
        ${textarea('一般情况（精神、食欲、睡眠、大小便、体重）', 'hpi.generalCondition', {
          rows: 2,
          placeholder: '留空则默认：发病以来，精神、食欲、睡眠可，大小便正常，体重无明显变化'
        })}
        ${textarea('其他补充', 'hpi.extra', { rows: 2 })}
      </div>
    `;
  }

  function renderRos() {
    const totalPos = SCHEMA.ROS.reduce((n, sys) => {
      const store = R.ros[sys.key] || {};
      return n + sys.symptoms.filter(s => (store[s.key] || {}).checked).length;
    }, 0);

    let html = `
      <div class="card sticky-note">
        <div class="ros-head">
          <div>
            <strong>系统回顾</strong>
            <div class="hint">默认全部为阴性；有症状的点一下变红，即记为阳性。</div>
          </div>
          <div class="ros-count">已选阳性 <b>${totalPos}</b> 项</div>
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" data-act="rosAllNegative">全部标记为阴性</button>

            return `<button class="jump-btn${n ? ' has-pos' : ''}" data-jump="${sys.key}">
              ${esc(sys.name.replace('及其器官', ''))}${n ? `<b>${n}</b>` : ''}

          }).join('')}

    `;

      const chips = sys.symptoms.map(sym => {

  /**
   * 重点查体（评分表第 4 页 15 分）。
   *
   * 「会不会挑重点」是这一项考的东西：从已填的查体项里挑 3 项左右与主诉/主要
   * 阳性体征直接相关的，再写一句为什么查这些。keys 存 '组.key' 引用，
   * 由 generator.buildFocusPE 解析成「组名：项目名 + 描述」。
   */
  function renderFocusPE(deptKey, dept) {
    const f = (R.focusPE && typeof R.focusPE === 'object') ? R.focusPE : {};
    const keys = Array.isArray(f.keys) ? f.keys : [];
    const options = [];
    SCHEMA.PE_COMMON.forEach(g => {
      const items = (g.items || []).filter(it => !it.depts || it.depts.includes(deptKey));
      items.forEach(it => options.push({ ref: `${g.key}.${it.key}`, label: `${g.name} · ${it.label}` }));
    });
    (dept.special || []).forEach(spKey => {
      const sp = SCHEMA.PE_SPECIAL[spKey];
      if (!sp) return;
      (sp.items || []).forEach(it => options.push({ ref: `special_${spKey}.${it.key}`, label: `${sp.name} · ${it.label}` }));
    });

    const picked = keys.map(ref => {
      const o = options.find(x => x.ref === ref);
      return `<span class="focus-tag">${esc(o ? o.label : ref)}
        <button type="button" class="focus-x" data-focusdel="${esc(ref)}">×</button></span>`;
    }).join('');
    const rest = options.filter(o => !keys.includes(o.ref));

    return `
      <details class="card pe-group" id="pe-focus" ${keys.length || f.note ? 'open' : ''}>
        <summary>重点查体<span class="tag-score">第4页 · 15分</span></summary>
        <div class="pe-body">
          <div class="hint">挑出与主诉、主要阳性体征直接相关的 3 项左右，再补一句为什么查这些——这一项看的是「会不会挑重点」，不是查得越多越好。</div>
          <div class="focus-picked">${picked || '<span class="muted">还没有标记重点查体部位</span>'}</div>
          ${rest.length ? `
          <details class="mini-details" style="margin-top:8px">
            <summary>从查体项中添加（已标记 ${keys.length} 项）</summary>
            <div class="chips focus-chips">
              ${rest.map(o => `<button type="button" class="chip small" data-focusadd="${esc(o.ref)}">${esc(o.label)}</button>`).join('')}
            </div>
          </details>` : ''}
          ${textarea('为什么查这些（与诊断思路 / 鉴别关键点的关系）', 'focusPE.note', {
            rows: 2,
            placeholder: '如：患者以发热咳嗽为主诉，重点查双肺听诊有无啰音、有无胸腔积液征象，以判断是否合并肺炎旁积液'
          })}
        </div>
      </details>
    `;
  }

        <span class="diag-no">${i + 1}.</span>
