plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    namespace 'com.xjb.bingli'
    compileSdk 35
    defaultConfig {
        applicationId 'com.xjb.bingli'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        versionCode = (project.findProperty('versionCode') ?: '320000').toInteger()
        versionName = (project.findProperty('versionName') ?: '3.2.0')
        buildConfigField 'String', 'UPDATE_REPOSITORY', '"xjb1337/bingli"'
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { if (System.getenv('BINGLI_SIGNED_TEST') == '1') signingConfig signingConfigs.release }
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
tasks.register('buildWeb', Exec) { workingDir '../..'; commandLine 'node', 'build.js' }
// Package the internal HTML asset; no standalone website is published.
tasks.named('preBuild').configure { dependsOn 'buildWeb' }
