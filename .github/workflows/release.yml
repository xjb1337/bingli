name: Release APK

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to confirm a manual production release'
        required: true
        type: string
      notes:
        description: 'Optional release notes appended to the GitHub Release and update.json'
        required: false
        type: string
      version_name:
        description: 'Optional versionName override (e.g. 3.1). Empty keeps 3.0.0.<run>'
        required: false
        type: string
        default: ''
      version_code:
        description: 'Optional versionCode override (integer). Empty keeps 300000+run'
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Require explicit release confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$CONFIRM" = "RELEASE" || {
            echo "发布未确认：请将 confirm 输入设为 RELEASE。"
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run verify
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace

  release:
    name: Build signed release and publish
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Require explicit release confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$CONFIRM" = "RELEASE" || {
            echo "发布未确认：请将 confirm 输入设为 RELEASE。"
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify commit is current main head
        run: |
          git fetch --no-tags origin main
          MAIN_SHA=$(git rev-parse origin/main)
          test "$MAIN_SHA" = "$GITHUB_SHA" || { echo "候选提交 $GITHUB_SHA 已不是 main 当前头 $MAIN_SHA，拒绝发布"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 未配置"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD 未配置"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS 未配置"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD 未配置"; exit 1; }
          test -n "$EXPECTED_CERT" || { echo "ANDROID_EXPECTED_CERT_SHA256 未配置"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          printf 'ANDROID_KEYSTORE_FILE=%s\n' "$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build versioned release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
          VERSION_NAME_INPUT: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          BASE_VERSION_CODE=300000
          if [ -n "${VERSION_CODE_INPUT}" ]; then
            VERSION_CODE="${VERSION_CODE_INPUT}"
          else
            VERSION_CODE=$((BASE_VERSION_CODE + GITHUB_RUN_NUMBER))
          fi
          case "$VERSION_CODE" in
            ''|*[!0-9]*) echo "versionCode 必须是正整数，收到: $VERSION_CODE"; exit 1 ;;
          esac
          if [ "$VERSION_CODE" -gt 2100000000 ]; then echo "versionCode 超出 Android 整数范围"; exit 1; fi
          if [ -n "${VERSION_NAME_INPUT}" ]; then
            VERSION_NAME="${VERSION_NAME_INPUT}"
          else
            VERSION_NAME="3.0.0.${GITHUB_RUN_NUMBER}"
          fi
          ./android/gradlew -p android assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" --stacktrace
          printf 'VERSION_CODE=%s\n' "$VERSION_CODE" >> "$GITHUB_ENV"
          printf 'VERSION_NAME=%s\n' "$VERSION_NAME" >> "$GITHUB_ENV"
      - name: Verify APK applicationId
        env:
          APK_PATH: android/app/build/outputs/apk/release/app-release.apk
          EXPECTED_APPLICATION_ID: com.xjb.bingli
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2=$(command -v aapt2 || true)
          if [ -z "$AAPT2" ] && [ -d "$SDK_ROOT/build-tools" ]; then
            AAPT2=$(find "$SDK_ROOT/build-tools" -type f \( -name aapt2 -o -name aapt2.exe \) | sort -V | tail -1)
          fi
          test -n "$AAPT2" || { echo "aapt2 未找到，无法校验 APK 包名"; exit 1; }
          export PATH="$(dirname "$AAPT2"):$PATH"
          # aapt2 dump badging 首行形如 package: name='com.xjb.bingli' ...
          BADGING=$(aapt2 dump badging "$APK_PATH")
          PACKAGE_NAME=$(printf '%s\n' "$BADGING" | sed -n "1s/^package: name='\([^']*\)'.*/\1/p")
          test -n "$PACKAGE_NAME" || { echo "无法读取 APK 包名"; exit 1; }
          test "$PACKAGE_NAME" = "$EXPECTED_APPLICATION_ID" || { echo "APK 包名不匹配：$PACKAGE_NAME"; exit 1; }
          echo "APK 包名校验通过：$PACKAGE_NAME"
      - name: Generate update metadata
        env:
          APK_PATH: android/app/build/outputs/apk/release/app-release.apk
          EXPECTED_CERT: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
          EXPECTED_APPLICATION_ID: com.xjb.bingli
          EXPECTED_MIN_SDK: '26'
          EXPECTED_VERSION_CODE: ${{ env.VERSION_CODE }}
          EXPECTED_VERSION_NAME: ${{ env.VERSION_NAME }}
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_NOTES_INPUT: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/bingli.apk
          NOTES="版本 ${VERSION_NAME}（build ${VERSION_CODE}）"
          if [ -n "$RELEASE_NOTES_INPUT" ]; then
            NOTES=$(printf '%s\n\n%s' "$NOTES" "$RELEASE_NOTES_INPUT")
          fi
          printf '%s\n' "$NOTES" > dist/release-notes.txt
          RELEASE_NOTES="$NOTES" bash scripts/release/generate-update-json.sh
          cat dist/update.json
          test -f android/app/build/outputs/mapping/release/mapping.txt && cp android/app/build/outputs/mapping/release/mapping.txt dist/mapping.txt || true
      - name: Verify signing certificate
        env:
          EXPECTED_CERT: ${{ secrets.ANDROID_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(command -v apksigner || true)
          if [ -z "$APKSIGNER" ] && [ -d "$SDK_ROOT/build-tools" ]; then
            APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)
          fi
          test -n "$APKSIGNER" || { echo "apksigner 未找到"; exit 1; }
          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs-pem "$APK")
          SIGNER=$(printf '%s\n' "$CERT_OUTPUT" | python3 scripts/release/certificate-sha256.py)
          test -n "$SIGNER" || { echo "无法读取 APK 签名证书"; exit 1; }
          test "$SIGNER" = "$(printf '%s' "$EXPECTED_CERT" | tr '[:upper:]' '[:lower:]')" || { echo "APK 签名证书与固定证书不一致"; exit 1; }
      - name: Check release is newer than latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          set -euo pipefail
          CANDIDATE_TAG="v${VERSION_NAME}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"
          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT
          HTTP=$(curl -sS -o "$TMP_DIR/latest.json" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/latest")
          if [ "$HTTP" = "404" ]; then
            echo "尚无已发布 Release，允许首次发布"
          elif [ "$HTTP" != "200" ]; then
            echo "读取最新 Release 失败（HTTP $HTTP）"; exit 1
          else
            LATEST_TAG=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tag_name"])' "$TMP_DIR/latest.json")
            EXISTING_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$CANDIDATE_TAG" | awk 'NR==1{print $1}')
            gh release download "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" --pattern update.json --dir "$TMP_DIR" --clobber
            python3 scripts/release/check-release.py \
              --latest "$TMP_DIR/update.json" \
              --candidate-version-code "$VERSION_CODE" \
              --candidate-tag "$CANDIDATE_TAG" \
              --latest-tag "$LATEST_TAG" \
              --candidate-sha "$GITHUB_SHA" \
              --existing-tag-sha "$EXISTING_TAG_SHA"
          fi
      - name: Recheck main head and tag before publish
        run: |
          set -euo pipefail
          CANDIDATE_TAG="v${VERSION_NAME}"
          git fetch --no-tags origin main
          MAIN_SHA=$(git rev-parse origin/main)
          test "$MAIN_SHA" = "$GITHUB_SHA" || { echo "准备发布期间 main 已前进：候选 $GITHUB_SHA，当前 $MAIN_SHA"; exit 1; }
          EXISTING_TAG_SHA=$(git ls-remote --tags origin "refs/tags/$CANDIDATE_TAG" | awk 'NR==1{print $1}')
          if [ -n "$EXISTING_TAG_SHA" ]; then
            echo "候选 tag 已存在，拒绝复用：$CANDIDATE_TAG"
            exit 1
          fi
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}"
          NOTES_FILE=dist/release-notes.txt
          test -f "$NOTES_FILE" || { echo "发布说明文件缺失"; exit 1; }
          ASSETS=(dist/update.json dist/bingli.apk)
          test -f dist/mapping.txt && ASSETS+=(dist/mapping.txt)
          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES_FILE" --draft
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
