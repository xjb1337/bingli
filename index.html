   * 这是给「自查」用的**保守**启发式，只在明显跑题时返回结果——它宁可漏报，
   * 也不能把临床合理的鉴别误判成无关（假阳性会让用户不敢用这个提示）。
   * 判为相关的三条途径：
   *   ① 鉴别病名与任一诊断名有 ≥2 字的公共片段（急性胆囊炎 / 急性阑尾炎）；
   *   ② 鉴别病名本身就是诊断参考提示里的候选疾病（47 条规则覆盖了内科常见鉴别）；
   *   ③ 鉴别病名直接出现在主诉或现病史里（如以「咯血」为主诉时的肺结核）。
   * 三条都不满足才算「关联不明确」，且只用于质控提醒，绝不写进病历正文。
   */
  function diffRelatedToDiagnosis(r) {
    const dx = diagnosisList(r);
    const diffs = (((r.soap || {}).a || {}).diff) || [];
    if (!Array.isArray(diffs) || !diffs.length) return { total: 0, unrelated: [] };

    const joined = dx.join('|');
    const narrative = [
      stripTail((r.basic || {}).chiefComplaint),
      stripTail((r.hpi || {}).symptoms),
      stripTail((r.hpi || {}).accompanying),
      stripTail((r.hpi || {}).evolution)
    ].join('|');
    // 诊断提示规则里的候选病名（hints.js 在浏览器里晚于 generator 加载，
    // 所以这里用运行时的 typeof 判断，拿不到就退化为前两条途径）
    const ruleNames = (typeof globalThis !== 'undefined' &&
      globalThis.HINTS && Array.isArray(globalThis.HINTS.RULES))
      ? globalThis.HINTS.RULES.map(x => String(x.name || ''))
      : [];

    const sharesFragment = (name, pool) => {
      if (!pool) return false;
      for (let i = 0; i + 2 <= name.length; i++) {
        if (pool.includes(name.slice(i, i + 2))) return true;
      }
      return false;
    };

    const unrelated = diffs
      .filter(d => d && stripTail(d.diagnosis))
      .filter(d => {
        const name = stripTail(d.diagnosis);
        if (sharesFragment(name, joined)) return false;           // ①
        if (ruleNames.some(rn => rn && rn.includes(name))) return false; // ②
        if (narrative && narrative.includes(name)) return false;  // ③
        return true;
      })
      .map(d => stripTail(d.diagnosis));
    return { total: diffs.length, unrelated };
  }

  /**
   * 首次病程录的「自查提醒」——只给界面提示，**不进入病历正文**。
   *
   * 之所以单独成函数：buildFirstCourseRecord 的返回值会被用户整段复制进
   * 病历系统，任何「请确认是否保留」之类的话混进去都会变成病历的一部分。
   *
   * @returns {string[]} 需要提醒用户的事项，没有则返回空数组
   */
  function firstCourseSelfCheck(r) {
    const out = [];
    const a = (((r.soap || {}).a) || {});
    if (!stripTail(a.diffNote)) {
      const check = diffRelatedToDiagnosis(r);
      if (check.unrelated.length) {
        out.push(`${check.unrelated.join('、')} 与现有诊断的关联不明确，`
          + '请确认是否保留（评分表对「与诊断无关的鉴别诊断」扣 5 分）。');
      }
    }
    return out;
  }

  /**
   * 生成首次病程录。
   *
   * @param {object} r record
   * @param {object} [opts] { date: 'YYYY-MM-DD HH:mm' } 只用于标题时间，不填则不写时间
   * @returns {string} 含「病历特点」「诊断依据」「鉴别诊断」「诊疗计划」四个小标题的纯文本
   */
  function buildFirstCourseRecord(r, opts = {}) {
    const rec = r || {};
    const soap = rec.soap || {};
    const s = soap.s || {};
    const o = soap.o || {};
    const a = soap.a || {};
    const p = soap.p || {};

    const lines = [];
    const stamp = stripTail(opts.date);
    lines.push(stamp ? `【首次病程录】${stamp}` : '【首次病程录】');

    /* ---------- 一、病历特点（S） ---------- */
    lines.push('一、病历特点（S）');
    const summary = stripTail(s.summary) || draftCaseSummary(rec);
    lines.push(ensureSentence(summary) || '（待补充：请概括现病史要点）');
    // 「与病史采集一致」这一项不写额外事实，只做一句自检说明
    const consistency = stripTail(s.consistency);
    if (consistency) lines.push(ensureSentence(consistency));

    /* ---------- 二、客观体检记录/检查结果（O） ---------- */
    lines.push('二、客观记录（O）');
    const peText = deLabel(o.pe || draftObjectivePE(rec), ['查体', '体格检查']);
    const auxText = deLabel(o.aux || draftObjectiveAux(rec), ['辅助检查', '检查']);
    lines.push(`1. 体格检查：${ensureSentence(peText)}`);
    lines.push(`2. 辅助检查：${ensureSentence(auxText)}`);

    /* ---------- 三、诊断依据（A） ---------- */
    lines.push('三、诊断依据（A）');
    const basis = stripTail(a.basis);
    if (basis) lines.push(ensureSentence(basis));
    const details = draftBasisDetail(rec);
    if (details.length) {
      details.forEach(d => {
        const bits = [];
        if (stripTail(d.history)) bits.push(`①病史：${stripTail(d.history)}`);
        if (stripTail(d.pe)) bits.push(`②体检：${stripTail(d.pe)}`);
        if (stripTail(d.aux)) bits.push(`③辅助检查：${stripTail(d.aux)}`);
        const body = bits.length ? bits.join('；') : '（待补充病史、体检、辅助检查三方面依据）';
        lines.push(`· ${stripTail(d.diagnosis)}：${ensureSentence(body)}`);
      });
    } else {
      lines.push('· （待补充初步诊断，再逐条列出诊断依据）');
    }
    const ranking = stripTail(a.ranking);
    if (ranking) lines.push(`主次：${ensureSentence(ranking)}`);

    /* ---------- 四、鉴别诊断（A） ---------- */
    lines.push('四、鉴别诊断（A）');
    const diffs = Array.isArray(a.diff) ? a.diff.filter(d => d && stripTail(d.diagnosis)) : [];
    if (diffs.length) {
      diffs.forEach(d => {
        const bits = [];
        if (stripTail(d.why)) bits.push(`支持点：${stripTail(d.why)}`);
        if (stripTail(d.against)) bits.push(`不支持点：${stripTail(d.against)}`);
        if (stripTail(d.points)) bits.push(`鉴别要点：${stripTail(d.points)}`);
        const tail = bits.length ? '：' + bits.join('；') : '';
        lines.push(`· 需与${stripTail(d.diagnosis)}鉴别${ensureSentence(tail)}`);
      });
    } else {
      // 没填鉴别诊断时用 HINTS 的「该鉴别什么」作提示，绝不自动写进病历正文
      lines.push('· （待补充：结合主要诊断展开鉴别，可参考诊断参考提示中的候选疾病）');
    }
    const diffNote = stripTail(a.diffNote);
    if (diffNote) {
      lines.push(ensureSentence(diffNote));
    }
    // 注意：与诊断无关的鉴别诊断属于「自查提醒」，是给考生看的话，不是病历内容。
    // 它绝不能写进本函数的返回值——用户会整段复制进病历系统。
    // 需要的界面请调用 firstCourseSelfCheck(rec) 单独取用。

    /* ---------- 五、诊疗计划（P） ---------- */
    lines.push('五、诊疗计划（P）');
    const principle = stripTail(p.principle);
    if (principle) lines.push(ensureSentence(principle));
    const plans = Array.isArray(p.perDiagnosis) ? p.perDiagnosis.filter(x => x && stripTail(x.diagnosis)) : [];
    if (plans.length) {
      plans.forEach(x => {
        const bits = [];
        if (stripTail(x.exam)) bits.push(`检查：${stripTail(x.exam)}`);
        if (stripTail(x.treatment)) bits.push(`治疗：${stripTail(x.treatment)}`);
        const body = bits.length ? bits.join('；') : '（待补充具体检查与治疗措施）';
        lines.push(`· ${stripTail(x.diagnosis)}：${ensureSentence(body)}`);
      });
    } else {
      lines.push('· （待补充：按诊断逐条列出拟完善检查与治疗措施）');
    }
    const individual = stripTail(p.individual);
    if (individual) lines.push(`个体化：${ensureSentence(individual)}`);

    return lines.join('\n') + '\n';
  }

  /* ===================================================================
   * 出院记录（评分表第6–7页 15 分）
   *
   * 六项小标题固定：一般情况 / 入院情况 / 诊疗经过 / 出院情况 / 出院诊断 / 出院医嘱。
   * 出院医嘱拆成药物、非药物、生活指导、复诊时间四句，对应评分表括号里的四项。
   * =================================================================== */

  /** 住院天数：两个 'YYYY-MM-DD' 之差；算不出来返回 0 */
  function hospitalDays(admitDate, dischargeDate) {
    const parse = s => {
      const m = String(s || '').match(/(\d{4})\D?(\d{1,2})\D?(\d{1,2})/);
      if (!m) return null;
      const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      return isNaN(d.getTime()) ? null : d;
    };
    const a = parse(admitDate);
    const b = parse(dischargeDate);
    if (!a || !b) return 0;
    const diff = Math.round((b - a) / 86400000);
    return diff > 0 ? diff : 0;
  }

  /**
   * 生成出院记录。
   * @param {object} r record
   * @returns {string} 含六项小标题的纯文本
   */
  function buildDischargeRecord(r) {
    const rec = r || {};
    const b = rec.basic || {};
    const d = rec.discharge || {};
    const advice = d.advice || {};
    const lines = [];
    lines.push('【出院记录】');

    /* ---------- 一般情况 ---------- */
    const general = [];
    if (stripTail(b.name)) general.push(`姓名：${stripTail(b.name)}`);
    if (stripTail(b.gender)) general.push(`性别：${stripTail(b.gender)}`);
    if (ageWithUnit(b)) general.push(`年龄：${ageWithUnit(b)}`);
    if (stripTail(b.recordNo)) general.push(`病历号：${stripTail(b.recordNo)}`);
    if (stripTail(b.admitDate)) general.push(`入院日期：${stripTail(b.admitDate)}`);
    const disDate = stripTail(d.dischargeDate);
    if (disDate) general.push(`出院日期：${disDate}`);
    const days = hospitalDays(b.admitDate, d.dischargeDate);
    if (days) general.push(`住院天数：${days}天`);
    lines.push('一、一般情况');
    lines.push(general.length ? joinSentences([general.join('，')]) : '（待补充姓名、性别、年龄、入院及出院日期）');

    /* ---------- 入院情况 ---------- */
    lines.push('二、入院情况');
    const admit = stripTail(d.admitCondition) || (() => {
      // 自动草稿：主诉 + 主要阳性体征 + 入院诊断（只写入院当时的状态）
      const seg = [];
      const cc = stripTail(buildChiefComplaint(rec));
      if (cc) seg.push(`因“${cc}”入院`);
      const abn = abnormalPE(rec);
      if (abn.length) seg.push(`入院查体${abn.slice(0, 3).map(a => a.text).join('，')}`);
      const dx = diagnosisList(rec);
      if (dx.length) seg.push(`入院诊断：${dx.join('、')}`);
      return seg.length ? joinSentences(seg) : '';
    })();
    lines.push(admit ? ensureSentence(admit) : '（待补充：入院时主要症状、体征与入院诊断）');

    /* ---------- 诊疗经过 ---------- */
    lines.push('三、诊疗经过');
    lines.push(d.course ? ensureSentence(d.course) : '（待补充：住院期间病情变化、检查结果、治疗经过及效果）');

    /* ---------- 出院情况 ---------- */
    lines.push('四、出院情况');
    lines.push(d.dischargeStatus ? ensureSentence(d.dischargeStatus) : '（待补充：出院时主要症状、体征、辅助检查结果）');

    /* ---------- 出院诊断 ---------- */
    lines.push('五、出院诊断');
    const outDx = (Array.isArray(d.diagnoses) ? d.diagnoses : [])
      .map(s => stripTail(s)).filter(Boolean);
    const dxList = outDx.length ? outDx : diagnosisList(rec);
    lines.push(dxList.length
      ? dxList.map((s, i) => `${i + 1}. ${s}`).join('\n')
      : '（待补充出院诊断）');

    /* ---------- 出院医嘱 ---------- */
    lines.push('六、出院医嘱');
    const orders = [];
    if (stripTail(advice.drug)) orders.push(`药物治疗：${stripTail(advice.drug)}`);
    if (stripTail(advice.nonDrug)) orders.push(`非药物治疗：${stripTail(advice.nonDrug)}`);
    if (stripTail(advice.lifestyle)) orders.push(`生活指导：${stripTail(advice.lifestyle)}`);
    if (stripTail(advice.followUp)) orders.push(`复诊时间：${stripTail(advice.followUp)}`);
    lines.push(orders.length ? joinSentences(orders) : '（待补充：药物、非药物治疗、生活指导、复诊时间）');

    return lines.join('\n') + '\n';
  }

  /* ---------------------------- 组装全文 ---------------------------- */

  const SECTION_ORDER = [
    '一般项目', '主诉', '现病史', '既往史', '系统回顾', '个人史',
    '婚姻史', '月经与生育史', '家庭史', '体格检查', '实验室检查',
    '摘要', '诊断依据', '初步诊断'
  ];

  /**
   * 诊断依据：把每条诊断的病史/体检/辅助检查三方面依据逐条列出。
   * 这是模板里的独立一节（位于摘要之后、初步诊断之前）。
   */
  function buildBasisSection(r) {
    const items = draftBasisDetail(r);
    if (!items.length) return '待补充：先填写初步诊断，再逐条列出诊断依据。';
    const lines = [];
    items.forEach((it, i) => {
      const parts = [];
      if (stripTail(it.history)) parts.push(`病史：${stripTail(it.history)}`);
      if (stripTail(it.pe)) parts.push(`体格检查：${stripTail(it.pe)}`);
      if (stripTail(it.aux)) parts.push(`辅助检查：${stripTail(it.aux)}`);
      const body = parts.length ? parts.join('；') : '（待补充病史、体检、辅助检查三方面依据）';
      lines.push(`${i + 1}. ${stripTail(it.diagnosis)}：${body}`);
    });
    return lines.join('\n');
  }

  /**
   * 生成大病历全文
   *
   * ⚠️ 本轮改动（缺陷2第2、3条）：旧实现是 `if (!body) return;`——某一节生成结果为空，
   * 连【节标题】带内容整节蒸发。学生看不出「本来就没有这一节」还是「漏印了」，
   * 反映到带教老师那边就是一份缺项的入院记录。
   * 《诊断学》第10版：「所有表格项都应详细填写，无内容者画"/"或"—"」。
   *
   * 现在 14 节标题恒在，正文为空时写占位符「／」。
   * 这样既满足「不可空缺」，也让用户一眼看到自己还有哪几节没填。
   *
   * 注意：sections 里存的也是占位符而非空串，所以 app.js 的「复制某节」
   * 列表（GENERATOR.SECTION_ORDER.filter(n => res.sections[n])）会列出全部 14 节，
   * 与正文保持一致，不会出现"正文有、复制列表里没有"的错位。
   *
   * @param {object} r record
   * @param {object} opts { rosMode: 'detail'|'brief' }
   */
  function generate(r, opts = {}) {
    const rosMode = opts.rosMode || 'detail';
    const sections = {};
    sections['一般项目'] = buildBasicInfo(r);
    sections['主诉'] = buildChiefComplaint(r);
    sections['现病史'] = buildHPI(r);
    sections['既往史'] = buildPMH(r);
    sections['系统回顾'] = buildROS(r, rosMode);
    sections['个人史'] = buildPersonal(r);
    sections['婚姻史'] = buildMarriageHistory(r);
    sections['月经与生育史'] = buildMenstruationChildbirth(r);
    sections['家庭史'] = buildFamily(r);
    sections['体格检查'] = buildPE(r);
    sections['实验室检查'] = buildAuxiliary(r);
    sections['摘要'] = buildSummary(r);
    sections['诊断依据'] = buildBasisSection(r);
    sections['初步诊断'] = buildDiagnosis(r);

    const lines = [];
    SECTION_ORDER.forEach(name => {
      // 空节不再整节消失：标题照出，正文补「／」占位。
      const body = sections[name] || PH;
      sections[name] = body;
      lines.push(`【${name}】`);
      lines.push(body);
      lines.push('');
    });
    return { text: lines.join('\n').trim() + '\n', sections, warnings: validate(r) };
  }

  /**
   * 纯文本导出：不用【】标题，接近纸质病历的书写格式。
   * 单句章节（主诉、现病史）写成「名称：正文」；
   * 分项章节（一般项目、既往史、个人史…）写成「名称：」换行再列各项。
   */
  function generatePlain(r, opts = {}) {
    const { sections } = generate(r, opts);
    const out = [];
    SECTION_ORDER.forEach(n => {
      const body = sections[n];
      if (!body) return;
      if (body.includes('\n')) out.push(`${n}：\n${body}`);
      else out.push(`${n}：${body}`);
    });
    return out.join('\n') + '\n';
  }


  /* ---------------------------- 质控提醒 ---------------------------- */

  const DIAG_WORDS = [
    // 心血管
    '高血压', '糖尿病', '冠心病', '心梗', '心肌梗死', '心绞痛', '心衰', '心力衰竭',
    '房颤', '心房颤动', '心律失常', '瓣膜病',
    // 呼吸
    '肺炎', '肺结核', '哮喘', '慢阻肺', 'COPD', '支气管炎', '气胸', '肺栓塞',
    // 消化
    '胃炎', '胃溃疡', '十二指肠溃疡', '胆囊炎', '胆结石', '胰腺炎', '阑尾炎',
    '肠梗阻', '肠炎', '肝炎', '肝硬化', '消化道出血',
    // 泌尿
    '肾炎', '肾病', '肾衰', '肾功能不全', '泌尿系感染', '尿路感染', '肾结石',
    // 血液
    '贫血', '白血病', '淋巴瘤', '血小板减少',
    // 神经
    '脑梗', '脑梗死', '脑出血', '脑卒中', '偏头痛', '癫痫', '帕金森',
    // 内分泌/风湿
    '甲亢', '甲减', '甲状腺功能', '风湿', '类风湿', '痛风', '红斑狼疮',
    // 外科/骨科
    '骨折', '脱位', '疝', '痔疮',
    // 肿瘤
    '肿瘤', '癌', '肉瘤', '白血病',
    // 妇产
    '妊娠期高血压', '子痫', '宫外孕', '异位妊娠', '盆腔炎'
  ];

  /**
   * 通用查体与专科查体对同一体征给出互相矛盾的描述时，列出提示。
   *
   * 为什么需要（缺陷5 的残留部分）：用户把「消化内科专科查体：压痛点」填成
   * 「中上腹压痛，无反跳痛」，通用腹部触诊却还是系统默认的
   * 「腹平软，全腹无压痛、反跳痛」——同一份病历里既「全腹无压痛」又「中上腹压痛」，
   * 肠鸣音也一处 4 次/分、一处 3 次/分（均已复现）。
   *
   * 处理原则：
   *   1) 判据必须是「通用项取的是系统默认值」。通用项一旦是用户自己手填的，
   *      那就是用户自己的判断，程序不置一词——既不删也不提示。
   *   2) 不擅自删改任何一方。查体阳性所见是学生亲手查到的，
   *      删掉默认值等于替他做决定；改他的描述更不行。所以只提醒「请确认以哪一份为准」。
   *   3) 宁可漏报不可误报：只有「同一个体征词」且「否定/肯定相反」或
   *      「同一项数值不同」才算冲突，纯措辞差异不管。
   *
   * @param {object} r record
   * @returns {string[]} 每条一句话的中文提醒
   */
  function peConflicts(r) {
    const deptKey = (r.basic || {}).department || 'general';
    const dept = SCHEMA.DEPARTMENTS.find(d => d.key === deptKey) || SCHEMA.DEPARTMENTS[0];
    const res = [];
    const seenKey = new Set();

    // 只收集「用户没写、取的是 schema 默认值」且这次确实输出的通用项。
    const generalDefaults = [];
    SCHEMA.PE_COMMON.forEach(group => {
      const items = group.items.filter(it => !it.depts || it.depts.includes(deptKey));
      items.forEach(it => {
        if (!SCHEMA.peChecked(r, group.key, it.key)) return;
        // 用户亲手写过的项直接跳过——那不是系统默认值
        if (stripTail(((r.pe || {})[group.key] || {})[it.key])) return;
        const val = stripTail(peValue(r, group.key, it));
        if (!val) return;
        if (!SCHEMA.peValueIsDefault(it, val)) return;
        generalDefaults.push({ group: group.name, label: it.label, val });
      });
    });
    if (!generalDefaults.length) return res;

    // 同一体征可能出现在多个部位/多个专科项里，按这个表配对。
    //
    // 这里刻意不放单字「肝」「脾」：它们会命中「肝颈静脉回流征」「肝浊音界」之类的
    // 复合词，把不相干的项配到一起。要配就写全一点。
    const CONFLICT_KEYS = [
      '压痛', '反跳痛', '肠鸣音', '浊音', '震颤', '包块', '杂音', '啰音', '水肿',
      '肝肋下', '脾肋下', '肝大', '脾大', '肝区叩击痛', '肾区叩击痛',
    ];
    /**
     * 从一句话里认出它说的部位。
     *
     * 加这个是因为终审判出的假冲突：头颅查体默认写「无压痛及包块」，
     * 专科又写了「中上腹压痛」，两者都含「压痛」但根本不是同一个地方，
     * 一报就是「同一体征前后矛盾」——报得越多，学生越会整体无视提醒。
     */
    const REGIONS = [
      ['头颅', /头颅|头部|额部|颞部|枕部|头顶/],
      ['颈部', /颈部|颈前|颈侧|甲状腺|颈静脉|颈动脉|气管/],
      ['胸部', /胸壁|胸廓|前胸|乳房|双乳/],
      ['心脏', /心前区|心尖|心界|心音|心脏|瓣膜/],
      ['肺部', /双肺|肺下界|胸膜|呼吸音|语颤|语音共振/],
      ['腹部', /腹部|腹壁|全腹|上腹|下腹|中腹|脐周|脐部|麦氏点|胆囊点|季肋|肝区|脾区|腹水|移动性浊音/],
      ['腰背部', /腰部|腰背|背部|脊柱|胸椎|腰椎|骶部/],
      ['四肢', /四肢|上肢|下肢|双足|足背|手指|关节|膝|踝/],
      ['会阴', /外阴|阴道|宫颈|子宫|附件|直肠|肛门|会阴/],
      ['皮肤', /皮肤|皮疹|黏膜|巩膜/],
    ];
    const regionsOf = clause => REGIONS.filter(([, re]) => re.test(clause)).map(([n]) => n);
    // 只用当前分句认部位是不够的：「头颅大小、形态正常，无压痛及包块」切出来以后，
    // 「无压痛及包块」那一段自己没提部位，认不出来就只能照旧比对，假冲突又回来了。
    // 所以两边都带上项目自己的上下文（组名 + 项目名）一起认。
    const differentSite = (aText, bText) => {
      const ra = regionsOf(aText);
      const rb = regionsOf(bText);
      if (!ra.length || !rb.length) return false;   // 有一边说不上部位，仍按原逻辑比对
      return !ra.some(x => rb.includes(x));
    };
    // 只按逗号/分号/句号切，不按顿号切：「全腹无压痛、反跳痛」里的「反跳痛」
    // 是被前面那个「无」管着的，切碎了就会把「反跳痛」当成独立阳性。
    const splitAll = t => String(t || '').split(/[，,；;。]/).map(s => s.trim()).filter(Boolean);
    const numOf = c => (c.match(/(\d+)\s*次\s*\/?\s*分/) || [])[1];
    const NEG_WORD = /(无|未见|未触及|未闻及|未引出|未扪及|否认|没有|正常|阴性|不)/;
    const SEG = /[、，,；;。：:]/;
    /**
     * 这个分句里的 key 是否被否定了。
     *
     * 不能只看句首：「全腹无压痛、反跳痛」以「全腹」开头，句首不是否定词，
     * 但「压痛」确实被「无」否掉了。所以取 key 前面那一小段（到上一个顿号/逗号为止）
     * 里有没有否定词；key 后面紧跟着「阴性/未触及」这类后缀也算否定。
     */
    const negated = (clause, key) => {
      const idx = clause.indexOf(key);
      if (idx < 0) return false;
      // 取 key 之前最后一个分隔符之后的那一小段（「全腹无压痛、反跳痛」里的「无压痛」）
      const head = clause.slice(0, idx).split(SEG).pop() || '';
      if (NEG_WORD.test(head)) return true;
      // 否定词也可能落在体征名词之后：肝脾未及、Murphy征阴性、肠鸣音正常
      // 「正常」也算一种否定：写「肠鸣音正常」而专科写「肠鸣音活跃」就是矛盾。
      const tail = clause.slice(idx + key.length, idx + key.length + 5);
      return /^(阴性|正常|未触及|未闻及|未引出|未及)/.test(tail);
    };

    (dept.special || []).forEach(spKey => {
      const sp = SCHEMA.PE_SPECIAL[spKey];
      if (!sp) return;
      const store = ((r.pe || {})['special_' + spKey]) || {};
      sp.items.forEach(it => {
        const raw = stripTail(store[it.key]);
        if (!raw) return;                       // 专科侧也必须是用户亲手写的
        splitAll(raw).forEach(spClause => {
          CONFLICT_KEYS.forEach(k => {
            if (!spClause.includes(k)) return;
            generalDefaults.forEach(g => {
              splitAll(g.val).forEach(gClause => {
                if (!gClause.includes(k)) return;
                // 「同一个体征 + 说法相反」或「同一个体征 + 数值不同」才算冲突。
                // 用 negated 而不是看句首：默认值「全腹无压痛、反跳痛」以「全腹」开头，
                // 只看句首会把阴性误判成阳性，提示就会变成假冲突。
                const opposite = negated(gClause, k) !== negated(spClause, k);
                const numG = numOf(gClause);
                const numS = numOf(spClause);
                const numDiff = !!(numG && numS && numG !== numS);
                if (!opposite && !numDiff) return;
                // 说两个地方就别配对：头颅「无压痛及包块」和「中上腹压痛」都含「压痛」，
                // 但不是同一个体征，报出来只是噪音。
                // 带上组名和项目名再认部位，因为切出来的分句本身常常没提部位。
                if (differentSite(`${g.group}${g.label}：${gClause}`, `${sp.name}${it.label}：${spClause}`)) return;
                // 同一对「通用项 × 专科段」只提示一次，避免一大串雷同条目
                const id = `${g.group}|${g.label}|${sp.name}`;
                if (seenKey.has(id)) return;
                seenKey.add(id);
                res.push(`【体格检查】${g.group}「${g.label}」取的是系统默认描述「${gClause}」，`
                  + `而${sp.name}写的是「${spClause}」，同一体征前后矛盾，请确认以哪一份为准（程序不替你删改）。`);
              });
            });
          });
        });
      });
    });
    return res;
  }

  /**
   * 生命体征/一般项目的取值范围检查。
   *
   * 这些数字最终会一个不漏地进病历正文，而 validate 以前一位都不看：
   * T 368℃、P 780次/分、BP 80/130 都能原样写进「体格检查」，
   * 70 岁的人挂儿科也照生成儿科个人史。这些不需要医学知识就能判断，
   * 属于「写了肯定不对」而不是「写得对不对要看病人」——所以只报错不修改。
   */
  const VITAL_RANGE = {
    temperature: [34, 43, '体温'],
    pulse: [20, 250, '脉搏'],
    respiration: [5, 80, '呼吸'],
    sbp: [50, 300, '收缩压'],
    dbp: [20, 200, '舒张压'],
    height: [30, 250, '身高'],
    weight: [1, 300, '体重'],
    abdCirc: [20, 200, '腹围'],
    headCirc: [20, 70, '头围'],
    chestCirc: [20, 120, '胸围'],
  };

  function checkVitals(r, w) {
    const v = ((r.pe || {}).vitals) || {};
    Object.keys(VITAL_RANGE).forEach(k => {
      const [lo, hi, label] = VITAL_RANGE[k];
      const raw = String(v[k] === undefined || v[k] === null ? '' : v[k]).trim();
      if (!raw) return;
      if (!/^-?\d+(\.\d+)?$/.test(raw)) {
        w.push(`【生命体征】${label}填的是「${raw}」，不是数字，请核对。`);
        return;
      }
      const n = Number(raw);
      if (n < lo || n > hi) {
        w.push(`【生命体征】${label} ${raw} 超出可信范围（${lo}～${hi}），请核对是否多打或少打了一位。`);
      }
    });
    // 收缩压必须高于舒张压：写反了是最常见的手误，两个数都在范围内时查不出来
    const sbp = Number(String(v.sbp === undefined ? '' : v.sbp).trim());
    const dbp = Number(String(v.dbp === undefined ? '' : v.dbp).trim());
    if (sbp && dbp && Number.isFinite(sbp) && Number.isFinite(dbp) && sbp <= dbp) {
      w.push(`【生命体征】收缩压 ${sbp} 不高于舒张压 ${dbp}，两者可能写反了。`);
    }
  }

  /** 日期必须是 YYYY-MM-DD 且真实存在；顺序上入院不晚于记录、出院不早于入院 */
  function checkDates(r, w) {
    const b = r.basic || {};
    const okDate = s => {
      const t = stripTail(s);
      if (!t) return null;
      const m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (!m) {
        w.push(`【日期】「${t}」不是 YYYY-MM-DD 格式，请核对。`);
        return null;
      }
      const y = Number(m[1]);
      const mo = Number(m[2]);
      const d = Number(m[3]);
      const dt = new Date(Date.UTC(y, mo - 1, d));
      if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) {
        w.push(`【日期】「${t}」不是一个真实存在的日期，请核对。`);
        return null;
      }
      // 补零后再比较，否则 '2026-9-1' 这类写法按字符串比会排错
      return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    };
    const admit = okDate(b.admitDate);
    const record = okDate(b.recordDate);
    const discharge = okDate((r.discharge || {}).dischargeDate);
    if (admit && record && record < admit) {
      w.push(`【日期】记录日期 ${record} 早于入院日期 ${admit}，请核对。`);
    }
    if (admit && discharge && discharge < admit) {
      w.push(`【日期】出院日期 ${discharge} 早于入院日期 ${admit}，请核对。`);
    }
  }

  /** 科室与年龄是否对得上：儿科接成人、成人科接 14 岁以下都值得问一句 */
  function checkDeptAge(r, w) {
    const b = r.basic || {};
    const m = String(b.age === undefined ? '' : b.age).match(/\d+/);
    if (!m) return;
    const age = Number(m[0]);
    if (!Number.isFinite(age) || age <= 0) return;
    const dept = b.department;
    const name = (SCHEMA.DEPARTMENTS.find(d => d.key === dept) || {}).name || '';
    if (dept === 'pediatrics' && age >= 14) {
      w.push(`【一般项目】科室是${name}，但年龄 ${age} 岁，请确认是否选错科室（儿科一般指 14 岁以下）。`);
    } else if (dept && dept !== 'pediatrics' && dept !== 'emergency' && age < 14) {
      w.push(`【一般项目】年龄 ${age} 岁，科室却是${name}；14 岁以下建议选儿科。`);
    }
  }

  function validate(r) {
    const w = [];
    const b = r.basic || {};
    if (!b.name) w.push('【一般项目】缺少姓名。');
    if (!b.gender) w.push('【一般项目】缺少性别。');
    if (!b.age) w.push('【一般项目】缺少年龄。');
    const cc = stripTail(b.chiefComplaint);
    if (!cc) {
      w.push('【主诉】未填写。');
    } else {
      if (cc.length > 20) w.push(`【主诉】文字偏长（${cc.length}字），一般要求不超过20字，只写症状+时间、不写诊断。`);
      const hit = DIAG_WORDS.filter(dw => cc.includes(dw));
      if (hit.length) w.push(`【主诉】疑似包含诊断性词语（${hit.join('、')}），主诉应写症状，建议改为症状描述。`);
      // 缺陷H4（已复现）：学生在主诉正文里直接写了「反复上腹痛3年」，
      // 只是没再去下面的「持续时间」输入框里重复填一遍，旧判据只看那个输入框，
      // 于是照样报「缺少持续时间」。持续时间本来就在正文里，重复填才奇怪。
      // 现在先看正文：正文里已经出现「数字+时间单位」（含中文数字、半个月之类）就不报。
      if (!stripTail(b.chiefComplaintDuration) && !hasDurationInText(buildChiefComplaint(r))) {
        w.push('【主诉】缺少持续时间。');
      }
    }
    if (!(buildHPI(r) || '').trim()) w.push('【现病史】未填写。');
    // 系统回顾：只有完全没动过才提醒。
    // ⚠️ 措辞随本轮语义改动（缺陷1第2条）：旧文案「默认为阴性，勾选阳性症状即可」
    // 已经不成立——现在没勾不等于阴性，没问过就是未问，一个字都不写。
    // 同时把「标阴性」这条路径也认进来（v.negative），否则用户全点阴性还会被反复提醒。
    const rosTouched = Object.keys(r.ros || {}).some(sysKey =>
      Object.values(r.ros[sysKey] || {}).some(v => v && (v.checked || v.negative || v.detail || v.time))
    );
    if (!rosTouched) {
      w.push('【系统回顾】尚未问诊。未点选的症状不会写进病历；过一遍问诊后，阳性点红、明确阴性的点「阴性」。');
    }
    // 【婚姻史】静默丢失（缺陷2第3条）：
    // 这一节以前 `if (!status) return ''`，空就整节消失，而 validate 里没有任何一项检查它，
    // 用户完全不知道自己漏了婚姻史。现在正文有占位符，同时这里补一条提醒。
    if (!stripTail((r.marriage || {}).status) && !stripTail((r.basic || {}).marital)) {
      w.push('【婚姻史】未填写。');
    }
    // 【个人史】冶游史属隐私项，不填不算缺项，但完全没填个人史时要提示（缺陷4）
    const per = r.personal || {};
    if (!stripTail(per.residence) && !stripTail(per.travel) && !per.smoking && !per.drinking &&
        !stripTail(per.occupationEnv) && !stripTail(per.sexualHistory) && !stripTail(per.drugs)) {
      w.push('【个人史】未填写（至少需要居住情况、烟酒嗜好、职业与工作条件、冶游史）。');
    }
    const abn = abnormalPE(r);
    if (!abn.length && !Object.keys((r.pe || {}).vitals || {}).length) {
      w.push('【体格检查】未录入异常或生命体征。');
    }
    // 缺陷B4（已复现）：心脏听诊的默认描述里带具体数值（「心率78次/分」），
    // 学生勾了这一项却没改数字，病历里就会出现「心脏听诊：心率78次/分」与
    // 「P 88次/分」并存，两条数字互相矛盾，而 validate 一条提醒都不给。
    // 程序不替学生改数字（改了就是编造），只把矛盾指出来让他自己核对。
    const pulseRaw = String((((r.pe || {}).vitals) || {}).pulse || '').match(/\d+/);
    if (pulseRaw) {
      const hr = (buildPE(r) || '').match(/心率\s*(\d+)\s*次\/分/);
      if (hr && hr[1] !== pulseRaw[0]) {
        w.push(`【体格检查】心脏听诊写的心率 ${hr[1]} 次/分 与生命体征 P ${pulseRaw[0]} 次/分 不一致，请核对。`);
      }
    }
    // 通用查体（系统默认值）与专科查体互相否定时只提醒、不改正文，见 peConflicts。
    peConflicts(r).forEach(msg => w.push(msg));
    // 数值、日期、科室与年龄——这三类不需要看病人就能判断「写错了」
    checkVitals(r, w);
    checkDates(r, w);
    checkDeptAge(r, w);
    if (!((r.diagnosis || {}).confirmed || []).length) w.push('【初步诊断】未填写，可参考"诊断提示"。');
    else warnDiagnosisOrder(r, w);
    if (!stripTail(r.summary || '')) {
      w.push('【摘要】目前为自动生成的初稿，请核对并润色后再定稿。');
    }

    // 首次病程录（第5页/第6页）：只提醒「有缺项」，不把提示写进病历正文
    const soap = r.soap || {};
    const a = soap.a || {};
    const p = soap.p || {};
    if (!(Array.isArray(a.diff) && a.diff.some(d => d && stripTail(d.diagnosis)))) {
      w.push('【首次病程录】鉴别诊断未填写，建议围绕主要诊断写 2 条左右，说明为什么考虑、哪一点不支持。');
    }
    if (!(Array.isArray(p.perDiagnosis) && p.perDiagnosis.some(x => x && stripTail(x.diagnosis)))) {
      w.push('【首次病程录】诊疗计划尚未按诊断逐条列出检查与治疗措施。');
    }
    if (Array.isArray(a.diff) && a.diff.length) {
      const chk = diffRelatedToDiagnosis(r);
      if (chk.unrelated.length) {
        w.push(`【首次病程录】${chk.unrelated.join('、')} 与现有诊断关联不明确，请确认是否保留。`);
      }
    }

    // 出院记录：六项缺任一项都会让记录不完整
    const d = r.discharge || {};
    const adv = d.advice || {};
    if (!stripTail(d.dischargeStatus)) w.push('【出院记录】出院情况未填写。');
    if (!stripTail(d.dischargeDate)) w.push('【出院记录】出院日期未填写，住院天数无法计算。');
    const advMissing = ['drug', 'nonDrug', 'lifestyle', 'followUp'].filter(k => !stripTail(adv[k]));
    if (advMissing.length === 4) {
      w.push('【出院记录】出院医嘱未填写（药物、非药物、生活指导、复诊时间四项）。');
    } else if (advMissing.length) {
      w.push(`【出院记录】出院医嘱缺：${advMissing.map(k => ({
        drug: '药物治疗', nonDrug: '非药物治疗', lifestyle: '生活指导', followUp: '复诊时间'
      })[k]).join('、')}。`);
    }
    return w;
  }

  return {
    generate, generatePlain, validate,
    buildBasicInfo, buildChiefComplaint, buildHPI, buildROS, buildPMH,
    buildPersonal, buildMarriage, buildMenstruation, buildChildbirth,
    buildMarriageChildbirth,
    buildFamily, buildPE, buildVitals, buildAuxiliary, buildSummary,
    buildDiagnosis, draftSummary, draftHPI, abnormalPE, peValue, collectROS, firstCourseSelfCheck, diffRelatedToDiagnosis, buildMarriageHistory, buildMenstruationChildbirth, buildBasisSection, renderPEGroup,
    // 查体项聚合（父项 / 子项去重）
    peEntries, buildFocusPE,
    // 首次病程录（SOAP）与出院记录
    buildFirstCourseRecord, buildDischargeRecord,
    draftCaseSummary, draftObjectivePE, draftObjectiveAux, draftBasisDetail,
    diffRelatedToDiagnosis, diagnosisList, auxItems, hospitalDays,
    mergeIntoHistory,
    joinSentences, stripTail, SECTION_ORDER
  };
})();

   * 用户填了子项之后父项就一直是默认值，于是 `pe:abdomen.abdPalpation` 这类
   * 键永远不会产生——而「急性阑尾炎」「中枢神经系统感染」等规则的 must 正是它，
   * 结果会是**静默失效**：不报错，只是该提示的再也不提示。
   *
   * 两级映射：
   *   PE_ALIAS       key 级：子项阳性 → 激活父项的 pe: 键（满足 must）
   *   PE_VALUE_ALIAS 值级：把子项的具体阳性描述折算成父项规则认识的 pev: 值
   *                  （满足 match 计数），折算只做临床上一一对应的情形
   */
  const PE_ALIAS = {
    // 腹部触诊 4 子项 → 聚合父项 abdPalpation
    'abdomen.abdPalpSuperficial': ['abdomen.abdPalpation'],
    'abdomen.abdPalpDeep': ['abdomen.abdPalpation'],
    'abdomen.liverPalpation': ['abdomen.abdPalpation'],
    'abdomen.spleenPalpation': ['abdomen.abdPalpation'],
    // 触诊补充 4 子项（教材《诊断学》第10版腹部触诊书写清单里的胆囊/肾/膀胱/液波震颤）
    // 同属「腹部触诊」这一大类，阳性同样说明触诊查出了问题
    'abdomen.gallbladderPalpation': ['abdomen.abdPalpation'],
    'abdomen.kidneyPalpation': ['abdomen.abdPalpation'],
    'abdomen.bladderPalpation': ['abdomen.abdPalpation'],
    'abdomen.fluidThrill': ['abdomen.abdPalpation'],
    // 振水音是听诊项目（教材归在腹部听诊），映射到 abdAuscultation 而不是触诊
    'abdomen.succussionSplash': ['abdomen.abdAuscultation'],
    // 神经反射 4 子项 → 聚合父项 nerve
    'nervousPE.tendonReflex': ['nervousPE.nerve'],
    'nervousPE.brudzinski': ['nervousPE.nerve'],
    'nervousPE.kernig': ['nervousPE.nerve'],
    'nervousPE.babinski': ['nervousPE.nerve'],
    // 四肢 3 子项 → 聚合父项 limbs（膝跳反射/足背动脉/桡动脉无父项，不映射）
    'spine.limbMuscle': ['spine.limbs'],
    'spine.edemaAnkle': ['spine.limbs'],
    'spine.edemaPretibial': ['spine.limbs']
  };

  /**
   * 值级映射：把子项的具体阳性描述折算成父项规则认识的 pev: 值。
   *
   * 只收录「临床上一一对应、折算不会凭空增加事实」的情形：
   *   布氏征/克氏征阳性 ⇔ 脑膜刺激征阳性（这是定义）
   *   巴氏征阳性     ⇔ 病理反射阳性（这是定义）
   *   踝部/胫前凹陷性水肿 ⇔ 双下肢凹陷性水肿（部位包含关系）
   *   肌力 3/4 级     ⇔ 四肢肌力减退（这是定义）
   *
   * ★★ 腹部触诊刻意**不**折算——这是有意为之，不是遗漏，不要「修好」它 ★★
   *
   * 腹部子项（abdPalpSuperficial / abdPalpDeep / liverPalpation / spleenPalpation）
   * 只做了 key 级映射（PE_ALIAS，让规则 must 仍能命中），值级折算一律不做。
   *
   * 原因：父项的候选值写的是「右下腹压痛、反跳痛」，而子项往往只写了「压痛」。
   * 一旦按值折算，就等于替医生补上「反跳痛」这个**更严重的、实际没有检查**的体征。
   * 病历是医疗记录，工具可以少提示（漏报只是少一个提醒，医生自己会判断），
   * 但绝不能凭空生成没做过的查体发现（误报会直接写进病历、误导诊疗）。
   *
   * 代价很小且已验证：只填「右下腹浅触诊压痛」时，「急性阑尾炎」规则靠
   * must=['pe:abdomen.abdPalpation'] 仍能命中，match 计数靠
   * 「转移性右下腹痛」「发热」等其他条目已满足 need=2。
   *
   * 如果将来有人觉得「少折算一条是 bug」又想加回去，请先读上面这段：
   * 折算方向必须是「文字完全对应」，不允许从「压痛」推出「反跳痛」。
   * 目前只保留了 liverPalpation / spleenPalpation 两个文字完全对应的折算。
   */
  const PE_VALUE_ALIAS = {
    // 神经：布氏征/克氏征阳性 = 脑膜刺激征阳性；巴氏征阳性 = 病理反射阳性
    'nervousPE.brudzinski=布氏征阳性': ['pev:nervousPE.nerve=脑膜刺激征阳性'],
    'nervousPE.kernig=克氏征阳性': ['pev:nervousPE.nerve=脑膜刺激征阳性'],
    'nervousPE.babinski=巴氏征阳性': ['pev:nervousPE.nerve=病理反射阳性'],
    'nervousPE.babinski=双侧巴氏征阳性': ['pev:nervousPE.nerve=病理反射阳性'],
    // 四肢水肿：踝部/胫前凹陷性水肿即「双下肢凹陷性水肿」
    'spine.edemaAnkle=双侧踝部凹陷性水肿': ['pev:spine.limbs=双下肢凹陷性水肿'],
    'spine.edemaPretibial=双侧胫前凹陷性水肿': ['pev:spine.limbs=双下肢凹陷性水肿'],
    // 四肢肌力减退
    'spine.limbMuscle=四肢肌力4级': ['pev:spine.limbs=四肢肌力减退'],
    'spine.limbMuscle=四肢肌力3级': ['pev:spine.limbs=四肢肌力减退'],
    'spine.limbMuscle=双上肢肌力正常、双下肢肌力减退': ['pev:spine.limbs=四肢肌力减退'],
    // 腹部：只折算文字完全对应的情形（不补「反跳痛」）
    'abdomen.liverPalpation=肝肋下可触及': ['pev:abdomen.abdPalpation=肝肋下可触及'],
    'abdomen.spleenPalpation=脾肋下可触及': ['pev:abdomen.abdPalpation=脾肋下可触及']
  };

  /* ---------------------- 从病历中抽取"发现" ---------------------- */

  function extractFindings(r) {
    const F = new Set();
    const b = r.basic || {};

    // 主诉 + 现病史关键词
    // 注意：先剔除否定从句（"无咯血、盗汗""否认胸痛"），否则阴性描述会被误判为阳性
    // 刻意不纳入 hpi.negativeDiscriminating：它是整段阴性病史，"无咯血、盗汗、消瘦"
    // 按顿号切开后「盗汗」「消瘦」会丢掉否定前缀，反而被误判成阳性。
    const rawText = [
      b.chiefComplaint || '',
      (r.hpi || {}).onset || '', (r.hpi || {}).cause || '',
      (r.hpi || {}).symptoms || '', (r.hpi || {}).relief || '',
      (r.hpi || {}).evolution || '', (r.hpi || {}).accompanying || ''
    ].join('，');
    const NEG_RE = /^(无|未|不|否认|没有|未见|未出现|无明显|无明|否认有)/;
    const textAll = rawText
      .split(/[，,。；;、\n]/)
      .filter(clause => clause.trim() && !NEG_RE.test(clause.trim()))
      .join('，');

    const ccKeys = ['发热', '咳嗽', '咳痰', '咯血', '呼吸困难', '气促', '喘息', '胸闷', '胸痛',
      '心悸', '上腹痛', '腹痛', '转移性右下腹痛', '右上腹痛', '腹泻', '呕吐', '腹胀', '黑便',
      '呕血', '黄疸', '水肿', '血尿', '头痛', '头晕', '乏力', '消瘦'];

    // 主诉/现病史里的说法太活，「上腹部疼痛」「上腹隐痛」都不会包含子串「上腹痛」，
    // 于是最常见的上腹痛连 cc:上腹痛 都命不中，消化性溃疡一条规则都触发不了。
    // 这里先把写法拉平再匹配：腹部→腹、各种「X痛」→「痛」、疼痛→痛。
    // 只影响 cc: 关键词，不影响 pev: 的精确匹配。
    const flatCC = textAll
      .replace(/腹部/g, '腹')
      .replace(/疼痛/g, '痛')
      .replace(/(隐|胀|绞|刺|钝|烧灼|灼|刀割|撕裂|牵扯|压榨|闷|跳|酸|胀)痛/g, '痛');
    ccKeys.forEach(k => { if (flatCC.includes(k)) F.add('cc:' + k); });

    // 系统回顾阳性
    (SCHEMA.ROS || []).forEach(sys => {
      const store = (r.ros || {})[sys.key] || {};
      sys.symptoms.forEach(sym => {
        if ((store[sym.key] || {}).checked) F.add(`ros:${sys.key}.${sym.key}`);
      });
    });

    // 既往史
    Object.keys(((r.pmh || {}).diseaseChecks) || {}).forEach(k => {
      if (r.pmh.diseaseChecks[k]) F.add('pmh:' + k);
    });
    // 慢性病史手写文本也识别
    const pmhText = `${(r.pmh || {}).diseaseDetail || ''} ${(r.pmh || {}).special || ''}`;
    ['高血压', '糖尿病', '冠心病', '慢性肾脏病', '肝硬化', '病毒性肝炎', '脑卒中',
      '痛风', '甲状腺功能亢进', '甲状腺功能减退', '类风湿关节炎', '肺结核']
      .forEach(dz => { if (pmhText.includes(dz)) F.add('pmh:' + dz); });

    // 个人史
    const per = r.personal || {};
    if (per.smoking === '有' || per.smoking === '已戒') F.add('smoke:有');
    if (per.smoking === '有' || per.smoking === '已戒') F.add('risk:smoke');
    if (per.drinking === '有' || per.drinking === '已戒') F.add('risk:alcohol');
    // 「外伤史」是自由文本，绝大多数人会写「否认外伤史」。
    // 旧实现只要非空就加 trauma:有，于是「否认外伤史」的病人被当成有外伤，
    // 骨折规则（must: trauma:有）就会凭空冒出来。必须认否定词。
    const traumaText = String((r.pmh || {}).trauma || '').trim();
    if (traumaText && !/^(否认|无|未|没有|不)/.test(traumaText)) F.add('trauma:有');

    // 生命体征
    const v = (r.pe || {}).vitals || {};
    const t = parseFloat(v.temperature);
    if (!isNaN(t)) {
      if (t >= 37.3) F.add('vital:tempUp');
      if (t <= 36) F.add('vital:tempDown');
    }
    const p = parseFloat(v.pulse);
    if (!isNaN(p)) {
      if (p > 100) F.add('vital:tachy');
      if (p < 60) F.add('vital:brady');
    }
    const rr = parseFloat(v.respiration);
    if (!isNaN(rr) && rr > 20) F.add('vital:tachypnea');
    const sbp = parseFloat(v.sbp), dbp = parseFloat(v.dbp);
    if (!isNaN(sbp)) {
      if (sbp >= 140) { F.add('vital:bpUp'); F.add('risk:htn'); }
      if (sbp < 90) F.add('vital:bpDown');
    }
    if (!isNaN(dbp) && dbp >= 90) F.add('vital:bpUp');
    const hgt = parseFloat(v.height), wgt = parseFloat(v.weight);
    if (!isNaN(hgt) && !isNaN(wgt) && hgt > 0) {
      const bmi = wgt / Math.pow(hgt / 100, 2);
      if (bmi >= 28) F.add('vital:bmiHigh');
      if (bmi < 18.5) F.add('vital:bmiLow');
    }

    // 体格检查：异常项用 pe: 与 pev: 两种键
    //
    // 两个必须在这里处理的兼容问题：
    //   ① 默认值比对不能用 `val === it.default`：t2 按评分表重写了腹部四项的默认
    //      文案，旧存档里存的是旧文案（legacyDefault），只比 default 会把一个完全
    //      正常的腹部读成 4 条阳性发现。统一交给 SCHEMA.peValueIsDefault。
    //   ② 查体项拆分后（父项保留 + 新增子项），用户改用子项时父项会保持默认值，
    //      于是 pe:组.父项 永远不产生，而 47 条规则里的 must 恰恰指着父项
    //      → 规则会静默失效（不报错、只是不再提示）。所以子项一旦是异常值，
    //      必须把对应的旧聚合 key 一并激活。映射表见 PE_ALIAS。
    // 统一去掉尾部标点后再生成 pev: 键。
    // 用户在文本框里补一个句号（"右下腹压痛、反跳痛。"）时，
    // 若用原始串拼 key，值别名映射会精确匹配失败，规则静默丢掉一条 match（评审 medium-3）。
    const normVal = s => String(s).trim().replace(/[，,；;。.、\s]+$/g, '');

    (SCHEMA.PE_COMMON || []).forEach(g => {
      g.items.forEach(it => {
        // 勾选制：这次没查的项不能参与任何记分。取消勾选 ≠ 检查正常，
        // 它只是「没查」——不写进病历，也不该给出诊断提示。
        if (SCHEMA.peChecked && !SCHEMA.peChecked(r, g.key, it.key)) return;
        const val = (GENERATOR.peValue ? GENERATOR.peValue(r, g.key, it) : '') || '';
        if (!val) return;
        if (SCHEMA.peValueIsDefault ? SCHEMA.peValueIsDefault(it, val) : (it.default && val === it.default)) return;
        // 子项默认值是空字符串，用户很可能直接选「正常」那条（item.normal）。
        // 选正常 = 没异常，不能产生 pe: / pev:，否则会凭空触发诊断提示。
        if (it.normal && normVal(val) === normVal(it.normal)) return;
        const v = normVal(val);
        if (!v) return;   // 只有一个标点的输入不算阳性
        F.add(`pe:${g.key}.${it.key}`);
        F.add(`pev:${g.key}.${it.key}=${v}`);
        // 子项阳性 → 同步激活旧聚合 key，并折算成父项规则认识的值
        const fullKey = `${g.key}.${it.key}`;
        (PE_ALIAS[fullKey] || []).forEach(parentRef => { F.add(`pe:${parentRef}`); });
        (PE_VALUE_ALIAS[`${fullKey}=${v}`] || []).forEach(k => F.add(k));
      });
    });
    const deptKey = b.department || 'general';
    const dept = (SCHEMA.DEPARTMENTS || []).find(d => d.key === deptKey);
    ((dept && dept.special) || []).forEach(sp => {
      (((SCHEMA.PE_SPECIAL[sp] || {}).items) || []).forEach(it => {
        // 同上：专科项默认未勾，没勾就是这次没查，不计分、不提示
        if (SCHEMA.peChecked && !SCHEMA.peChecked(r, 'special_' + sp, it.key)) return;
        const val = (GENERATOR.peValue ? GENERATOR.peValue(r, 'special_' + sp, it) : '') || '';
        if (!val) return;
        if (SCHEMA.peValueIsDefault ? SCHEMA.peValueIsDefault(it, val) : (it.default && val === it.default)) return;
        const v = normVal(val);
        if (!v) return;
        F.add(`pe:special_${sp}.${it.key}`);
        F.add(`pev:special_${sp}.${it.key}=${v}`);
      });
    });

    // 辅助检查关键词
    const auxText = (((r.auxiliary || {}).items) || [])
      .map(i => (i.name || '') + (i.result || '')).join(' ').toLowerCase();
    ['胸片', '超声', '心电图', '血常规', '尿常规', '淀粉酶', '脂肪酶', '血红蛋白', '尿蛋白', '大便',
      '胃镜', '幽门螺杆菌', '隐血', '腹部平片', '腹部ct']
      .forEach(k => { if (auxText.includes(k.toLowerCase())) F.add('aux:' + (k === '腹部ct' ? 'CT' : k)); });
    if (auxText.includes('ct')) F.add('aux:CT');

    // 人口学
    if (b.gender === '女') F.add('gender:女');
    const age = parseInt(b.age, 10);
    if (!isNaN(age)) {
      if (age >= 65) F.add('age:elderly');
      if (age >= 14 && age <= 49) F.add('age:fertile');
      if (age < 14) F.add('age:child');
    }
    const lmp = (r.menstruation || {}).lmp || '';
    if (/停经|推迟|未至|闭经|未来/.test(lmp)) F.add('menstruation:delay');

    return F;
  }

  /**
   * 计算提示
   * @returns [{ id, name, hint, note, matched:[...], score, deptMatch }]
   */
  function analyze(r) {
    const F = extractFindings(r);
    const deptKey = (r.basic || {}).department || 'general';
    const out = [];
    RULES.forEach(rule => {
      // 专科规则：本科室或通用科才提示（儿科/妇产等规则不会出现在内科病历里）
      const depts = rule.depts || [];
      const inDept = deptKey === 'general' || depts.includes(deptKey) || depts.includes('general');
      if (!inDept) return;

      const matched = rule.match.filter(m => F.has(m));
      if (matched.length < (rule.need || 2)) return;

      // 必要条件：必须命中其中至少一条，否则不提示（防止仅凭发热/心率就误报）
      if (rule.must && rule.must.length) {
        const mustHit = rule.must.some(m => F.has(m));
        if (!mustHit) return;
      }

      out.push({
        id: rule.id,
        name: rule.name,
        hint: rule.hint,
        note: rule.note,
        matched,
        score: matched.length / (rule.need || 2),
        deptMatch: deptKey === 'general' || depts.includes(deptKey)
      });
    });
    out.sort((a, b2) => (b2.deptMatch - a.deptMatch) || (b2.score - a.score));
    return out;
  }

  return { RULES, analyze, extractFindings, PE_ALIAS, PE_VALUE_ALIAS };
})();


</script>
<script>
/* ===========================================================================
 * UI 层：分步骤表单、本地保存、预览导出、评分自查
 * 依赖 RECORD_CORE / SCHEMA / CHECKER / GENERATOR / HINTS（构建时内联到同一文件）
 *
 * 存储与数据校验一律走 RECORD_CORE（可在 node:test 中单测），
 * 评分一律走 CHECKER，这里只负责 DOM 与用户交互。
 *
 * 界面职责边界：
 *   · 病历正文 = 大病历（12 个章节）
 *   · 首次病程录 = 同一份病历的 SOAP 归纳，不重复抄病历
 *   · 出院记录 = 住院经过的收尾文书
 *   · 评分自查 = 对照评分表逐条核对「还缺什么」，不落盘、不进病历
 * =========================================================================== */

const APP = (() => {
  'use strict';

  const CORE = RECORD_CORE;
  const K = CORE.STORAGE_KEYS;

  /** 当前正在编辑的病历 */
  let R = null;
  /** 已保存病历列表 */
  let LIST = [];
  /** 当前步骤索引 */
  let step = 0;
  let settings = { ...CORE.SETTINGS_DEFAULTS };
  /** 存储异常提示（损坏 / 写满），显示在界面顶部 */
  let storageAlert = '';

  /** 当前所有合法科室键，供 core 校验 */
  const deptKeys = () => SCHEMA.DEPARTMENTS.map(d => d.key);

  /**
   * 步骤清单。
   *
   * 「评分自查」放在「摘要与诊断」之后、「生成病历」之前：
   * 自查看的正是病历里已经写下的文字，只有写到摘要与诊断这一步才具备条件；
   * 而生成/导出是最后一环，自查必须在交卷前完成，不能排在导出之后。
   */
  const STEPS = [
    { key: 'basic', name: '基本情况', icon: '①' },
    { key: 'hpi', name: '现病史', icon: '②' },
    { key: 'ros', name: '系统回顾', icon: '③' },
    { key: 'pmh', name: '既往史', icon: '④' },
    { key: 'personal', name: '个人史', icon: '⑤' },
    { key: 'marriage', name: '婚姻与生育史', icon: '⑥' },
    { key: 'family', name: '家庭史', icon: '⑦' },
    { key: 'pe', name: '体格检查', icon: '⑧' },
    { key: 'aux', name: '实验室检查', icon: '⑨' },
    { key: 'summary', name: '摘要与诊断', icon: '⑩' },
    { key: 'check', name: '评分自查', icon: '⑪' },
    { key: 'output', name: '生成病历', icon: '✓' }
  ];

  /* ===================== 字段填写等级（必填 / 建议 / 可留空） =====================
   *
   * 用户反馈过「分不清什么必须填、什么可以留空」——这里把每个字段的等级写死成一张表，
   * 界面上按等级打标记，同时在「生成病历」页给一个总览。
   *
   *   must   必填：不填病历就不成立（姓名、性别、年龄、主诉）
   *   should 建议填：不填会留空或写成通用默认，病历质量下降
   *   auto   可留空：留空由工具自动补默认描述（会标注「系统默认」）
   */
  const FIELD_LEVEL = {
    must: new Set([
      'basic.name', 'basic.gender', 'basic.age', 'basic.department',
      'basic.chiefComplaint', 'basic.chiefComplaintDuration'
    ]),
    // 留空后「病历里会缺这一项」或只剩通用套话
    should: new Set([
      'basic.recordNo', 'basic.admitDate', 'basic.informant',
      'hpi.onset', 'hpi.symptoms', 'hpi.treatment',
      'pmh.health', 'pmh.surgery', 'pmh.trauma', 'pmh.transfusion',
      'personal.smoking', 'personal.drinking',
      'pe.vitals.temperature', 'pe.vitals.pulse', 'pe.vitals.respiration',
      'pe.vitals.sbp', 'pe.vitals.dbp'
    ])
  };

  /** 取某个字段的等级：must / should / auto */
  function fieldLevel(path) {
    if (FIELD_LEVEL.must.has(path)) return 'must';
    if (FIELD_LEVEL.should.has(path)) return 'should';
    return 'auto';
  }

  /** 等级对应的角标 HTML */
  function levelTag(path) {
    const lv = fieldLevel(path);
    if (lv === 'must') return '<span class="tag-req">必填</span>';
    if (lv === 'should') return '<span class="tag-should">建议填</span>';
    return '<span class="tag-auto">可留空</span>';
  }

  /* ========================= 存储（委托给 core） ========================= */

  function loadList() {
    const res = CORE.loadList(localStorage);
    LIST = res.list;
    if (!res.ok && res.corrupt) {
      // 关键：损坏时不覆盖原存档，提示用户先导出/备份
      storageAlert = '本地病历列表读取失败，已保留原始数据未做修改。请勿在此状态下继续保存，建议联系技术支持或导出手工备份。';
    }
    return res;
  }

  function saveList() {
    const ok = CORE.safeSet(localStorage, K.list, JSON.stringify(LIST));
    if (!ok) {
      // 保存失败必须让用户看见，不能假装已保存
      storageAlert = '保存失败：浏览器存储空间可能已满。请先导出病历，再删除不需要的记录。';
      return false;
    }
    return true;
  }

  function saveCurrent() {
    if (!R) return false;
    const ok = CORE.safeSet(localStorage, K.current, JSON.stringify(R));
    if (!ok) storageAlert = '当前病历自动保存失败，存储空间可能已满。';
    return ok;
  }

  function loadCurrent() {
    const res = CORE.loadCurrent(localStorage, SCHEMA.emptyRecord, deptKeys());
    if (res.ok && res.record) { R = res.record; return true; }
    if (!res.ok) {
      storageAlert = '正在编辑的病历无法读取（' + (res.reason || '存档损坏') + '），已为你新建空白病历，原数据保留未动。';
    }
    return false;
  }

  function loadSettings() {
    const raw = CORE.safeGetJSON(localStorage, K.settings);
    settings = CORE.normalizeSettings(raw);
    applyFontScale();
  }

  function saveSettings() {
    CORE.safeSet(localStorage, K.settings, JSON.stringify(settings));
    applyFontScale();
  }

  function applyFontScale() {
    document.documentElement.style.setProperty('--fs-scale', String(settings.fontScale || 1));
  }

  /** 把 defaults 中缺失的键补进 obj（保留 obj 已有值）—— 由 core 提供 */
  const deepMerge = CORE.deepMerge;

  /* ========================= 工具 ========================= */

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  const uid = CORE.uid;

  /** 给对象设置嵌套路径的值，如 setPath(R,'pe.vitals.temperature','37') */
  function setPath(obj, path, value) {
    const parts = path.split('.');
    let cur = obj;
    for (let i = 0; i < parts.length - 1; i++) {
      if (cur[parts[i]] === undefined || cur[parts[i]] === null) cur[parts[i]] = {};
      cur = cur[parts[i]];
    }
    cur[parts[parts.length - 1]] = value;
  }

  function getPath(obj, path) {
    return path.split('.').reduce((o, k) => (o === undefined || o === null ? undefined : o[k]), obj);
  }

  /* ========================= 通用控件 ========================= */

  /**
   * 字段标签行：名称 + 等级角标（必填 / 建议填 / 可留空）。
   * opts.tag = false 可关掉角标（用于明确不需要的场合）。
   */
  function fieldLabel(label, path, opts) {
    const tag = opts && opts.tag === false ? '' : levelTag(path);
    return `<span class="field-label">${esc(label)}${tag}</span>`;
  }

  /** 文本输入 */
  function input(label, path, opts = {}) {
    const val = getPath(R, path) || '';
    const type = opts.type || 'text';
    const ph = opts.placeholder ? ` placeholder="${esc(opts.placeholder)}"` : '';
    const hint = opts.hint ? `<div class="hint">${esc(opts.hint)}</div>` : '';
    return `<label class="field">
      ${fieldLabel(label, path, opts)}
      <input type="${type}" data-path="${path}" value="${esc(val)}"${ph}
        ${opts.inputmode ? `inputmode="${opts.inputmode}"` : ''}>
      ${hint}
    </label>`;
  }

  /** 多行文本 */
  function textarea(label, path, opts = {}) {
    const val = getPath(R, path) || '';
    const rows = opts.rows || 3;
    const ph = opts.placeholder ? ` placeholder="${esc(opts.placeholder)}"` : '';
    const hint = opts.hint ? `<div class="hint">${esc(opts.hint)}</div>` : '';
    return `<label class="field">
      ${fieldLabel(label, path, opts)}
      <textarea rows="${rows}" data-path="${path}"${ph}>${esc(val)}</textarea>
      ${hint}
    </label>`;
  }

  /** 单选 segmented */
  function seg(label, path, options, opts = {}) {
    const cur = getPath(R, path);
    const btns = options.map(o => {
      const v = typeof o === 'string' ? o : o.value;
      const t = typeof o === 'string' ? o : o.text;
      const on = String(cur) === String(v) ? ' on' : '';
      return `<button type="button" class="seg-btn${on}" data-seg="${path}" data-val="${esc(v)}">${esc(t)}</button>`;
    }).join('');
    return `<div class="field">
      ${fieldLabel(label, path, opts)}
      <div class="seg">${btns}</div>
      ${opts.hint ? `<div class="hint">${esc(opts.hint)}</div>` : ''}
    </div>`;
  }

  /** 单选下拉，支持 optgroup 分组 */
  function select(label, path, options, opts = {}) {
    const cur = getPath(R, path) || '';
    const isGrouped = options.length && options[0] && options[0].items;

    let optsHtml;
    if (isGrouped) {
      optsHtml = options.map(g => `<optgroup label="${esc(g.label)}">` +
        g.items.map(o => `<option value="${esc(o.value)}"${String(cur) === String(o.value) ? ' selected' : ''}>${esc(o.text)}</option>`).join('') +
        '</optgroup>').join('');
    } else {
      optsHtml = options.map(o => {
        const v = typeof o === 'string' ? o : o.value;
        const t = typeof o === 'string' ? o : o.text;
        return `<option value="${esc(v)}"${String(cur) === String(v) ? ' selected' : ''}>${esc(t)}</option>`;
      }).join('');
    }

    return `<label class="field">
      ${fieldLabel(label, path, opts)}
      <select data-path="${path}">
        ${opts.empty ? `<option value="">${esc(opts.empty)}</option>` : ''}
        ${optsHtml}
      </select>
      ${opts.hint ? `<div class="hint">${esc(opts.hint)}</div>` : ''}
    </label>`;
  }

  /** 科室分组选项 */
  function deptGroups() {
    const groups = [];
    SCHEMA.DEPARTMENTS.forEach(d => {
      let g = groups.find(x => x.label === d.group);
      if (!g) { g = { label: d.group, items: [] }; groups.push(g); }
      g.items.push({ value: d.key, text: d.name });
    });
    return groups;
  }

  /** 复选框组（多选），path 指向对象，如 pmh.diseaseChecks */
  function checks(label, path, options, opts = {}) {
    const obj = getPath(R, path) || {};
    const btns = options.map(o => {
      const v = typeof o === 'string' ? o : o.value;
      const t = typeof o === 'string' ? o : o.text;
      const on = obj[v] ? ' on' : '';
      return `<button type="button" class="chip${on}" data-check="${path}" data-val="${esc(v)}">${esc(t)}</button>`;
    }).join('');
    return `<div class="field">
      <span class="field-label">${esc(label)}</span>
      <div class="chips">${btns}</div>
    </div>`;
  }

  /* ========================= 各步骤渲染 ========================= */

  /**
   * 模板病例卡片。
   *
   * 为什么放在「科室」下面而不是另开一步：
   *   模板是按科室来的，选了科室才知道该列哪些。放同一步省一次翻页，
   *   而且学生本来就要在第一步填科室。
   *
   * 为什么默认折叠：模板是「可选的起点」。一进来就摊开一堆病种，会让人
   *   以为必须先选一个才能往下走。
   */
  function renderTemplates() {
    const deptKey = R.basic.department || 'general';
    const list = (typeof TEMPLATES !== 'undefined' && TEMPLATES.listByDept)
      ? TEMPLATES.listByDept(deptKey)
      : [];

    if (!list.length) {
      // 通用科没有「标准病例」，说清楚比留个空卡片好
      if (deptKey === 'general') {
        return `<details class="card tpl-card" id="tplCard">
          <summary>用模板开始（可选）<span class="tpl-count">先在上一张卡片选科室</span></summary>
          <div class="hint">通用科不提供模板——不同系统的病差别太大，没有一份能通用的初稿。
            选了具体科室后，这里会列出该科室的常见病种。</div>
        </details>`;
      }
      return `<details class="card tpl-card" id="tplCard">
        <summary>用模板开始（可选）<span class="tpl-count">本科室暂无模板</span></summary>
        <div class="hint">目前只做了消化内科的模板，其他科室会陆续加。你可以直接从
          <b>一般项目</b>开始自己写。</div>
      </details>`;
    }

    const items = list.map(t => {
      // 别名里经常把病名本身又写一遍（「急性胆囊炎」的别名里也有「急性胆囊炎」），
      // 名字里已经含的就别再重复列一遍，否则标题后面拖一串自我重复的字。
      const seen = String(t.name || '').toLowerCase();
      const alias = (t.alias || []).filter(a => {
        const k = String(a || '').trim().toLowerCase();
        return k && !seen.includes(k);
      });
      const aliases = alias.length
        ? `<span class="tpl-alias">又叫：${esc(alias.join('、'))}</span>` : '';
      return `<button class="tpl-item" data-tpl="${esc(t.key)}">
        <span class="tpl-name">${esc(t.name)}</span>
        ${aliases}
        ${t.hint ? `<span class="tpl-hint">${esc(t.hint)}</span>` : ''}
      </button>`;
    }).join('');

    return `<details class="card tpl-card" id="tplCard">
      <summary>用模板开始（可选）<span class="tpl-count">${list.length} 个病种</span></summary>
      <div class="hint">选一个病种，工具会填好一份<b>典型病例</b>的病历初稿（现病史、既往史、
        查体、辅助检查、诊断都写了）。<b>然后必须按你实际问到的改</b>——它是模板，不是你的病人。</div>
      <div class="tpl-list">${items}</div>
      <div class="hint">套用只补空白项：你已经写过的内容一个字都不会被覆盖。</div>
    </details>`;
  }

  function renderRos() {
    const totalPos = SCHEMA.ROS.reduce((n, sys) => {
      const store = R.ros[sys.key] || {};
      return n + sys.symptoms.filter(s => (store[s.key] || {}).checked).length;
    }, 0);
    // 明确标为阴性的症状数（缺陷1：三态里的「问了且阴性」，与「没问」分开计数）
    const totalNeg = SCHEMA.ROS.reduce((n, sys) => {
      const store = R.ros[sys.key] || {};
      return n + sys.symptoms.filter(s => {
        const v = store[s.key] || {};
        return !v.checked && v.negative;
      }).length;
    }, 0);
    const totalSym = SCHEMA.ROS.reduce((n, sys) => n + sys.symptoms.length, 0);

    let html = `
      <div class="card sticky-note">
        <div class="ros-head">
          <div>
            <strong>系统回顾</strong>
            <div class="hint">${/* 旧文案「默认全部为阴性」已经不成立：没勾不等于阴性。
                  现在必须明说「不点就不写」，否则用户会以为留空也没关系（其实会写「／」）。 */ ''}
              问过且没有的症状，点一下变<b>灰</b>记为阴性；有症状的点一下变<b>红</b>记为阳性。
              <b>没点过 = 没问 = 病历里一个字都不写。</b>已标阴性 ${totalNeg}/${totalSym} 项。</div>
          </div>
          <div class="ros-count">已选阳性 <b>${totalPos}</b> 项</div>
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" data-act="rosAllNegative">全部标记为阴性</button>
          <button class="btn btn-ghost" data-act="rosClearAll">全部清空为未问</button>
          <button class="btn btn-ghost" data-act="rosExpandAll">展开/收起全部</button>
        </div>
        <div class="ros-jump">
          ${SCHEMA.ROS.map((sys, i) => {
            const store = R.ros[sys.key] || {};
            const n = sys.symptoms.filter(s => (store[s.key] || {}).checked).length;
            return `<button class="jump-btn${n ? ' has-pos' : ''}" data-jump="${sys.key}">
              ${esc(sys.name.replace('及其器官', ''))}${n ? `<b>${n}</b>` : ''}
            </button>`;
          }).join('')}
        </div>
      </div>
    `;

    SCHEMA.ROS.forEach(sys => {
      const store = R.ros[sys.key] || {};
      const posCount = sys.symptoms.filter(s => (store[s.key] || {}).checked).length;
      const negCount = sys.symptoms.filter(s => {
        const v = store[s.key] || {};
        return !v.checked && v.negative;
      }).length;
      const chips = sys.symptoms.map(sym => {
        const v = store[sym.key] || {};
        // 三态样式：阳性（红，复用既有 .chip-sym.on）、阴性（灰，行内样式）、未问（默认白）
        // 阴性态的样式写成行内是有意的：style.css 不归本文件改，
        // 不新造 .neg 类名，免得与其他人正在改的 CSS 撞车（撞了就是"点了没反应"的死按钮）。
        const cls = v.checked ? ' on' : '';
        const negStyle = (!v.checked && v.negative)
          ? ' style="background:var(--gray-2);border-color:var(--gray-4);color:var(--gray-5);text-decoration:line-through;"'
          : '';
        const mark = v.checked ? ' ✓' : (v.negative ? ' −' : '');
        return `<button type="button" class="chip chip-sym${cls}"${negStyle} data-ros="${sys.key}" data-sym="${sym.key}">
          ${esc(sym.label)}${mark}
        </button>`;
      }).join('');
      // 默认展开含阳性项的系统，其余收起（避免一屏全是标题）
      html += `<details class="card ros-group" id="ros-group-${sys.key}" ${posCount ? 'open' : ''}>
        <summary>
          <span>${esc(sys.name)}</span>
          ${posCount ? `<span class="badge-pos">${posCount}</span>` : ''}
          ${negCount ? `<span class="tag-off" data-negcount="${sys.key}">阴性 ${negCount}</span>` : ''}
        </summary>
        <div class="btn-row">
          <button class="btn btn-ghost btn-sm" data-rosneg="${sys.key}">本系统剩余项全部标为阴性</button>
        </div>
        <div class="chips">${chips}</div>
        <div class="ros-detail" data-ros-detail="${sys.key}"></div>
      </details>`;
    });
    return html;
  }

  /** 系统回顾中某系统的阳性详情输入区 */
  function renderRosDetail(sysKey) {
    const sys = SCHEMA.ROS.find(s => s.key === sysKey);
    if (!sys) return '';
    const store = R.ros[sysKey] || {};
    const positives = sys.symptoms.filter(s => (store[s.key] || {}).checked);
    if (!positives.length) return '';
    return positives.map(sym => {
      const v = store[sym.key] || {};
      return `<div class="ros-item">
        <div class="ros-item-name">${esc(sym.label)}</div>
        <div class="row2">
          <input type="text" data-path="ros.${sysKey}.${sym.key}.time" value="${esc(v.time || '')}"
            placeholder="时间，如：3天前 / 2年">
          <input type="text" data-path="ros.${sysKey}.${sym.key}.detail" value="${esc(v.detail || '')}"
            placeholder="${esc(sym.detail || '补充描述')}">
        </div>
      </div>`;
    }).join('');
  }

                data-path="pe.vitals.${v.key}" value="${esc(R.pe.vitals[v.key] || '')}"
                placeholder="${esc(v.placeholder || '')}">
              <span class="vital-unit">${esc(v.unit)}</span>
            </label>
          `).join('')}
        </div>
        <div class="btn-row" style="margin-top:10px">
          <button class="btn btn-ghost" data-act="fillVitalsNormal">填入正常值</button>
        </div>
        <div class="live-preview" id="bmiPreview"></div>
        <div class="ros-jump pe-jump">
          ${SCHEMA.PE_COMMON.map(g => `<button class="jump-btn" data-jump="pe-${g.key}">${esc(g.name)}</button>`).join('')}
          ${(dept.special || []).map(sp => `<button class="jump-btn has-pos" data-jump="pe-special_${sp}">${esc(SCHEMA.PE_SPECIAL[sp].name)}</button>`).join('')}
        </div>
      </div>

      ${renderFocusPE(deptKey, dept)}
    `;

    // 通用查体
    SCHEMA.PE_COMMON.forEach(group => {
      const items = group.items.filter(it => !it.depts || it.depts.includes(deptKey));
      if (!items.length) return;
      const itemHtml = items.map(it => peItemHtml(group.key, group.key, it)).join('');
      html += peGroupCard({
        id: `pe-${group.key}`,
        name: group.name,
        groupKey: group.key,
        items,
        itemHtml,
        extra: ''
      });
    });

    // 专科查体
    (dept.special || []).forEach(spKey => {
      const sp = SCHEMA.PE_SPECIAL[spKey];
      if (!sp) return;
      const storeKey = 'special_' + spKey;
      const itemHtml = sp.items.map(it => peItemHtml(storeKey, storeKey, it)).join('');
      html += peGroupCard({
        id: `pe-special_${spKey}`,
        name: sp.name,
        groupKey: storeKey,
        items: sp.items,
        itemHtml,
        extra: '<span class="tag-dept">本科室</span>',
        cls: ' pe-special'
      });
    });

    return html;
  }

  /**
   * 勾选制的核心交互文案：一个查体项要不要写进病历，由学生说了算。
   *
   * ⚠️ 本轮语义变更（缺陷1第4条）：**通用查体也改成默认不勾。**
   * 旧设计是「通用查体每个病人都做 → 默认勾上，留空自动补正常描述」，
   * 结果空记录直接生成「发育正常，营养中等，神志清楚…双肺呼吸音清…腹平软」整段正常描述，
   * 学生一眼都没看过病人，工具已经替他写完了查体。
   * 现在统一规则：**勾了才算查过，没勾＝本次没做＝病历里不出现**。
   * 判定逻辑的唯一实现是 SCHEMA.peChecked（那里也已删掉「有默认描述就算已勾」那一级），
   * 这里只负责呈现。
   */
  function peItemHtml(groupKey, containerKey, it) {
    const cur = (R.pe[containerKey] || {})[it.key];
    const val = cur !== undefined && cur !== null && String(cur) !== '' ? String(cur) : '';
    const checked = SCHEMA.peChecked(R, groupKey, it.key);
    const normalText = SCHEMA.peNormalText(it);
    // 未勾选时**不预填**正常描述，输入框留空，只在 placeholder 里给提示。
    // 原来无条件预填（shown = val || normalText）会造成两个问题：
    //   ①界面上看着像"已经写了查体结果"，其实记录是空的；
    //   ②学生误以为空白框里那行字是自己写的，直接生成。
    // 已经手写的值（val）无论勾没勾都照常显示，不能把用户写过的东西藏起来。
    const shown = val || (checked ? normalText : '');
    // 四种状态：
    //   off     —— 未勾选，本次没查，病历里完全不出现这一项
    //   filled  —— 勾了且自己填了
    //   default —— 勾了但没填，生成时自动补规范正常描述
    //   blank   —— 勾了但没默认也没正常描述，必须自己填
    const state = !checked ? 'off' : (val ? 'filled' : (normalText ? 'default' : 'blank'));
    const badge = state === 'off'
      ? '<span class="tag-off">未查</span>'
      : (state === 'filled'
        ? '<span class="tag-done">已填</span>'
        : (state === 'default'
          ? '<span class="tag-auto">系统默认</span>'
          : '<span class="tag-req">需填</span>'));
    const quick = (it.options || []).map(o =>
      `<button type="button" class="chip small${shown === o ? ' on' : ''}"
        data-pequick="${containerKey}" data-pekey="${it.key}" data-val="${esc(o)}">${esc(o)}</button>`
    ).join('');
    const hint = state === 'off'
      ? `未勾选：本次没做这一项，病历里不会出现「${esc(it.label)}」。`
      : (state === 'default'
        ? '已勾选但没填具体所见，生成时自动写这句正常描述。'
        : (state === 'blank'
          ? '这一项没有默认描述，留空则病历里不会出现这句。'
          : ''));    return `<div class="pe-item is-${state}" data-pe-group="${esc(groupKey)}" data-pe-key="${esc(it.key)}">
      <div class="pe-label">
        <label class="pe-check"><input type="checkbox" data-pecheck="${esc(groupKey)}" data-pekey="${esc(it.key)}"${checked ? ' checked' : ''}><span>本次检查</span></label>
        ${esc(it.label)}${badge}
      </div>
      <div class="pe-input">
        <textarea rows="2" class="pe-text" data-path="pe.${containerKey}.${it.key}"
          placeholder="${esc(normalText || '填写检查所见')}">${esc(shown)}</textarea>
        ${hint ? `<div class="hint pe-hint">${hint}</div>` : ''}
        <details class="pe-opts">
          <summary>常用描述</summary>
          <div class="chips">${quick}</div>
        </details>
      </div>
    </div>`;
  }

  /** 一张查体卡片：标题 + 「已勾 N/M」+ 全选/全不选 + 条目列表 */
  function peGroupCard(opt) {
    const items = opt.items || [];
    const on = items.filter(it => SCHEMA.peChecked(R, opt.groupKey, it.key)).length;
    const store = (R.pe[opt.containerKey || opt.groupKey] || {});
    const open = Object.values(store).some(v => v) || (opt.cls || '').includes('pe-special');
    return `<details class="card pe-group${opt.cls || ''}" id="${opt.id}" ${open ? 'open' : ''}>
      <summary>${esc(opt.name)}${opt.extra || ''}<span class="pe-count" data-count-for="${esc(opt.groupKey)}">已勾 ${on}/${items.length}</span></summary>
      <div class="btn-row pe-tools">
        <button type="button" class="btn btn-ghost btn-sm" data-pall="1" data-pgroup="${esc(opt.groupKey)}">全选</button>
        <button type="button" class="btn btn-ghost btn-sm" data-pall="0" data-pgroup="${esc(opt.groupKey)}">全不选</button>
      </div>
      <div class="pe-body">${opt.itemHtml}</div>
    </details>`;
  }

  /**
   * 重点查体（评分表第 4 页 15 分）。
   *
   * 「会不会挑重点」是这一项考的东西：从已填的查体项里挑 3 项左右与主诉/主要
   * 阳性体征直接相关的，再写一句为什么查这些。keys 存 '组.key' 引用，
   * 由 generator.buildFocusPE 解析成「组名：项目名 + 描述」。
   */
  function renderFocusPE(deptKey, dept) {
    const f = (R.focusPE && typeof R.focusPE === 'object') ? R.focusPE : {};
    const keys = Array.isArray(f.keys) ? f.keys : [];
    const options = [];
    SCHEMA.PE_COMMON.forEach(g => {
      const items = (g.items || []).filter(it => !it.depts || it.depts.includes(deptKey));
      items.forEach(it => options.push({ ref: `${g.key}.${it.key}`, label: `${g.name} · ${it.label}` }));
    });
    (dept.special || []).forEach(spKey => {
      const sp = SCHEMA.PE_SPECIAL[spKey];
      if (!sp) return;
      (sp.items || []).forEach(it => options.push({ ref: `special_${spKey}.${it.key}`, label: `${sp.name} · ${it.label}` }));
    });

    const picked = keys.map(ref => {
      const o = options.find(x => x.ref === ref);
      return `<span class="focus-tag">${esc(o ? o.label : ref)}
        <button type="button" class="focus-x" data-focusdel="${esc(ref)}">×</button></span>`;
    }).join('');
    const rest = options.filter(o => !keys.includes(o.ref));

    return `
      <details class="card pe-group" id="pe-focus" ${keys.length || f.note ? 'open' : ''}>
        <summary>重点查体<span class="tag-score">第4页 · 15分</span></summary>
        <div class="pe-body">
          <div class="hint">挑出与主诉、主要阳性体征直接相关的 3 项左右，再补一句为什么查这些——这一项看的是「会不会挑重点」，不是查得越多越好。</div>
          <div class="focus-picked">${picked || '<span class="muted">还没有标记重点查体部位</span>'}</div>
          ${rest.length ? `
          <details class="mini-details" style="margin-top:8px">
            <summary>从查体项中添加（已标记 ${keys.length} 项）</summary>
            <div class="chips focus-chips">
              ${rest.map(o => `<button type="button" class="chip small" data-focusadd="${esc(o.ref)}">${esc(o.label)}</button>`).join('')}
            </div>
          </details>` : ''}
          ${textarea('为什么查这些（与诊断思路 / 鉴别关键点的关系）', 'focusPE.note', {
            rows: 2,
            placeholder: '如：患者以发热咳嗽为主诉，重点查双肺听诊有无啰音、有无胸腔积液征象，以判断是否合并肺炎旁积液'
          })}
        </div>
      </details>
    `;
  }

  /**
   * 辅助检查录入。
   *
   * 《诊断学》第10版 辅助检查：「应分类按检查时间顺序记录检查结果，如系在其他
   * 医疗机构所做检查，应当写明该机构名称及检查号」。原先每项只有「项目名 + 结果」
   * 两个输入框，外院机构名和检查号无处可填，日期也没有，生成时只能按录入顺序排。
   * 本轮每项补 date / hospital / no 三个输入框。
   *
   * 布局注意：`.aux-row` 在 style.css 里是 flex 且写了 `input:first-child` /
   * `input:nth-child(2)` 的宽度比例，往里平铺新输入框会打乱这两条规则、412px 下溢出。
   * 所以新增的输入框一律放到 `.aux-row` 之外的 `.row2` 或独立行里，不动既有结构。
   */
  function renderAux() {
    const items = (R.auxiliary && R.auxiliary.items) || [{ name: '', result: '' }];
    const rows = items.map((it, i) => `
      <div class="aux-item">
        <div class="aux-row">
          <input type="text" data-aux="name" data-idx="${i}" value="${esc(it.name || '')}"
            placeholder="检查项目，如：血常规">
          <input type="text" data-aux="result" data-idx="${i}" value="${esc(it.result || '')}"
            placeholder="结果">
          <button type="button" class="btn-del" data-auxdel="${i}">×</button>
        </div>
        <div class="row2">
          <input type="date" data-aux="date" data-idx="${i}" value="${esc(it.date || '')}"
            title="检查日期：填了会按日期升序排列">
          <input type="text" data-aux="hospital" data-idx="${i}" value="${esc(it.hospital || '')}"
            placeholder="检查机构（外院必填）">
        </div>
        <input type="text" data-aux="no" data-idx="${i}" value="${esc(it.no || '')}"
          placeholder="检查号（外院填写）">
      </div>
    `).join('');
    return `
      <div class="card">
        <div class="card-title">辅助检查</div>
        <div class="hint">填写本次就诊已有的检查结果；没有就留空，生成时这一节写「暂缺」。填了日期会按时间先后排列，在外院做的检查请写明机构名称与检查号。</div>
        <div id="auxList">${rows}</div>
        <button class="btn btn-ghost" data-act="addAux">+ 添加一项</button>
      </div>
    `;
  }

  function renderSummary() {
    const diagList = ((R.diagnosis || {}).confirmed) || [];
    const hints = HINTS.analyze(R);
    const warnings = GENERATOR.validate(R);

    const diagHtml = diagList.map((d, i) => `
      <div class="diag-row">
        <span class="diag-no">${i + 1}.</span>
        <input type="text" data-diag="${i}" value="${esc(d)}">
        <button type="button" class="btn-del" data-diagdel="${i}">×</button>
      </div>
    `).join('');

    const hintHtml = hints.length ? hints.map(h => `
      <div class="hint-card">
        <div class="hint-name">${esc(h.name)}</div>
        <div class="hint-text">${esc(h.hint)}</div>
        <div class="hint-note">💡 ${esc(h.note)}</div>
        <div class="hint-matched">依据：${h.matched.map(m => esc(friendlyKey(m))).join('、')}</div>
        <button class="btn btn-mini" data-addhint="${esc(h.name)}">加入诊断</button>
      </div>
    `).join('') : '<div class="empty">暂无匹配的参考提示。已有足够的阳性发现时才会出现提示。</div>';

    const warnHtml = warnings.length
      ? warnings.map(w => `<div class="warn-item">${esc(w)}</div>`).join('')
      : '<div class="ok-item">✓ 主要项目已填写完整</div>';

    return `
      <div class="card">
        <div class="card-title">质控提醒</div>
        <div class="warn-list">${warnHtml}</div>
      </div>

      <div class="card">
        <div class="card-title">诊断参考提示</div>
        <div class="hint">根据已填写的阳性发现自动匹配，仅供参考，请自行判断后决定是否采用。</div>
        ${hintHtml}
      </div>

      <div class="card">
        <div class="card-title">初步诊断</div>
        <div class="hint">按主次顺序排列：主要疾病在前，次要疾病在后，并发症列于有关主病之后，伴发病最后。一时难以确定的在病名后加「？」，如「发热待查，肠结核？」。</div>
        <div id="diagList">${diagHtml || '<div class="empty">尚未添加诊断</div>'}</div>
        <div class="diag-add">
          <input type="text" id="diagNew" placeholder="输入诊断后点添加">
          <button class="btn" data-act="addDiag">添加</button>
        </div>
        ${input('医师签名', 'diagnosis.signature', {
          placeholder: '签全名，如：李四',
          hint: '入院记录要求书写者在初步诊断右下角签全名；留空则病历里不出现签名行。'
        })}
      </div>

      <div class="card">
        <div class="card-title">病历摘要
          <button class="btn-mini" data-act="draftSummary">自动生成初稿</button>
        </div>
        <div class="hint">留空则使用自动生成的摘要；点右上角可先生成初稿，再按自己的表述修改。</div>
        ${textarea('摘要', 'summary', {
          rows: 5,
          placeholder: '留空自动生成'
        })}
      </div>

      ${renderSoap()}
      ${renderDischarge()}
    `;
  }

  /* ---------------------- 首次病程录（SOAP） ---------------------- */

  /**
   * 首次病程录的录入区（评分表第 5 页 100 分；第 6 页「首次病程记录」20 分）。
   *
   * 设计要点：
   *   · SOAP 是「归纳」而不是「复制」现病史，所以每一项都能手写；
   *     留空时生成器才用已填内容兜底，并把兜底内容标成「待补充」。
   *   · 「诊断依据」「鉴别诊断」「诊疗计划」按诊断逐条展开，可增可删。
   *   · 每一项都给出它在评分表里的分值与页码，方便写完就知道值多少分。
   */
  function renderSoap() {
    const soap = R.soap || {};
    const s = soap.s || {};
    const o = soap.o || {};
    const a = soap.a || {};
    const p = soap.p || {};
    const basis = Array.isArray(a.basisDetail) ? a.basisDetail : [];
    const diff = Array.isArray(a.diff) ? a.diff : [];
    const plans = Array.isArray(p.perDiagnosis) ? p.perDiagnosis : [];

    const basisRows = basis.map((row, i) => `
      <div class="soap-row">
        <div class="soap-row-head">
          <span class="soap-row-title">诊断 ${i + 1}</span>
          <button type="button" class="btn-del" data-arrdel="soap.a.basisDetail" data-idx="${i}">×</button>
        </div>
        <input type="text" data-arr="soap.a.basisDetail" data-field="diagnosis" data-idx="${i}"
          value="${esc(row.diagnosis || '')}" placeholder="诊断名称（与初步诊断一致）">
        <input type="text" data-arr="soap.a.basisDetail" data-field="history" data-idx="${i}"
          value="${esc(row.history || '')}" placeholder="① 病史依据">
        <input type="text" data-arr="soap.a.basisDetail" data-field="pe" data-idx="${i}"
          value="${esc(row.pe || '')}" placeholder="② 体检依据">
        <input type="text" data-arr="soap.a.basisDetail" data-field="aux" data-idx="${i}"
          value="${esc(row.aux || '')}" placeholder="③ 辅助检查依据">
      </div>
    `).join('');

    const diffRows = diff.map((row, i) => `
      <div class="soap-row">
        <div class="soap-row-head">
          <span class="soap-row-title">鉴别 ${i + 1}</span>
          <button type="button" class="btn-del" data-arrdel="soap.a.diff" data-idx="${i}">×</button>
        </div>
        <input type="text" data-arr="soap.a.diff" data-field="diagnosis" data-idx="${i}"
          value="${esc(row.diagnosis || '')}" placeholder="需要鉴别的疾病">
        <input type="text" data-arr="soap.a.diff" data-field="why" data-idx="${i}"
          value="${esc(row.why || '')}" placeholder="支持点：为什么考虑它">
        <input type="text" data-arr="soap.a.diff" data-field="against" data-idx="${i}"
          value="${esc(row.against || '')}" placeholder="不支持点：哪一点与本例不符">
        <input type="text" data-arr="soap.a.diff" data-field="points" data-idx="${i}"
          value="${esc(row.points || '')}" placeholder="鉴别要点（可留空）">
      </div>
    `).join('');

    const planRows = plans.map((row, i) => `
      <div class="soap-row">
        <div class="soap-row-head">
          <span class="soap-row-title">诊断 ${i + 1}</span>
          <button type="button" class="btn-del" data-arrdel="soap.p.perDiagnosis" data-idx="${i}">×</button>
        </div>
        <input type="text" data-arr="soap.p.perDiagnosis" data-field="diagnosis" data-idx="${i}"
          value="${esc(row.diagnosis || '')}" placeholder="诊断名称（与初步诊断一致）">
        <input type="text" data-arr="soap.p.perDiagnosis" data-field="exam" data-idx="${i}"
          value="${esc(row.exam || '')}" placeholder="拟完善的检查">
        <input type="text" data-arr="soap.p.perDiagnosis" data-field="treatment" data-idx="${i}"
          value="${esc(row.treatment || '')}" placeholder="治疗措施">
      </div>
    `).join('');

    return `
      <details class="card mini-details soap-card" id="soapCard">
        <summary>首次病程录（SOAP）<span class="tag-score">第5页 · 100分</span></summary>
        <div class="hint">同一份内容同时服务第 5 页「首次病程录」（100 分）与第 6 页「首次病程记录」（20 分），写一次两处都用得上。全部留空也能生成一版兜底稿，但只有这里手写的内容才算真正归纳过。</div>
        <div class="btn-row" style="margin:8px 0 12px">
          <button class="btn btn-ghost" data-act="draftSoap">按已填内容生成初稿</button>
        </div>

        <div class="soap-sec">
          <div class="soap-sec-title">S 主观资料 <span class="muted">病历特点 10 + 与病史一致 5</span></div>
          ${textarea('病历特点（概括现病史要点：起病、诱因、主要症状、进展）', 'soap.s.summary', {
            rows: 3,
            placeholder: '留空则自动归纳现病史，并标注「待补充」'
          })}
          ${input('与病史采集一致性的补充说明', 'soap.s.consistency', {
            placeholder: '如：上述病史由患者本人陈述，与现病史记录一致'
          })}
        </div>

        <div class="soap-sec">
          <div class="soap-sec-title">O 客观资料 <span class="muted">查体 5 + 辅助检查 5</span></div>
          ${textarea('对诊断有意义的体格检查', 'soap.o.pe', {
            rows: 2,
            placeholder: '留空则由阳性体征自动生成（只取阳性，不抄整段查体）'
          })}
          ${textarea('与疾病相关的辅助检查结果', 'soap.o.aux', {
            rows: 2,
            placeholder: '留空则由「辅助检查」页自动生成'
          })}
        </div>

        <div class="soap-sec">
          <div class="soap-sec-title">A 评估与鉴别 <span class="muted">依据 15 + 主次 10 + 鉴别 10 + 不跑题 5</span></div>
          ${textarea('诊断依据概述（简洁完整、不堆砌）', 'soap.a.basis', {
            rows: 3,

    `;
  }

  /* ---------------------- 出院记录 ---------------------- */

  /**

          rows: 3, placeholder: '如：无发热，咳嗽明显减轻，双肺呼吸音清，复查血常规正常'

  function friendlyKey(k) {
    const map = {
      'cc:发热': '主诉/现病史提及发热',
      'cc:咳嗽': '主诉/现病史提及咳嗽',
      'cc:咳痰': '主诉/现病史提及咳痰',
      'cc:咯血': '主诉/现病史提及咯血',
      'cc:胸痛': '主诉/现病史提及胸痛',
      'cc:胸闷': '主诉/现病史提及胸闷',
      'cc:气促': '主诉/现病史提及气促',
      'cc:喘息': '主诉/现病史提及喘息',
      'cc:心悸': '主诉/现病史提及心悸',
      'cc:腹痛': '主诉/现病史提及腹痛',
      'cc:上腹痛': '主诉/现病史提及上腹痛',
      'cc:右上腹痛': '主诉/现病史提及右上腹痛',
      'cc:转移性右下腹痛': '主诉/现病史提及转移性右下腹痛',
      'cc:腹胀': '主诉/现病史提及腹胀',
      'cc:黑便': '主诉/现病史提及黑便',
      'cc:呕血': '主诉/现病史提及呕血',
      'cc:乏力': '主诉/现病史提及乏力',
      'cc:消瘦': '主诉/现病史提及消瘦',
      'vital:tempUp': '体温升高',
      'vital:tachy': '心率增快',
      'vital:tachypnea': '呼吸增快',
      'vital:bpUp': '血压升高',
      'vital:bpDown': '血压下降',
      'vital:bmiHigh': 'BMI 偏高',
      'smoke:有': '有吸烟史',
      'risk:smoke': '吸烟危险因素',
      'risk:alcohol': '饮酒史',
      'trauma:有': '有外伤史',
      'gender:女': '女性',
      'age:elderly': '年龄≥65岁',
      'age:fertile': '育龄期',
      'age:child': '儿童',
      'menstruation:delay': '月经推迟/停经'
    };
    if (map[k]) return map[k];
    if (k.startsWith('ros:')) {
      const [, sysKey, symKey] = k.split('.');
      const sys = SCHEMA.ROS.find(s => s.key === sysKey);
      const sym = sys && sys.symptoms.find(s => s.key === symKey);
      return sym ? `${sys.name}：${sym.label}` : k;
    }
    if (k.startsWith('pmh:')) return `既往史：${k.slice(4)}`;
    if (k.startsWith('aux:')) return `辅助检查：${k.slice(4)}`;
    if (k.startsWith('pev:')) {
      const body = k.slice(4);
      const eq = body.indexOf('=');
      return eq > 0 ? `查体：${body.slice(eq + 1)}` : `查体：${body}`;
    }
    if (k.startsWith('pe:')) return `查体异常：${k.slice(3)}`;
    return k;
  }
